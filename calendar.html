<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendar | BAS Warehouse</title>
<link rel="icon" href="logo.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#17196A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BAS Warehouse">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<meta name="color-scheme" content="only light">
<link rel="stylesheet" href="bas.css">
<script>(function(){var t="light";try{t=localStorage.getItem("basTheme")==="dark"?"dark":"light"}catch(e){}document.documentElement.dataset.theme=t;var m=document.querySelector('meta[name="color-scheme"]');if(m)m.content="only "+t})()</script>
</head>
<body data-team>
<main class="page">
  <div class="head">
    <div><p class="eyebrow">Smart calendar</p><h1>Pickups, returns <em>&amp; events</em></h1>
      <p class="sub">Every booking, every return date, and every meeting, trip and camp. A red ! means a clash on that day.</p></div>
  </div>
  <div id="view"><div class="loading">Loading…</div></div>
</main>
<div class="overlay" id="sheet" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="common.js"></script>
<script src="i18n.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = s => BAS.esc(s);
let BY = {}, RES = [], EVENTS = [], AM = [], FILTER = "all", CM = null, SEL = BAS.todayISO(), SHOW = { pick: true, ret: true, ev: true };

(async function () {
  await BAS.init("calendar");
  if (!BAS.requireApproved()) return;
  if (!BAS.isAdmin()) { location.replace("section.html"); return; }
  const t = new Date(); CM = { y: t.getFullYear(), m: t.getMonth() };
  if ("scrollRestoration" in history) history.scrollRestoration = "manual";
  await load(); window.scrollTo(0, 0);
})();

async function load() {
  try {
    const st = await BAS.loadStock(); BY = st.byId;
    RES = (await BAS.loadReservations(BY)).filter(r => r.status !== "Cancelled" && r.status !== "Rejected");
    EVENTS = await BAS.q(supabaseClient.from("events").select("*").order("start_date"));
    // attendance meetings that have no booking and no calendar event: show them too
    const ys = (BAS.settings && BAS.settings.att_year_start) || "2000-01-01";
    let am = await supabaseClient.from("att_meetings").select("*").is("reservation_id", null).is("event_id", null).gte("meet_date", ys);
    if (am.error) am = await supabaseClient.from("att_meetings").select("*").is("reservation_id", null).gte("meet_date", ys);
    AM = (am.data || []).map(m => ({ id: "m" + m.id, _att: m.id, title: m.title || "Meeting", kind: "Meeting", start_date: m.meet_date, end_date: null, start_time: m.start_time, section_id: m.section_id, service_id: null, place: null, note: null }));
    draw();
  } catch (e) { $("view").innerHTML = '<div class="msg err">' + esc(BAS.errText(e)) + "</div>"; }
}

function pass(secId, svcId) {
  if (FILTER === "all") return true;
  if (FILTER[0] === "s") return secId === Number(FILTER.slice(1));
  if (FILTER[0] === "v") return svcId === Number(FILTER.slice(1));
  return true;
}

// clashes: the same item booked by two different stages/services for the same day, or two groups in the same place
function clashes(res, events) {
  const out = {};
  const add = (d, text) => { (out[d] = out[d] || []).push(text); };
  const byDay = {};
  res.filter(r => BAS.OPEN.indexOf(r.status) >= 0).forEach(r => { (byDay[r.meeting_date] = byDay[r.meeting_date] || []).push(r); });
  Object.keys(byDay).forEach(d => {
    const L = byDay[d], items = {};
    L.forEach(r => r.items.forEach(i => { const k = i.item_id + ":" + (i.variant_id || ""); (items[k] = items[k] || []).push({ r, i }); }));
    Object.keys(items).forEach(k => {
      const who = [...new Set(items[k].map(x => BAS.borrowerName(x.r.section_id, x.r.service_id, x.r.who_name)))];
      if (who.length > 1) {
        const p = k.split(":"), it = BY[Number(p[0])], need = items[k].reduce((t, x) => t + x.i.quantity, 0), total = it ? it.quantity + it.repaired_found : 0;
        add(d, "<b>" + esc(BAS.itemLabel(BY, Number(p[0]), p[1] ? Number(p[1]) : null)) + "</b> booked by " + who.map(w => "<bdi>" + esc(w) + "</bdi>").join(" and ") + " (" + need + " pieces" + (total ? " of " + total : "") + ")");
      }
    });
    const places = {};
    L.forEach(r => { const pl = (r.place || "").trim().toLowerCase(); if (pl) (places[pl] = places[pl] || new Set()).add(BAS.borrowerName(r.section_id, r.service_id, r.who_name)); });
    events.filter(e => e.start_date <= d && (e.end_date || e.start_date) >= d && e.place).forEach(e => {
      const pl = e.place.trim().toLowerCase(); (places[pl] = places[pl] || new Set()).add(e.section_id || e.service_id ? BAS.borrowerName(e.section_id, e.service_id, e.who_name) : "All stages");
    });
    Object.keys(places).forEach(pl => { if (places[pl].size > 1) add(d, "Same place <b>" + esc(pl) + "</b>: " + [...places[pl]].map(w => "<bdi>" + esc(w) + "</bdi>").join(", ")); });
  });
  return out;
}

function draw() {
  const res = RES.filter(r => pass(r.section_id, r.service_id));
  const evs = EVENTS.concat(AM).filter(e => FILTER === "all" || (!e.section_id && !e.service_id) || pass(e.section_id, e.service_id));
  let items = BAS.calItems(res, evs, true).filter(x => ((x.cls === "pick" || (x.ref.res && (x.cls === "camp" || x.cls === "trip"))) && SHOW.pick) || ((x.cls === "ret" || x.cls === "late") && SHOW.ret) || (x.ref.ev && SHOW.ev));
  const cf = clashes(res, evs);
  const label = new Date(CM.y, CM.m, 1).toLocaleDateString(BAS.loc(), { month: "long", year: "numeric" });
  const filt = '<select id="fWho" aria-label="Show"><option value="all">All stages and services</option><optgroup label="Scout stages">' +
    BAS.sections.map(s => '<option value="s' + s.id + '"' + (FILTER === "s" + s.id ? " selected" : "") + ">" + esc(s.name_ar) + " · " + esc(s.name_en) + "</option>").join("") + "</optgroup>" +
    (BAS.services.length ? '<optgroup label="Church services">' + BAS.services.map(v => '<option value="v' + v.id + '"' + (FILTER === "v" + v.id ? " selected" : "") + ">" + esc(v.name_ar) + "</option>").join("") + "</optgroup>" : "") + "</select>";
  const upcoming = res.filter(r => BAS.PRE.indexOf(r.status) >= 0 && r.meeting_date >= BAS.todayISO()).sort((a, b) => a.meeting_date > b.meeting_date ? 1 : -1).slice(0, 6);
  const dues = res.filter(r => BAS.OUT.indexOf(r.status) >= 0).sort((a, b) => (a.return_by || "") > (b.return_by || "") ? 1 : -1).slice(0, 6);
  $("view").innerHTML = '<div class="cols"><div>' +
    '<div class="cal-head"><button class="btn line sm" id="cPrev" aria-label="Previous month">‹</button><h2>' + esc(label) + '</h2><button class="btn line sm" id="cNext" aria-label="Next month">›</button><button class="btn line sm" id="cToday">Today</button>' +
    '<button class="btn gold sm" id="cAdd" style="margin-left:auto">+ Add event</button></div>' +
    '<div class="toolbar">' + (BAS.isAdmin() ? filt : "") +
    '<label class="check"><input type="checkbox" id="sPick"' + (SHOW.pick ? " checked" : "") + '> Pickups</label><label class="check"><input type="checkbox" id="sRet"' + (SHOW.ret ? " checked" : "") + '> Returns</label><label class="check"><input type="checkbox" id="sEv"' + (SHOW.ev ? " checked" : "") + "> Events</label></div>" +
    BAS.calendarHTML(CM.y, CM.m, items, SEL, cf) +
    '<div class="legend"><span class="ev pick">📦 Pickup</span><span class="ev ret">↩ Return due</span><span class="ev late">Overdue</span><span class="ev meet">👥 Meeting</span><span class="ev trip">🚌 Trip</span><span class="ev camp">⛺ Camp</span></div>' +
    '</div><div><div id="dayBox"></div>' +
    '<div class="group-title">Next pickups</div>' + (upcoming.length ? upcoming.map(r => '<div class="panel" style="padding:11px 13px"><b>' + esc(BAS.fmtDate(r.meeting_date, true)) + "</b> · " + BAS.borrowerHTML(r) + ' · #' + r.id + '<div class="meta">' + esc(r.meeting_time || "") + " · " + esc(r.place || "") + " · " + BAS.statusBadge(r.status) + "</div></div>").join("") : '<div class="empty">No pickups coming.</div>') +
    '<div class="group-title">Waiting to come back</div>' + (dues.length ? dues.map(r => '<div class="panel" style="padding:11px 13px"><b class="' + (BAS.isOverdue(r) ? "bad" : "") + '">' + esc(BAS.fmtDate(r.return_by, true)) + "</b> · " + BAS.borrowerHTML(r) + " · #" + r.id + (BAS.isOverdue(r) ? ' <span class="pill late">OVERDUE</span>' : "") + "</div>").join("") : '<div class="empty">Nothing out.</div>') +
    "</div></div>";
  $("cPrev").onclick = () => { CM.m--; if (CM.m < 0) { CM.m = 11; CM.y--; } draw(); };
  $("cNext").onclick = () => { CM.m++; if (CM.m > 11) { CM.m = 0; CM.y++; } draw(); };
  $("cToday").onclick = () => { const t = new Date(); CM = { y: t.getFullYear(), m: t.getMonth() }; SEL = BAS.todayISO(); draw(); };
  $("cAdd").onclick = () => eventSheet(null, SEL);
  if ($("fWho")) $("fWho").onchange = e => { FILTER = e.target.value; draw(); };
  $("sPick").onchange = e => { SHOW.pick = e.target.checked; draw(); };
  $("sRet").onchange = e => { SHOW.ret = e.target.checked; draw(); };
  $("sEv").onchange = e => { SHOW.ev = e.target.checked; draw(); };
  $("view").querySelectorAll("[data-day]").forEach(d => d.onclick = () => { SEL = d.dataset.day; draw(); if (innerWidth < 860) $("dayBox").scrollIntoView({ behavior: "smooth" }); });
  dayBox(items, cf);
}

function dayBox(items, cf) {
  const L = items.filter(x => x.date === SEL);
  let h = '<div class="group-title">' + esc(BAS.fmtDate(SEL, true)) + "</div>";
  if (cf[SEL]) h += '<div class="msg err"><b>Clash on this day</b><br>' + cf[SEL].join("<br>") + "</div>";
  h += L.length ? L.map(x => {
    if (x.ref.ev) {
      const e = EVENTS.concat(AM).find(y => y.id === x.ref.ev), mine = !e._att && (BAS.isAdmin() || e.created_by === BAS.user.id);
      return '<div class="panel" style="padding:11px 13px"><b>' + esc(e.title) + '</b> <span class="pill mut">' + esc(e.kind.toUpperCase()) + "</span>" +
        '<div class="meta">' + (e.section_id || e.service_id ? '<bdi>' + esc(BAS.borrowerName(e.section_id, e.service_id, e.who_name)) + "</bdi>" : "All stages") +
        (e.start_time ? " · " + esc(fmtT(e.start_time)) : "") + (e.end_date && e.end_date !== e.start_date ? " · " + esc(BAS.fmtDate(e.start_date)) + " → " + esc(BAS.fmtDate(e.end_date)) : "") + (e.place ? " · " + esc(e.place) : "") + (e.note ? " · " + esc(e.note) : "") + "</div>" +
        '<div class="actions">' + (e._att ? '<a class="btn line sm" href="attendance.html?s=' + e.section_id + "&m=" + e._att + '#take">📋 Attendance</a>' : BAS.eventLinks(e)) +
        (e.kind === "Meeting" && !e._att && e.section_id ? '<span class="meta">' + esc(T("Also in Attendance")) + "</span>" : "") + (mine ? '<button class="btn line sm" data-eedit="' + e.id + '">Edit</button><button class="btn danger sm" data-edel="' + e.id + '">Delete</button>' : "") + "</div>" + "</div>";
    }
    const r = RES.find(y => y.id === x.ref.res);
    return '<div class="panel" style="padding:11px 13px">' + ({ pick: "📦 Pickup", camp: "⛺ Camp", trip: "🚌 Trip" }[x.cls] || "↩ Return due") + " · " + BAS.borrowerHTML(r) + " · #" + r.id + " " + BAS.statusBadge(r.status) +
      '<div class="meta">' + esc(r.meeting_time || "") + " · " + esc(r.place || "") + "</div><div class=\"meta\">" + r.items.map(i => esc(BAS.lineName(i)) + " ×" + (x.cls === "ret" || x.cls === "late" ? i.out : i.quantity)).join(", ") + "</div>" +
      '<div class="actions"><a class="lnk" href="' + (BAS.isAdmin() ? BAS.borrowerURL(r.section_id, r.service_id) : "section.html") + "#requests\">Open</a></div></div>";
  }).join("") : '<div class="empty">Nothing on this day.</div>';
  $("dayBox").innerHTML = h;
  $("dayBox").querySelectorAll("[data-eedit]").forEach(b => b.onclick = () => eventSheet(EVENTS.find(e => e.id === Number(b.dataset.eedit))));
  $("dayBox").querySelectorAll("[data-edel]").forEach(b => b.onclick = async () => {
    if (!confirm("Delete this event?")) return;
    const { error } = BAS.isAdmin() ? await supabaseClient.rpc("trash_item", { p_kind: "event", p_id: b.dataset.edel }) : await supabaseClient.from("events").delete().eq("id", Number(b.dataset.edel));
    if (error) return BAS.toast(BAS.errText(error), "err");
    load();
  });
}

const T = x => BAS.tr ? BAS.tr(x) : x;
const fmtT = t => { if (!t) return ""; let [h, m] = t.slice(0, 5).split(":").map(Number); const ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12; return BAS.time(h + ":" + String(m).padStart(2, "0") + " " + ap); };
function eventSheet(e, day) {
  const o = $("sheet");
  e = e || { title: "", kind: "Meeting", start_date: day || BAS.todayISO(), end_date: "", place: "", note: "", section_id: BAS.isAdmin() ? null : BAS.profile.section_id, service_id: null };
  const cur = e.service_id ? "v" + e.service_id : e.section_id ? "s" + e.section_id : "all";
  const who = BAS.isAdmin() ? '<div class="field"><label>For</label><select id="eW"><option value="all">All stages</option>' + BAS.sections.map(s => '<option value="s' + s.id + '"' + (cur === "s" + s.id ? " selected" : "") + ">" + esc(s.name_ar) + "</option>").join("") +
    BAS.services.map(v => '<option value="v' + v.id + '"' + (cur === "v" + v.id ? " selected" : "") + ">" + esc(v.name_ar) + " (service)</option>").join("") + "</select></div>"
    : '<div class="field"><label>For</label><div class="inline-in">' + BAS.secHTML(BAS.profile.section_id) + "</div></div>";
  o.innerHTML = '<div class="sheet"><h2>' + (e.id ? "Edit event" : "New event") + '</h2><p class="sub">Meetings, trips and camps. Events don\'t book equipment; use Book items for that.</p><div class="panel">' +
    '<div class="grid2"><div class="field"><label>Title</label><input id="eT" value="' + esc(e.title) + '" placeholder="Friday meeting, Winter camp…"></div><div class="field"><label>Type</label><select id="eK">' +
    ["Meeting", "Trip", "Camp", "Other"].map(k => "<option" + (k === e.kind ? " selected" : "") + ">" + k + "</option>").join("") + "</select></div></div>" + who +
    '<div class="grid2"><div class="field"><label>Start</label><input type="date" id="eS" value="' + esc(e.start_date) + '"></div><div class="field"><label>End (trips and camps)</label><input type="date" id="eE" value="' + esc(e.end_date || "") + '"></div></div>' +
    '<div class="grid2"><div class="field"><label>Time (meetings)</label><input type="time" id="eTm" value="' + esc(e.start_time ? e.start_time.slice(0, 5) : "") + '"></div><div class="meta" style="align-self:end;padding-bottom:12px">' + esc(T("A meeting for a stage (or all stages) also shows in Attendance.")) + "</div></div>" +
    '<div class="grid2"><div class="field"><label>Place</label><input id="eP" value="' + esc(e.place || "") + '"></div><div class="field"><label>Note</label><input id="eN" value="' + esc(e.note || "") + '"></div></div></div>' +
    '<div id="eErr" class="msg err" hidden></div><div class="actions"><button class="btn gold" id="eGo">Save</button><button class="btn line" id="eBack">Back</button></div></div>';
  o.hidden = false;
  $("eBack").onclick = () => { o.hidden = true; };
  o.onclick = ev => { if (ev.target === o) o.hidden = true; };
  $("eGo").onclick = async () => {
    const row = { title: $("eT").value.trim(), kind: $("eK").value, start_date: $("eS").value, end_date: $("eE").value || null, place: $("eP").value.trim() || null, note: $("eN").value.trim() || null, start_time: $("eTm").value || null };
    const fail = m => { $("eErr").textContent = m; $("eErr").hidden = false; };
    if (!row.title || !row.start_date) return fail("Write the title and the start date.");
    if (row.end_date && row.end_date < row.start_date) return fail("The end is before the start.");
    if (BAS.isAdmin()) { const w = $("eW").value; row.section_id = w[0] === "s" ? Number(w.slice(1)) : null; row.service_id = w[0] === "v" ? Number(w.slice(1)) : null; }
    else if (!e.id) row.section_id = BAS.profile.section_id;
    const r = e.id ? await supabaseClient.from("events").update(row).eq("id", e.id) : await supabaseClient.from("events").insert(Object.assign(row, { created_by: BAS.user.id }));
    if (r.error) return fail(BAS.errText(r.error));
    o.hidden = true; SEL = row.start_date; BAS.toast("Event saved"); load();
  };
}
</script>
</body>
</html>
