<!DOCTYPE html>

<meta name="theme-color" content="#17196A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

<script>(function(){var t="light";try{t=localStorage.getItem("basTheme")==="dark"?"dark":"light"}catch(e){}document.documentElement.dataset.theme=t;var m=document.querySelector('meta[name="color-scheme"]');if(m)m.content="only "+t})()</script>

<body>
<main class="page">
  <div class="head"><div><p class="eyebrow" id="eyebrow">Every scout's details, kept for good</p><h1 data-ar="سجلات <em>الكشافة</em>">Group <em>records</em></h1></div>
    <div class="actions" style="margin:0"><button class="btn gold sm" id="intake" hidden>📥 Parents' forms</button><button class="btn line sm" id="dl" hidden>⬇ Download (Excel)</button></div></div>
  <div class="toolbar">
    <input id="q" type="search" placeholder="Search a name, parent, phone, school, address…" autocomplete="off" dir="auto">
    <select id="fSec" hidden aria-label="Stage"></select>
    <select id="fWho" aria-label="Who"><option value="3ayel">Scouts</option><option value="kada">Kada</option><option value="all">Scouts and kada</option></select>
    <select id="fState" aria-label="Show"><option value="now">Current scouts</option><option value="chk">✱ Needs checking</option><option value="noen">🔤 No English name yet</option><option value="dup" id="fDup" hidden>👥 Possible doubles</option><option value="arch">Archived</option></select>
  </div>
  <p class="meta" id="count"></p>
  <div id="view"><div class="empty">Loading…</div></div>
</main>
<div class="overlay" id="sheet" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="common.js"></script>
<script src="i18n.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id), esc = s => BAS.esc(s), T = x => BAS.tr ? BAS.tr(x) : x;
const QS = new URLSearchParams(location.search);
const YEARS = ["KG1", "KG2"].concat([1, 2, 3, 4, 5, 6].map(n => n + " ابتدائي"), [1, 2, 3].map(n => n + " إعدادي"), [1, 2, 3].map(n => n + " ثانوي"), [1, 2, 3, 4, 5].map(n => "جامعة " + n), ["خريج / بيشتغل"]);
let ALL = [], TAL = [], CAN_EDIT = false;
const FIELDS = [
  ["national_id", "National ID", "nid"], ["scout_no", "Scout number"], ["birthday", "Birthday", "date"], ["school_year", "School year", "year"], ["school", "School"], ["address", "Address", "area"], ["confession_father", "أب الاعتراف", "father"],
  ["phone", "Scout's phone", "tel"], ["job", "Their work (if they work)"], ["father_name", "Father's name"], ["father_phone", "Father's phone", "tel"], ["father_job", "Father's job"],
  ["father_call_ok", "OK to call the father?", "yn"], ["father_national_id", "Father's national ID", "nid"],
  ["mother_name", "Mother's name"], ["mother_phone", "Mother's phone", "tel"], ["mother_job", "Mother's job"], ["mother_works", "Does the mother work?", "yn"], ["mother_national_id", "Mother's national ID", "nid"],
  ["joined_on", "Joined the scouts on", "date"]];
const LABEL = { merged: "Joined with", check_note: "Needs checking", name: "Name", photo_path: "Photo", is_active: "Archived / back", section_id: "Stage", tali3a_id: "Tali3a", added: "Added" };
FIELDS.forEach(f => LABEL[f[0]] = f[1]);
// scout number only where the stage uses it (متقدم ورائدات, مرشح جوالة)
const hasNo = sid => !!(BAS.allSections.find(s => s.id === sid) || {}).has_scout_no;
const pf = p => FIELDS.filter(f => f[0] !== "scout_no" || hasNo(p.section_id) || p.scout_no);

const tName = id => (TAL.find(t => t.id === id) || {}).name || "";
const secName = id => BAS.sectionName(id);
const waNum = n => { let d = String(n).replace(/\D/g, ""); if (d.startsWith("00")) d = d.slice(2); if (d.startsWith("0")) d = "2" + d; return d; };
const yn = v => v === true ? T("Yes") : v === false ? T("No") : "";
const show = (p, k) => k === "birthday" || k === "joined_on" ? (p[k] ? BAS.fmtDate(p[k]) : "") : k === "mother_works" || k === "father_call_ok" ? yn(p[k]) : (p[k] || "");
const chk = p => p.check_note ? ' <span class="chk" title="' + esc(T("Needs checking") + ": " + p.check_note) + '">✱</span>' : "";
// the same name in Arabic and English → the same consonants (مينا عادل = Mina Adel = M N · D L)
const SK_AR = { "ب": "B", "پ": "B", "ت": "T", "ث": "T", "ط": "T", "ج": "G", "چ": "G", "ح": "H", "خ": "H", "ه": "H", "د": "D", "ض": "D", "ذ": "Z", "ر": "R", "ز": "Z", "س": "S", "ص": "S", "ش": "X", "ف": "F", "ڤ": "F", "ق": "K", "ك": "K", "ک": "K", "ل": "L", "م": "M", "ن": "N" };
const skWord = w => {
  let o = "";
  if (/[؀-ۿ]/.test(w)) { for (const ch of w) o += SK_AR[ch] || ""; }
  else {
    w = w.toLowerCase().replace(/[^a-z]/g, "").replace(/^chr/, "kr").replace(/michael/g, "maikel").replace(/sh|ch/g, "X").replace(/kh/g, "H").replace(/ph/g, "F").replace(/th/g, "T").replace(/gh/g, "G");
    for (const ch of w) o += ({ b: "B", p: "B", t: "T", j: "G", g: "G", h: "H", d: "D", r: "R", z: "Z", s: "S", c: "K", k: "K", q: "K", x: "KS", f: "F", v: "F", l: "L", m: "M", n: "N", X: "X", H: "H", F: "F", T: "T", G: "G" })[ch] || "";
  }
  return o.replace(/(.)\1+/g, "$1");
};
const skName = n => String(n || "").replace(/عبد\s+/g, "عبد").replace(/\babd\s*el\s*/gi, "abdel").split(/\s+/).filter(Boolean).map(skWord).filter(Boolean);
const isAr = n => /[؀-ۿ]/.test(n || "");
// two records look like one scout: same stage, same first and father's name (in any spelling),
// and the shorter name's other parts all appear in the longer one, in order
function doubles() {
  const act = ALL.filter(p => p.is_active && p.role === "3ayel"), out = [], sk = new Map(act.map(p => [p.id, skName(p.name)]));
  // Arabic with Arabic: compare the letters themselves (ماريان ≠ مارينا), only spelling variants (أ/ا, ى/ي, ة/ه) count as the same
  const arW = n => BAS.norm(n).replace(/عبد\s+/g, "عبد").replace(/[ً-ْـ]/g, "").split(/\s+/).filter(Boolean);
  const off1 = (x, y) => { if (x === y) return true; if (Math.min(x.length, y.length) < 3 || Math.abs(x.length - y.length) > 1) return false;
    let i = 0, j = 0, e = 0; while (i < x.length && j < y.length) { if (x[i] === y[j]) { i++; j++; continue; } if (++e > 1) return false; if (x.length > y.length) i++; else if (y.length > x.length) j++; else { i++; j++; } } return e + (x.length - i) + (y.length - j) <= 1; };
  const sub = (s, l, eq) => { let k = 0; for (const w of l) if (k < s.length && eq(w, s[k])) k++; return k === s.length; };
  const match = (sa, sb, eq) => { const [s, l] = sa.length <= sb.length ? [sa, sb] : [sb, sa]; return s.length >= 2 && eq(s[0], l[0]) && eq(s[1], l[1]) && sub(s.slice(2), l.slice(2), eq); };
  const yi = p => YEARS.indexOf(p.school_year || "");
  for (let x = 0; x < act.length; x++) for (let y = x + 1; y < act.length; y++) {
    const a = act[x], b = act[y];
    if (a.section_id !== b.section_id) continue;
    if (a.national_id && b.national_id && a.national_id !== b.national_id) continue;
    if (a.gender && b.gender && a.gender !== b.gender) continue;
    const mixed = isAr(a.name) !== isAr(b.name), why = [];
    let sure;
    if (mixed) {
      if (match(sk.get(a.id), sk.get(b.id), (u, v) => u === v)) sure = true;
      else if (match(sk.get(a.id), sk.get(b.id), off1)) { sure = false; why.push(T("names close but not the same")); }
      else continue;
    } else {
      const wa = isAr(a.name) ? arW(a.name) : sk.get(a.id), wb = isAr(b.name) ? arW(b.name) : sk.get(b.id);
      if (!match(wa, wb, (u, v) => u === v)) continue;
      sure = true;
    }
    if (yi(a) >= 0 && yi(b) >= 0 && Math.abs(yi(a) - yi(b)) > 1) { sure = false; why.push(T("different school year") + ": " + a.school_year + " / " + b.school_year); }
    if (a.tali3a_id && b.tali3a_id && a.tali3a_id !== b.tali3a_id) { sure = false; why.push(T("different tali3a")); }
    out.push({ a: mixed && isAr(a.name) ? b : a, b: mixed && isAr(a.name) ? a : b, sure, why });
  }
  return out.sort((p, q) => q.sure - p.sure);
}
const arN = p => p.name_ar || p.name;
const enN = p => (p.name_ar && p.name !== p.name_ar && !isAr(p.name)) ? p.name : "";
const nm2 = p => '<b dir="auto">' + esc(arN(p)) + "</b>" + chk(p) + (p.role === "kada" ? ' <span class="pill">' + esc(T("Kada")) + "</span>" : "") + (enN(p) ? '<br><small class="mut" dir="ltr">' + esc(enN(p)) + "</small>" : "");
const hay = p => BAS.norm([p.name, p.name_ar, p.national_id, p.scout_no, p.confession_father, p.check_note, p.father_name, p.mother_name, p.phone, p.father_phone, p.mother_phone, p.school, p.address, p.school_year, p.father_job, p.mother_job, tName(p.tali3a_id), secName(p.section_id)].join(" "));

async function load() {
  let r = await supabaseClient.from("roster").select("*").in("role", ["3ayel", "kada"]).order("name");
  if (r.error) { $("view").innerHTML = '<div class="msg err">' + esc(BAS.errText(r.error)) + "</div>"; return; }
  ALL = r.data || [];
  const t = await supabaseClient.from("tali3as").select("id, name, section_id");
  TAL = t.error ? [] : t.data;
  draw();
}

function list() {
  const q = BAS.norm($("q").value.trim()), sec = Number($("fSec").value) || 0, arch = $("fState").value === "arch";
  const onlyChk = $("fState").value === "chk", noEn = $("fState").value === "noen", who = $("fWho").value;
  return ALL.filter(p => (who === "all" || p.role === who) && (arch ? !p.is_active : p.is_active) && (!onlyChk || p.check_note) && (!noEn || isAr(p.name)) && (!sec || p.section_id === sec) && (!q || q.split(" ").every(w => hay(p).includes(w))))
    .sort((a, b) => a.section_id - b.section_id || arN(a).localeCompare(arN(b), "ar"));
}

function draw() {
  if (BAS.setUnit) BAS.setUnit((BAS.allSections.find(x => x.id === (Number($("fSec").value) || (!BAS.allStages() && BAS.profile.section_id))) || {}).unit_style === "raht");
  if ($("fState").value === "dup") return drawDoubles();
  const L = list(), arch = $("fState").value === "arch";
  const nChk = ALL.filter(p => p.is_active && p.check_note).length;
  $("count").textContent = L.length + " " + T(arch ? "archived" : { kada: "kada", all: "people" }[$("fWho").value] || "scouts") + (nChk && !arch ? " · ✱ " + nChk + " " + T("need checking") : "");
  if (!L.length) { $("view").innerHTML = '<div class="empty">' + esc(T(ALL.length ? "Nobody matches." : "No scouts yet. Add them from Attendance › People.")) + "</div>"; return; }
  const groups = {};
  L.forEach(p => { (groups[p.section_id] = groups[p.section_id] || []).push(p); });
  $("view").innerHTML = Object.keys(groups).map(sid => '<div class="group-title">' + esc(secName(Number(sid))) + " (" + groups[sid].length + ")</div>" +
    '<div class="panel tscroll" style="padding:4px 10px"><table class="ltable rec-t"><tr><th>' + esc(T("Name")) + "</th><th>" + esc(T("Tali3a")) + "</th><th>" + esc(T("School year")) + "</th><th>" + esc(T("School")) + "</th><th>" + esc(T("Father")) + "</th><th>" + esc(T("Mother")) + "</th><th>" + esc(T("Address")) + "</th></tr>" +
    groups[sid].map(p => '<tr data-p="' + p.id + '"><td>' + nm2(p) + (arch && p.archived_at ? '<br><small class="mut">' + esc(T("Archived")) + " " + esc(BAS.fmtDate(p.archived_at)) + "</small>" : "") + "</td><td>" + esc(tName(p.tali3a_id)) + "</td><td>" + esc(p.school_year || "") + "</td><td dir=\"auto\">" + esc(p.school || "") +
      '</td><td dir="auto">' + esc(p.father_name || "") + (p.father_job ? ' <small class="mut">· ' + esc(p.father_job) + "</small>" : "") + '</td><td dir="auto">' + esc(p.mother_name || "") + (p.mother_job ? ' <small class="mut">· ' + esc(p.mother_job) + "</small>" : "") +
      '</td><td dir="auto">' + esc(p.address || "") + "</td></tr>").join("") + "</table></div>").join("");
  // ✱ list: one tap clears "not in the 2026 registration" for everyone still on a stage's list
  const sec = Number($("fSec").value) || 0, regN = L.filter(p => p.role === "3ayel" && (p.check_note || "").indexOf("مش في تسجيل 2026") >= 0).length;
  if ($("fState").value === "chk" && CAN_EDIT && regN)
    $("view").insertAdjacentHTML("afterbegin", '<div class="panel">' + (sec
      ? '<p class="meta" style="margin-top:0">' + esc(T("Archive the ones who left first. Then this clears “not in the 2026 registration” for the scouts left on this stage's list. Other reasons stay.")) + '</p><button class="btn ok" id="regOk">✓ ' + esc(T("Everyone left here is still in the group")) + " (" + regN + ")</button>"
      : '<p class="meta" style="margin:0">💡 ' + esc(T("Pick a stage to clear “not in the 2026 registration” for everyone left on its list in one tap.")) + "</p>") + "</div>");
  if ($("regOk")) $("regOk").onclick = async () => {
    if (!confirm(T("Everyone left here is still in the group") + " (" + regN + ")?")) return;
    const { data, error } = await supabaseClient.rpc("clear_reg_doubt", { p_section: sec });
    if (error) return BAS.toast(BAS.errText(error), "err");
    BAS.toast("✅ " + data); load();
  };
  $("view").querySelectorAll("tr[data-p]").forEach(tr => tr.onclick = () => personSheet(ALL.find(x => x.id === Number(tr.dataset.p))));
}

function drawDoubles() {
  const D = doubles().filter(d => !Number($("fSec").value) || d.a.section_id === Number($("fSec").value));
  $("count").textContent = D.length + " " + T("possible doubles");
  if (!D.length) { $("view").innerHTML = '<div class="empty">👌 ' + esc(T("No doubles found. If you still see someone twice, open one of them and use Join with…")) + "</div>"; return; }
  // someone in more than one pair: leave those for a person to choose
  const seen = {}; D.forEach(({ a, b }) => { seen[a.id] = (seen[a.id] || 0) + 1; seen[b.id] = (seen[b.id] || 0) + 1; });
  const multi = d => seen[d.a.id] > 1 || seen[d.b.id] > 1;
  const tick = d => d.sure && !multi(d);
  const sum = p => [p.tali3a_id ? tName(p.tali3a_id) : "", p.school_year || "", p.phone || p.mother_phone || p.father_phone || ""].filter(Boolean).join(" · ");
  $("view").innerHTML = '<div class="panel"><p class="meta" style="margin-top:0">' + esc(T("These look like the same scout written twice. Only the sure ones are ticked. Look at the rest yourself, then join in one go.")) + "</p>" +
    '<p class="meta">' + esc(T("Both names stay: the English one for attendance, the Arabic one for Group records.")) + "</p>" +
    '<div class="actions"><button class="btn gold" id="dupAll">👥 ' + esc(T("Join all ticked")) + ' (<span id="dupN"></span>)</button><button class="btn line sm" id="dupNone">' + esc(T("Untick all")) + "</button></div>" +
    '<div id="dupMsg" class="meta"></div></div>' +
    D.map((d, i) => '<label class="panel dup-pair" style="display:block;cursor:pointer"><div class="meta"><input type="checkbox" data-dt="' + i + '"' + (tick(d) ? " checked" : "") + "> " + esc(secName(d.a.section_id)) +
      (multi(d) ? ' · <span class="pill warn">' + esc(T("in more than one pair, check by hand")) + "</span>" : "") +
      d.why.map(w => ' · <span class="pill warn">' + esc(w) + "</span>").join("") + '</div><div class="grid2">' +
      [d.a, d.b].map(p => '<div>' + nm2(p) + '<br><small class="mut" dir="auto">' + esc(sum(p) || "—") + "</small></div>").join("") +
      '</div><div class="actions"><button class="btn line sm" data-dj="' + i + '">' + esc(T("Join only these two…")) + "</button></div></label>").join("");
  const boxes = [...$("view").querySelectorAll("[data-dt]")];
  const cnt = () => { $("dupN").textContent = boxes.filter(b => b.checked).length; };
  boxes.forEach(b => b.onchange = cnt); cnt();
  $("dupNone").onclick = () => { boxes.forEach(b => b.checked = false); cnt(); };
  $("view").querySelectorAll("[data-dj]").forEach(b => b.onclick = e => { e.preventDefault(); const d = D[Number(b.dataset.dj)]; joinDlg(d.a, d.b); });
  $("dupAll").onclick = async () => {
    const pick = boxes.filter(b => b.checked).map(b => [D[Number(b.dataset.dt)].a, D[Number(b.dataset.dt)].b]);
    if (!pick.length) return;
    if (!confirm(T("Join") + " " + pick.length + " " + T("pairs? Each pair becomes one scout. You can't split them again."))) return;
    const done = new Set(); let ok = 0, bad = [];
    $("dupAll").disabled = true;
    for (const [a, b] of pick) {
      if (done.has(a.id) || done.has(b.id)) continue;
      const nm = [a.name_ar, b.name_ar, a.name, b.name].filter(n => n && isAr(n)).sort((x, y) => y.split(/\s+/).length - x.split(/\s+/).length)[0] || a.name;
      $("dupMsg").textContent = "⏳ " + (ok + bad.length + 1) + " / " + pick.length;
      const { error } = await supabaseClient.rpc("merge_people", { p_keep: a.id, p_drop: b.id, p_name: nm });
      if (error) bad.push(nm + ": " + BAS.errText(error)); else ok++;
      done.add(a.id); done.add(b.id);
    }
    $("dupAll").disabled = false;
    BAS.toast("✅ " + ok + " " + T("joined"));
    await load();
    if (bad.length) $("dupMsg").textContent = "⚠️ " + bad.join(" | ");
  };
}

// keep the record that was there first (it has the attendance); its empty details are filled from the other one
function joinDlg(a, b) {
  const keep = a.id < b.id ? a : b, drop = keep === a ? b : a, o = $("sheet");
  const all = [a.name, b.name, a.name_ar, b.name_ar].filter(Boolean), en = all.find(n => !isAr(n));
  const ars = [...new Set(all.filter(isAr))].sort((x, y) => y.split(/\s+/).length - x.split(/\s+/).length);
  const names = en ? [ars[0] || en] : ars;
  o.innerHTML = '<div class="sheet" style="max-width:520px"><h2>👥 ' + esc(T("Join into one")) + "</h2>" +
    '<p class="meta">' + esc(T("Attendance, subscription and tali3a move to one record. Empty details are filled from the other one. Nothing filled in is lost.")) + "</p>" +
    (en ? '<div class="panel"><div class="meta">' + esc(T("Arabic name")) + '</div><b dir="rtl">' + esc(ars[0] || "—") + '</b><div class="meta" style="margin-top:8px">' + esc(T("English name (shows in attendance)")) + '</div><b dir="ltr">' + esc(en) + "</b>" +
      '<input type="radio" name="jn" value="' + esc(names[0]) + '" checked hidden></div>'
    : '<div class="panel"><label class="mut">' + esc(T("Which name stays?")) + "</label>" +
    names.map((n, i) => '<label class="pick' + (i === 0 ? " on" : "") + '" style="display:block;margin:6px 0"><input type="radio" name="jn" value="' + esc(n) + '"' + (i === 0 ? " checked" : "") + '> <b dir="auto">' + esc(n) + "</b></label>").join("") + "</div>") +
    '<div id="jErr" class="msg err" hidden></div><div class="actions"><button class="btn gold" id="jGo">' + esc(T("Join")) + '</button><button class="btn line" id="jNo">' + esc(T("Cancel")) + "</button></div></div>";
  o.hidden = false;
  o.querySelectorAll("input[name=jn]").forEach(r => r.onchange = () => o.querySelectorAll(".pick").forEach(l => l.classList.toggle("on", l.querySelector("input").checked)));
  $("jNo").onclick = () => { o.hidden = true; };
  $("jGo").onclick = async () => {
    $("jGo").disabled = true;
    const { error } = await supabaseClient.rpc("merge_people", { p_keep: keep.id, p_drop: drop.id, p_name: o.querySelector("input[name=jn]:checked").value });
    $("jGo").disabled = false;
    if (error) { $("jErr").textContent = BAS.errText(error); $("jErr").hidden = false; return; }
    o.hidden = true; BAS.toast(T("Joined")); load();
  };
}

function joinPick(p) {
  const L = ALL.filter(x => x.is_active && x.id !== p.id && x.section_id === p.section_id).sort((a, b) => a.name.localeCompare(b.name, "ar"));
  const o = $("sheet");
  o.innerHTML = '<div class="sheet" style="max-width:520px"><h2>👥 ' + esc(T("Join with…")) + '</h2><p class="meta" dir="auto">' + esc(arN(p)) + " = ?</p>" +
    '<div class="field"><input id="jQ" placeholder="' + esc(T("Search a name…")) + '"></div><div id="jL" class="mvlist"></div>' +
    '<div class="actions"><button class="btn line" id="jNo">' + esc(T("Cancel")) + "</button></div></div>";
  o.hidden = false;
  const show = () => { const q = BAS.norm($("jQ").value.trim()); $("jL").innerHTML = L.filter(x => !q || BAS.norm(x.name + " " + (x.name_ar || "")).includes(q)).slice(0, 60).map(x => '<button class="pick" style="display:block;width:100%;text-align:start" data-jp="' + x.id + '"><b dir="auto">' + esc(arN(x)) + (enN(x) ? " · " + esc(enN(x)) : "") + "</b> <small class=\"mut\">" + esc(x.tali3a_id ? tName(x.tali3a_id) : "") + "</small></button>").join("") || '<div class="empty">—</div>';

function subSheet(sub) {

  const sa = nw(d.name_ar), se = skName(d.name || "");

    const pa = nw(p.name_ar || (isAr(p.name) ? p.name : "")), pe = skName(isAr(p.name) ? "" : p.name);
    let s = 0; sa.forEach((w, i) => { if (pa[i] === w) s += i < 2 ? 3 : 1; else if (pa.includes(w)) s += 1; });
    se.forEach((w, i) => { if (pe[i] === w) s += i < 2 ? 3 : 1; });

    '<div class="actions"><button class="btn gold" id="sNew">➕ ' + esc(T("New scout")) + '</button><button class="btn danger" id="sDrop">🗑 ' + esc(T("Throw it away")) + '</button><button class="btn line" id="sBk">' + esc(T("Back")) + "</button></div></div>";

  };
  o.innerHTML = '<div class="sheet" style="max-width:600px"><div class="pd-top"><div class="pd-photo" id="rPh">' + (p.photo_path ? "" : "<span>" + esc((p.name || "?").trim().charAt(0)) + "</span>") + "</div>" +
    '<div><h2 style="margin:0" dir="auto">' + esc(arN(p)) + chk(p) + '</h2>' + (enN(p) ? '<div class="mut" dir="ltr">' + esc(enN(p)) + "</div>" : "") + '<div class="meta">' + esc(secName(p.section_id)) + (p.tali3a_id ? " · " + esc(tName(p.tali3a_id)) : "") +
    (p.is_active ? "" : ' · <span class="pill warn">' + esc(T("ARCHIVED")) + "</span>") + "</div></div></div>" +
    (p.check_note ? '<div class="msg warn chkbox"><b>✱ ' + esc(T("Needs checking")) + '</b><br><span dir="auto">' + esc(p.check_note) + "</span>" +
      (ed ? '<br><button class="btn ok sm" id="rChk" style="margin-top:8px">✓ ' + esc(T("Checked, remove the ✱")) + "</button>" : "") + "</div>" : "") +
    '<div class="panel">' + (ed ? '<div class="grid2"><div class="field"><label>' + esc(T("Arabic name")) + '</label><input id="r_name_ar" dir="rtl" value="' + esc(p.name_ar || "") + '"></div>' +
      '<div class="field"><label>' + esc(T("English name (shows in attendance)")) + '</label><input id="r_name" dir="auto" value="' + esc(p.name) + '"></div></div>' : "") +
    '<div class="grid2 rec-grid">' + pf(p).map(input).join("") + "</div>" +
    (p.notes ? '<p class="meta">📝 ' + esc(p.notes) + "</p>" : "") +
    (CAN_EDIT ? "" : '<p class="meta">🔒 ' + esc(T("Only the people chosen by the warehouse team can change these details.")) + "</p>") + "</div>" +
    '<div id="rErr" class="msg err" hidden></div><div class="actions">' + (ed ? '<button class="btn gold" id="rGo">' + esc(T("Save")) + "</button>" : "") +
    (ed && BAS.isAdmin() && p.role !== "kada" ? '<button class="btn line" id="rReg">📝 ' + esc(T("Registration details")) + "</button>" : "") +
    (BAS.isAdmin() && p.role !== "kada" && !p.profile_id ? '<button class="btn danger" id="rDel">🗑 ' + esc(T("Delete forever")) + "</button>" : "") +
    (p.is_active ? '<a class="btn line" href="attendance.html?' + (BAS.allStages() ? "s=" + p.section_id + "&" : "") + "p=" + p.id + '#people">' + esc(T("Open in Attendance")) + "</a>" : "") +
    (ed && p.role !== "kada" ? '<button class="btn line" id="rJoin">👥 ' + esc(T("Join with…")) + "</button>" : "") +
    (p.role === "kada" ? "" : p.is_active ? '<button class="btn danger" id="rArch">' + esc(T("Archive")) + "</button>" : '<button class="btn ok" id="rBack">' + esc(T("Bring back")) + "</button>") +
    (!p.is_active && BAS.isAdmin() ? '<button class="btn danger" id="rPurge">' + esc(T("Delete forever")) + "</button>" : "") +
    '<button class="btn line" id="rClose">' + esc(T("Close")) + "</button></div>" +
    '<div class="panel"><h3>🕘 ' + esc(T("Changes")) + '</h3><div id="rHist" class="meta">…</div></div></div>';
  o.hidden = false;
  $("rClose").onclick = () => { o.hidden = true; };
  if ($("rReg")) $("rReg").onclick = () => regSheet(p);
  if ($("rDel")) $("rDel").onclick = async () => {
    const code = await BAS.askCode(T("Delete") + " " + arN(p) + " " + T("forever?") + " " + T("Their attendance goes with them to Team › Deleted."));
    if (!code) return;
    const { data, error } = await supabaseClient.rpc("delete_scout", { p_id: p.id, p_code: code });
    if (error) return BAS.toast(BAS.errText(error), "err");
    BAS.codeWorked(); o.hidden = true; BAS.toast(T(data)); await load();
  };
  o.onclick = e => { if (e.target === o) o.hidden = true; };
  // papers: birth certificate / ID card (only Group records can open them)
  const papers = [["birth_cert_path", "Birth certificate"], ["id_front_path", "ID card: front"], ["id_back_path", "ID card: back"]].filter(x => p[x[0]]);
  if (papers.length && $("rPh")) {
    $("rPh").insertAdjacentHTML("afterend", '<div class="actions" id="rPapers" style="margin:6px 0">' + papers.map(x => '<button class="btn line sm" data-paper="' + esc(p[x[0]]) + '">📄 ' + esc(T(x[1])) + "</button>").join("") + "</div>");
    document.querySelectorAll("[data-paper]").forEach(b => b.onclick = async () => {
      const w = window.open("", "_blank"), u = await supabaseClient.storage.from("docs").createSignedUrl(b.dataset.paper, 600);
      if (u.error) { if (w) w.close(); return BAS.toast(BAS.errText(u.error), "err"); }
      if (w) w.location.href = u.data.signedUrl; else location.href = u.data.signedUrl;
    });
  }
  if (p.photo_path) supabaseClient.storage.from("people").createSignedUrl(p.photo_path, 600).then(u => { if (!u.error && $("rPh")) $("rPh").innerHTML = '<img src="' + esc(u.data.signedUrl) + '" alt="">'; });
  const err = m => { $("rErr").textContent = m; $("rErr").hidden = false; };
  if ($("rChk")) $("rChk").onclick = async () => {
    const { error } = await supabaseClient.rpc("save_person", { p_id: p.id, p: { name: p.name, check_note: "" } });
    if (error) return err(BAS.errText(error));
    BAS.toast(T("Saved")); await load(); personSheet(ALL.find(x => x.id === p.id));
  };
  if ($("rGo")) $("rGo").onclick = async () => {
    const d = { name: $("r_name").value, name_ar: $("r_name_ar").value };
    pf(p).forEach(f => { d[f[0]] = $("r_" + f[0]).value; });
    $("rGo").disabled = true;
    const { error } = await supabaseClient.rpc("save_person", { p_id: p.id, p: d });
    $("rGo").disabled = false;
    if (error) return err(BAS.errText(error));
    BAS.toast(T("Saved")); await load(); personSheet(ALL.find(x => x.id === p.id));
  };
  const active = async on => {
    if (!confirm(on ? T("Bring back") + " " + p.name + "?" : T("Archive") + " " + p.name + "? " + T("They leave the stage's lists, but everything about them stays saved here."))) return;
    const { error } = await supabaseClient.rpc("set_person_active", { p_id: p.id, p_active: on });
    if (error) return err(BAS.errText(error));
    o.hidden = true; BAS.toast(T(on ? "Brought back" : "Archived")); load();
  };
  if ($("rArch")) $("rArch").onclick = () => active(false);
  if ($("rJoin")) $("rJoin").onclick = () => joinPick(p);
  if ($("rBack")) $("rBack").onclick = () => active(true);
  if ($("rPurge")) $("rPurge").onclick = async () => {
    const code = await BAS.askCode(T("Delete") + " " + p.name + " " + T("forever? Everything about them, including their attendance, is deleted and can't be brought back."));
    if (!code) return;
    const { data, error } = await supabaseClient.rpc("purge_person", { p_id: p.id, p_code: code });
    if (error) return err(BAS.errText(error));
    BAS.codeWorked();
    if (data) supabaseClient.storage.from("people").remove([data]).then(() => {});
    o.hidden = true; BAS.toast(T("Deleted forever")); load();
  };
  // history of changes
  const h = await supabaseClient.from("person_history").select("*").eq("roster_id", p.id).order("changed_at", { ascending: false }).limit(100);
  if (!$("rHist")) return;
  if (h.error || !h.data.length) { $("rHist").textContent = T(h.error ? "Not available." : "No changes yet."); return; }
  const val = (f, v) => v == null || v === "" ? "—" : f === "section_id" ? secName(Number(v)) : f === "tali3a_id" ? (tName(Number(v)) || "#" + v) : f === "is_active" ? T(v === "true" ? "Brought back" : "Archived") :
    f === "mother_works" || f === "father_call_ok" ? yn(v === "true" ? true : false) : f === "birthday" || f === "joined_on" ? BAS.fmtDate(v) : f === "photo_path" ? "📷" : v;
  const undo = f => CAN_EDIT && p.is_active && ["added", "merged", "is_active", "section_id", "tali3a_id"].indexOf(f) < 0;
  $("rHist").innerHTML = '<ul class="rec-h">' + h.data.map(x => "<li><b>" + esc(T(LABEL[x.field] || x.field)) + "</b>: " +
    (x.field === "added" ? "" : '<span class="mut" dir="auto">' + esc(val(x.field, x.old_value)) + "</span> → ") + '<span dir="auto">' + esc(val(x.field, x.new_value)) + "</span>" +
    '<br><small class="mut">' + esc(BAS.fmtDateTime(x.changed_at)) + " · " + esc(x.changed_by_name || "") + "</small>" +
    (undo(x.field) ? ' <button class="linkbtn" data-undo="' + x.id + '">↩ ' + esc(T("Put this back")) + "</button>" : "") + "</li>").join("") + "</ul>";
  $("rHist").querySelectorAll("[data-undo]").forEach(b => b.onclick = async () => {
    if (!confirm(T("Put the old value back?"))) return;
    const { error } = await supabaseClient.rpc("restore_person_value", { p_hist: Number(b.dataset.undo) });
    if (error) return err(BAS.errText(error));
    BAS.toast(T("Saved")); await load(); personSheet(ALL.find(x => x.id === p.id));
  });
}

// an .csv file that opens in Excel (with Arabic)
function download() {
  const L = list(), head = ["Stage", "Kada or scout", "Arabic name", "Name", "Tali3a"].concat(FIELDS.map(f => f[1]), ["Notes", "Needs checking", "Archived"]);
  const cell = v => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
  const rows = L.map(p => [secName(p.section_id), T(p.role === "kada" ? "Kada" : "Scout"), p.name_ar || "", p.name, tName(p.tali3a_id)].concat(FIELDS.map(f => f[0] === "mother_works" ? yn(p[f[0]]) : f[2] === "nid" && p[f[0]] ? { id: p[f[0]] } : p[f[0]] || ""), [p.notes || "", p.check_note || "", p.is_active ? "" : T("Yes")]));
  const csv = "﻿" + [head.map(x => cell(T(x)))].concat(rows.map(r => r.map(v => v && v.id ? '"=""' + v.id + '"""' : cell(v)))).map(r => r.join(",")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  a.download = "BAS group records " + BAS.todayISO() + ".csv";
  document.body.appendChild(a); a.click(); a.remove();
}

(async function () {
  await BAS.init("records");
  if (!BAS.requireApproved()) return;
  if (!BAS.canRecords()) { $("view").innerHTML = '<div class="msg err">' + esc(T("Group records are only for the warehouse team and the accounts it chooses.")) + "</div>"; $("count").textContent = ""; return; }
  CAN_EDIT = BAS.can("records_edit");
  if (CAN_EDIT) $("fDup").hidden = false;
  if (BAS.allStages()) {
    $("fSec").hidden = false;
    $("fSec").innerHTML = '<option value="">' + esc(T("All stages")) + "</option>" + BAS.sections.map(s => '<option value="' + s.id + '">' + esc(s.name_ar) + "</option>").join("");
    $("dl").hidden = false;
  } else if (CAN_EDIT) $("dl").hidden = false;
  $("q").oninput = draw; $("fSec").onchange = draw; $("fState").onchange = draw; $("fWho").onchange = draw; $("dl").onclick = download;
  await load();
  if (BAS.isAdmin()) { $("intake").hidden = false; $("intake").onclick = intakeSheet; intakeCount(); if (location.hash === "#intake") intakeSheet(); }
  const pq = Number(QS.get("p"));
  if (pq) { const p = ALL.find(x => x.id === pq); if (p) { if (!p.is_active) { $("fState").value = "arch"; draw(); } personSheet(p); } history.replaceState(null, "", "records.html"); }
})();
</script>
