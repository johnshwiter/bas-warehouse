<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warehouse team | BAS Warehouse</title>
<link rel="icon" href="logo.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#17196A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BAS Warehouse">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<meta name="color-scheme" content="only light">
<link rel="stylesheet" href="bas.css">
<script>(function(){var t="light";try{t=localStorage.getItem("basTheme")==="dark"?"dark":"light"}catch(e){}document.documentElement.dataset.theme=t;var m=document.querySelector('meta[name="color-scheme"]');if(m)m.content="only "+t})()</script>
</head>
<body>
<main class="page">
  <div class="head">
    <div><p class="eyebrow">Warehouse team</p><h1 id="title">Overview of <em>all stages</em></h1>
      <p class="sub">Prepare requests, receive returns, keep the stock right, and see every stage and service at once.</p></div>
    <a class="btn gold" href="book.html">+ Book for a stage or service</a>
  </div>
  <div class="tabs" id="tabs"></div>
  <div id="view"><div class="loading">Loading…</div></div>
</main>
<div class="overlay" id="sheet" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="common.js"></script>
<script src="i18n.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = s => BAS.esc(s);
let TRASH = [];
let STOCK = [], BY = {}, RES = [], LOSSES = [], PAYMENTS = [], PEOPLE = [], TRANSFERS = [], MAINT = [], WAIT = [], ANN = [], CHANGES = [], MSGS = [], THREAD = null, CHAT_T = null;
let TAB = "overview", SUB = "prepare", FORM = null, OPEN = null, ADDING = false, SQ = "", SCAT = "All", MSUB = "open";
const TITLES = { trash: "Deleted", overview: "Overview of <em>all stages</em>", requests: "Requests", money: "Missing & <em>compensation</em>", stock: "Stock", maint: "Under <em>maintenance</em>",
  wait: "Waitlist", chat: "Messages", news: "Announcements", people: "Accounts", log: "Activity log", settings: "Settings" };

function readHash() { const h = (location.hash || "#overview").slice(1); TAB = TITLES[h] ? h : "overview"; }
window.addEventListener("hashchange", () => { readHash(); FORM = null; OPEN = null; ADDING = false; render(); });

(async function () {
  readHash();
  await BAS.init(TAB === "stock" ? "stock" : TAB === "requests" ? "requests" : "overview");
  if (!BAS.requireAdmin()) return;
  document.querySelector(".head .eyebrow").textContent = BAS.welcomeText();
  await loadAll();
})();

async function loadAll() {
  try {
    const st = await BAS.loadStock(); STOCK = st.list; BY = st.byId;
    RES = await BAS.loadReservations(BY);
    LOSSES = await BAS.q(supabaseClient.from("loss_status").select("*").order("created_at", { ascending: false })); await BAS.loadLossWho(LOSSES);
    PAYMENTS = await BAS.q(supabaseClient.from("payments").select("*").order("paid_on", { ascending: false }));
    PEOPLE = await BAS.q(supabaseClient.from("profiles").select("id, full_name, email, role, approval_status, section_id, created_at, stage_role").order("created_at"));
    TRANSFERS = await BAS.q(supabaseClient.from("transfer_requests").select("*").order("created_at", { ascending: false }));
    MAINT = await BAS.q(supabaseClient.from("maintenance").select("*").order("created_at", { ascending: false }));
    WAIT = await BAS.q(supabaseClient.from("waitlist").select("*").in("status", ["Waiting", "Available"]).order("created_at"));
    ANN = await BAS.q(supabaseClient.from("announcements").select("*").order("created_at", { ascending: false }).limit(100));
    BAS.services = await BAS.q(supabaseClient.from("services").select("*").order("id"));
    CHANGES = RES.filter(r => r.change);
    TRASH = await BAS.q(supabaseClient.from("trash").select("*").order("deleted_at", { ascending: false }));
    PEOPLE = PEOPLE.filter(p => p.approval_status !== "removed");
    MSGS = await BAS.loadMessages();
    render();
  } catch (e) { $("view").innerHTML = '<div class="msg err">' + esc(BAS.errText(e)) + "</div>"; }
}

async function rpc(fn, args, ok) {
  document.querySelectorAll("#view button, #sheet button").forEach(b => b.disabled = true);
  const { data, error } = await supabaseClient.rpc(fn, args);
  if (error) { BAS.toast(BAS.errText(error), "err"); render(); return null; }
  if (ok) BAS.toast(typeof ok === "function" ? ok(data) : ok);
  FORM = null; $("sheet").hidden = true;
  await loadAll();
  return data === null ? true : data;
}
const person = id => { const p = PEOPLE.find(x => x.id === id); return p ? p.full_name : ""; };
const availOf = (itemId, varId) => { const i = BY[itemId]; if (!i || !i.counted) return 0; if (varId) { const v = (i.variants || []).find(x => x.id === varId); return v ? v.available : 0; } return i.available || 0; };

// ---------- tabs ----------
function render() {
  const n = s => RES.filter(r => s.indexOf(r.status) >= 0).length;
  const tabs = [["overview", "Overview", CHANGES.length], ["requests", "Requests", n(["Pending", "Preparing"]) + CHANGES.length], ["money", "Compensation", 0],
    ["stock", "Stock", STOCK.filter(i => !i.counted && i.is_active).length], ["maint", "Maintenance", MAINT.filter(m => m.status === "Open").length],
    ["wait", "Waitlist", WAIT.filter(w => availOf(w.item_id, w.variant_id) > 0).length], ["chat", "Messages", 0], ["news", "Announcements", 0],
    ["people", "Accounts", PEOPLE.filter(p => p.approval_status === "pending").length + TRANSFERS.filter(t => t.status === "Pending").length], ["trash", "Deleted", TRASH.length], ["log", "Activity", 0], ["settings", "Settings", 0]];
  // the tabs live in the side menu now; their counts go there as badges
  $("tabs").classList.add("hidden-tabs");
  const bd = {}; tabs.forEach(t => { bd[t[0]] = t[2]; }); BAS.menuBadges(bd);
  $("title").innerHTML = TITLES[TAB];
  document.querySelectorAll(".nav a").forEach(a => a.classList.toggle("on", a.dataset.nav === (TAB === "stock" ? "stock" : TAB === "requests" ? "requests" : TAB === "overview" ? "overview" : "")));
  ({ overview, requests: requestsView, money: moneyView, stock: stockView, maint: maintView, wait: waitView, chat: chatView, news: newsView, people: peopleView, trash: trashView, log: logView, settings: settingsView }[TAB] || overview)();
}

// ---------- overview: every stage and service ----------
function overview() {
  const active = STOCK.filter(i => i.is_active);
  const n = s => RES.filter(r => s.indexOf(r.status) >= 0).length;
  const owed = LOSSES.reduce((t, l) => t + Number(l.remaining || 0), 0);
  const k = (label, val, go, cls, hide0) => hide0 && (!val || val === BAS.money(0)) ? "" : '<div class="kpi ' + (cls || "") + '" data-go="' + go + '"><p>' + label + "</p><h3>" + val + "</h3></div>";
  const stats = (secId, svcId) => {
    const R = RES.filter(r => svcId ? r.service_id === svcId : r.section_id === secId);
    const L = LOSSES.filter(l => svcId ? l.service_id === svcId : l.section_id === secId);
    return { open: R.filter(r => BAS.PRE.indexOf(r.status) >= 0).length, out: R.filter(r => BAS.OUT.indexOf(r.status) >= 0).length, late: R.filter(r => BAS.isOverdue(r)).length,
      missing: L.filter(l => l.kind === "missing").reduce((t, l) => t + l.qty, 0), damaged: L.filter(l => l.kind === "damaged").reduce((t, l) => t + l.qty, 0),
      owed: L.reduce((t, l) => t + Number(l.remaining || 0), 0), total: R.length };
  };
  const scard = (name, en, url, s, svc) => '<a class="stage' + (svc ? " svc" : "") + '" href="' + url + '"><h4><bdi>' + esc(name) + "</bdi></h4>" + (en && en !== name ? '<div class="en">' + esc(en) + "</div>" : "") +
    "<dl><dt>To prepare</dt><dd>" + s.open + "</dd><dt>Out now</dt><dd>" + s.out + "</dd>" + (s.late ? '<dt>Overdue</dt><dd class="bad">' + s.late + "</dd>" : "") +
    (s.missing + s.damaged ? '<dt>Missing / damaged</dt><dd class="bad">' + s.missing + " / " + s.damaged + "</dd>" : "") +
    (s.owed ? '<dt>Still owed</dt><dd class="bad">' + BAS.money(s.owed) + "</dd>" : "") + "<dt>All requests</dt><dd>" + s.total + "</dd></dl></a>";
  const usedSvc = BAS.services.filter(v => v.is_active || RES.some(r => r.service_id === v.id));
  let h = '<div class="quick"><a href="book.html"><span>➕</span>New booking</a><a href="camp.html?new=Camp" class="gold"><span>⛺</span>New camp / trip</a>' +
    '<button data-q="return"><span>↩</span>Record a return</button><button data-q="item"><span>📦</span>Add an item</button><button data-q="loss"><span>⚠️</span>Record missing / damaged</button><a href="mizania.html"><span>💰</span>Money in / out</a></div>' +
    '<div class="kpis">' + k("To prepare", n(["Pending", "Preparing"]), "requests", "warn") + k("Ready to collect", n(["Ready"]), "requests") + k("Out with stages", n(BAS.OUT), "requests") +
    k("Overdue", RES.filter(r => BAS.isOverdue(r)).length, "requests", "bad", 1) + k("Changes to approve", CHANGES.length, "requests", "gold", 1) +
    k("Missing pieces", LOSSES.filter(l => l.kind === "missing").reduce((t, l) => t + l.qty, 0), "money", "bad", 1) + k("Damaged pieces", LOSSES.filter(l => l.kind === "damaged").reduce((t, l) => t + l.qty, 0), "money", "warn", 1) +
    k("Still owed", BAS.money(owed), "money", "bad", 1) + k("In maintenance", MAINT.filter(m => m.status === "Open").reduce((t, m) => t + m.qty, 0), "maint", "fix", 1) +
    k("Need recount", active.filter(i => !i.counted).length, "stock", "", 1) + "</div>";
  h += '<div class="group-title">Scout stages</div><div class="stages">' + BAS.sections.map(s => scard(s.name_ar, s.name_en, BAS.borrowerURL(s.id), stats(s.id, null))).join("") + "</div>";
  h += '<div class="group-title">Other church services</div><div class="stages">' + usedSvc.map(v => scard(v.name_ar, v.name_en, BAS.borrowerURL(null, v.id), stats(null, v.id), true)).join("") + "</div>";
  const next = RES.filter(r => BAS.PRE.indexOf(r.status) >= 0).sort((a, b) => a.meeting_date > b.meeting_date ? 1 : -1).slice(0, 5);
  h += '<div class="group-title">Next up</div>' + (next.length ? '<div class="panel tscroll"><table class="ltable"><tr><th>Meeting</th><th>For</th><th>Items</th><th>Status</th></tr>' + next.map(r => '<tr class="click" data-req="' + r.id + '"><td class="nowrap"><b>' + esc(BAS.fmtDate(r.meeting_date, true)) + "</b> " + esc(r.meeting_time || "") + "</td><td>" + BAS.borrowerHTML(r) + " · #" + r.id + "</td><td>" + r.items.map(i => esc(BAS.lineName(i)) + " ×" + i.quantity).join(", ") + "</td><td>" + (r.change ? '<span class="pill svc">CHANGE ASKED</span> ' : "") + BAS.statusBadge(r.status) + "</td></tr>").join("") + "</table></div>" : '<div class="empty">Nothing to prepare.</div>');
  $("view").innerHTML = h;
  $("view").querySelectorAll("[data-go]").forEach(el => el.onclick = () => { if (el.dataset.go === "requests") SUB = "prepare"; location.hash = el.dataset.go; });
  $("view").querySelectorAll("[data-q]").forEach(b => b.onclick = () => {
    if (b.dataset.q === "return") { SUB = "out"; location.hash = "requests"; }
    if (b.dataset.q === "item") { ADDING = true; OPEN = null; SCAT = "All"; location.hash = "stock"; }
    if (b.dataset.q === "loss") lossSheet(null);
  });
  $("view").querySelectorAll("[data-req]").forEach(el => el.onclick = () => { const r = RES.find(x => x.id === Number(el.dataset.req)); SUB = r.change ? "changes" : r.status === "Ready" ? "ready" : "prepare"; location.hash = "requests"; });
}

// ---------- requests ----------
const GROUPS = { prepare: ["Pending", "Preparing"], ready: ["Ready"], out: ["Issued", "Partially Returned"], done: ["Returned", "Completed", "Cancelled", "Rejected"] };
let DF = "all";
function requestsView() {
  if (SUB === "returned") SUB = "done";
  const subs = [["changes", "Changes to approve", CHANGES.length], ["prepare", "To prepare"], ["ready", "Ready"], ["out", "To return"], ["done", "Returned"]];
  const cnt = s => s[0] === "changes" ? s[2] : s[0] === "done" ? 0 : RES.filter(r => GROUPS[s[0]].indexOf(r.status) >= 0).length;
  let h = '<div class="tabs sub">' + subs.map(s => '<button class="tab' + (SUB === s[0] ? " on" : "") + '" data-sub="' + s[0] + '">' + s[1] + (cnt(s) ? "<b>" + cnt(s) + "</b>" : "") + "</button>").join("") + "</div>";
  if (SUB === "changes") {
    h += CHANGES.length ? CHANGES.map(card).join("") : '<div class="empty">No change requests waiting.</div>';
  } else {
    let list = RES.filter(r => GROUPS[SUB].indexOf(r.status) >= 0);
    if (SUB === "done") {
      const F = { all: GROUPS.done, returned: ["Returned", "Completed"], cancelled: ["Cancelled"], rejected: ["Rejected"] };
      list = list.filter(r => F[DF].indexOf(r.status) >= 0).sort((a, b) => (a.returned_at || a.meeting_date) < (b.returned_at || b.meeting_date) ? 1 : -1);
      h += '<div class="actions" style="margin:0 0 10px">' + [["all", "All"], ["returned", "Returned"], ["cancelled", "Cancelled"], ["rejected", "Rejected"]].map(f => '<button class="chipbtn' + (DF === f[0] ? " on" : "") + '" data-df="' + f[0] + '">' + f[1] + "</button>").join("") +
        '<a class="lnk" style="margin-inline-start:auto" href="history.html">Older ones: History →</a></div>';
      h += list.slice(0, 40).map(card).join("") || '<div class="empty">Nothing here.</div>';
    }
    else {
      list.sort((a, b) => a.meeting_date > b.meeting_date ? 1 : -1);
      const groups = {}, order = [];
      list.forEach(r => { const g = whenGroup(r); if (!groups[g]) { groups[g] = []; order.push(g); } groups[g].push(r); });
      h += list.length ? order.map(g => '<div class="group-title">' + g + "</div>" + groups[g].map(card).join("")).join("") : '<div class="empty">Nothing here. 👌</div>';
    }
  }
  $("view").innerHTML = h;
  $("view").querySelectorAll("[data-sub]").forEach(b => b.onclick = () => { SUB = b.dataset.sub; FORM = null; render(); });
  $("view").querySelectorAll("[data-df]").forEach(b => b.onclick = () => { DF = b.dataset.df; render(); });
  bindRequestButtons();
}
function whenGroup(r) {
  if (BAS.isOverdue(r)) return "Overdue";
  const days = BAS.daysFromToday(r.meeting_date);
  if (days < 0) return "Past date";
  if (days === 0) return "Today";
  const toFri = (5 - new Date().getDay() + 7) % 7;
  if (days <= toFri) return "This week";
  if (days <= toFri + 7) return "Next week";
  return "Later";
}

function card(r) {
  const pre = BAS.PRE.indexOf(r.status) >= 0, out = BAS.OUT.indexOf(r.status) >= 0;
  let h = '<div class="req ' + BAS.statusSlug(r.status) + '"><div class="req-top"><h3><a href="' + BAS.borrowerURL(r.section_id, r.service_id) + '">' + BAS.borrowerHTML(r) + "</a>" +
    "<small>#" + r.id + " · " + esc(BAS.fmtDate(r.meeting_date, true)) + " · <bdi>" + esc(BAS.time(r.meeting_time)) + "</bdi> · <bdi>" + esc(r.place || "") + "</bdi></small></h3>" +
    "<div>" + (BAS.isOverdue(r) ? '<span class="pill late">OVERDUE</span> ' : "") + (pre && BAS.isLate(r) ? '<span class="pill late">LATE</span> ' : "") + BAS.statusBadge(r.status) + "</div></div>" +
    '<div class="meta">' + esc(r.requester || "") + " · sent " + esc(BAS.fmtDateTime(r.created_at)) +
    (r.issued_at ? " · taken " + esc(BAS.fmtDate(r.issued_at)) : "") +
    (r.return_by && out ? " · return by " + esc(BAS.fmtDate(r.return_by)) : "") + (r.returned_at ? " · back " + esc(BAS.fmtDateTime(r.returned_at)) : "") + "</div>" +
    BAS.tripLine(r) + (r.status === "Ready" ? '<div class="meta">Counts as taken on <b>' + esc(BAS.fmtDate(r.meeting_date, true)) + "</b>. The stage was told it's ready.</div>" : "") +
    (r.notes ? '<div class="msg warn" data-noi18n dir="auto">' + esc(r.notes) + "</div>" : "") + (r.closed_reason ? '<div class="meta">Reason: ' + esc(r.closed_reason) + "</div>" : "");
  if (r.change) h += '<div class="change-box">✏️ <b>' + esc(person(r.change.requested_by) || "A leader") + "</b> asks to change: " + BAS.changeSummary(r, r.change, BY) + (r.change.reason ? " · <i>" + esc(r.change.reason) + "</i>" : "") +
    '<div class="actions"><button class="btn ok sm" data-act="chok" data-cid="' + r.change.id + '">Approve change</button><button class="btn danger sm" data-act="chno" data-cid="' + r.change.id + '">Reject change</button></div></div>';
  if (FORM && FORM.id === r.id && FORM.kind === "fix") return h + fixForm(r) + "</div>";
  if (FORM && FORM.id === r.id && FORM.kind === "return") return h + returnForm(r) + "</div>";
  if (pre) {
    h += '<div class="tscroll"><table class="ltable"><tr><th>Item</th><th class="num">Asked</th><th>Prepared</th><th>Note if short</th><th></th></tr>' +
      r.items.map(i => '<tr><td><a class="lnk" href="item.html?id=' + i.item_id + '">' + esc(BAS.lineName(i)) + "</a>" + (i.kind === "Consumable" ? ' <small class="mut">(used up)</small>' : "") + '</td><td class="num">' + i.quantity + "</td>" +
        '<td><input type="number" min="0" max="' + i.quantity + '" value="' + i.prepared_qty + '" data-pq="' + i.id + '"></td>' +
        '<td><input class="wide" value="' + esc(i.prep_note || "") + '" data-pn="' + i.id + '" placeholder="e.g. only 8 clean"></td>' +
        '<td><button class="btn line sm" data-act="prep" data-line="' + i.id + '">Save</button></td></tr>').join("") + "</table></div>" +
      '<div class="actions">' + (r.status === "Ready" ? '<button class="btn ok" data-act="taken" data-id="' + r.id + '">Taken ✓</button>' : '<button class="btn line" data-act="prepall" data-id="' + r.id + '">Prepare all ✓</button>') +
      '<a class="btn line sm" href="book.html?edit=' + r.id + '">✏️ Edit</a><button class="btn danger sm" data-act="cancel" data-id="' + r.id + '">Cancel</button><button class="btn danger sm" data-act="reject" data-id="' + r.id + '">Reject</button><button class="btn danger sm" data-act="trash" data-id="' + r.id + '">🗑 Delete</button></div>';
  } else {
    const anyM = r.items.some(i => i.missing_qty), anyD = r.items.some(i => i.damaged_qty);
    h += '<div class="tscroll"><table class="ltable"><tr><th>Item</th><th class="num">Asked</th><th class="num">Issued</th><th class="num">Back</th>' + (anyM ? '<th class="num">Missing</th>' : "") + (anyD ? '<th class="num">Damaged</th>' : "") + '<th class="num">Still out</th></tr>' +
      r.items.map(i => '<tr><td><a class="lnk" href="item.html?id=' + i.item_id + '">' + esc(BAS.lineName(i)) + '</a></td><td class="num">' + i.quantity + '</td><td class="num">' + (i.issued_qty == null ? "—" : i.issued_qty) + '</td><td class="num">' + i.returned_qty +
        "</td>" + (anyM ? '<td class="num">' + i.missing_qty + "</td>" : "") + (anyD ? '<td class="num">' + i.damaged_qty + "</td>" : "") + '<td class="num">' + (i.kind === "Consumable" && r.status !== "Issued" ? "used" : i.out) + "</td></tr>").join("") + "</table></div>";
    h += '<div class="actions">' + (out ? '<button class="btn ok" data-act="allback" data-id="' + r.id + '">All back OK</button><button class="btn line" data-act="return" data-id="' + r.id + '">Receive return…</button>' : "") +
      (r.status === "Returned" ? '<button class="btn line" data-act="complete" data-id="' + r.id + '">Mark completed</button>' : "") +
      '<button class="btn line sm" data-act="fix" data-id="' + r.id + '">✏️ Fix numbers</button><button class="btn danger sm" data-act="trash" data-id="' + r.id + '">🗑 Delete</button></div>';
  }
  return h + BAS.commentsHTML(r.id, MSGS) + "</div>";
}

function fixForm(r) {
  return '<div class="panel" style="margin-top:12px;border-color:var(--gold)"><h3>Fix the numbers · #' + r.id + '</h3><p class="meta" style="margin-bottom:8px">For mistakes. Missing/damaged charges are fixed separately in Compensation.</p>' +
    '<div class="tscroll"><table class="ltable"><tr><th>Item</th><th>Asked</th><th>Taken</th><th>Back OK</th><th>Missing</th><th>Damaged</th><th></th></tr>' +
    r.items.map(i => "<tr><td>" + esc(BAS.lineName(i)) + "</td>" + ["quantity", "issued_qty", "returned_qty", "missing_qty", "damaged_qty"].map(f => '<td><input type="number" min="0" value="' + (i[f] || 0) + '" data-fx="' + i.id + "|" + f + '"></td>').join("") +
      '<td><button class="btn ok sm" data-act="dofix" data-line="' + i.id + '" data-id="' + r.id + '">Save</button></td></tr>').join("") + "</table></div>" +
    '<div id="fErr" class="msg err" hidden></div><div class="actions"><button class="btn line" data-act="close">Done</button></div></div>';
}
function issueForm(r) {
  return '<div class="panel" style="margin-top:12px;border-color:var(--gold)"><h3>Issue request #' + r.id + "</h3>" +
    '<div class="field"><label>Who is receiving the equipment?</label><input id="fRecv" value="' + esc(r.requester || "") + '"></div>' +
    '<div class="tscroll"><table class="ltable"><tr><th>Item</th><th class="num">Asked</th><th class="num">Prepared</th><th>Issuing now</th></tr>' +
    r.items.map(i => "<tr><td>" + esc(BAS.lineName(i)) + '</td><td class="num">' + i.quantity + '</td><td class="num">' + i.prepared_qty + "</td>" +
      '<td><input type="number" min="0" max="' + i.quantity + '" value="' + (i.prepared_qty || i.quantity) + '" data-iq="' + i.id + '"></td></tr>').join("") + "</table></div>" +
    '<div id="fErr" class="msg err" hidden></div><div class="actions"><button class="btn ok" data-act="doissue" data-id="' + r.id + '">Confirm issue</button><button class="btn line" data-act="close">Back</button></div></div>';
}
// every row starts as "all back OK"; tap Missing or Damaged only for what didn't come back right
function retState(r) {
  if (!FORM.st) { FORM.st = {}; r.items.filter(i => i.out > 0).forEach(i => { FORM.st[i.id] = { back: i.kind === "Consumable" ? 0 : i.out, m: 0, d: 0, price: Number((BY[i.item_id] || {}).price || 0), showM: false, showD: false }; }); }
  return FORM.st;
}
function returnForm(r) {
  const st = retState(r), lines = r.items.filter(i => i.out > 0);
  const step = (id, f, v) => '<span class="rstep"><button type="button" data-rs="' + id + "|" + f + '|-1" aria-label="Less">−</button><b>' + v + '</b><button type="button" data-rs="' + id + "|" + f + '|1" aria-label="More">+</button></span>';
  return '<div class="panel" style="margin-top:12px;border-color:var(--gold)"><h3>Receive return · #' + r.id + '</h3><p class="meta" style="margin-bottom:6px"><span>Everything starts as back OK. Tap Missing or Damaged only for what didn\'t come back right.</span>' +
    (lines.some(i => i.kind === "Consumable") ? " <span>Consumables: put the leftovers in Back; the rest counts as used.</span>" : "") + "</p>" +
    lines.map(i => { const x = st[i.id], left = i.out - x.back - x.m - x.d;
      return '<div class="rrow"><div class="rn"><b>' + esc(BAS.lineName(i)) + "</b><small>" + i.out + " " + esc(BAS.tr ? BAS.tr("out") : "out") + (left > 0 && i.kind !== "Consumable" ? " · " + left + " " + esc(BAS.tr ? BAS.tr("still out after this") : "still out after this") : "") + "</small></div>" +
        '<div class="rctl"><span class="mut" style="font-size:12px;font-weight:700">' + esc(BAS.tr ? BAS.tr("Back OK") : "Back OK") + "</span>" + step(i.id, "back", x.back) +
        '<button type="button" class="chipbtn m' + (x.m || x.showM ? " on" : "") + '" data-rt="' + i.id + '|m">' + esc(BAS.tr ? BAS.tr("Missing") : "Missing") + (x.m ? " " + x.m : "") + "</button>" +
        '<button type="button" class="chipbtn d' + (x.d || x.showD ? " on" : "") + '" data-rt="' + i.id + '|d">' + esc(BAS.tr ? BAS.tr("Damaged") : "Damaged") + (x.d ? " " + x.d : "") + "</button></div>" +
        (x.showM || x.showD || x.m || x.d ? '<div class="rx">' + (x.showM || x.m ? "<label>" + esc(BAS.tr ? BAS.tr("Missing") : "Missing") + " " + step(i.id, "m", x.m) + "</label>" : "") +
          (x.showD || x.d ? "<label>" + esc(BAS.tr ? BAS.tr("Damaged") : "Damaged") + " " + step(i.id, "d", x.d) + "</label>" : "") +
          (x.m || x.d ? '<label>' + esc(BAS.tr ? BAS.tr("Price per piece (EGP)") : "Price per piece (EGP)") + ' <input type="number" min="0" value="' + (x.price || "") + '" data-rp="' + i.id + '" placeholder="0"></label>' : "") + "</div>" : "") + "</div>"; }).join("") +
    '<div class="field" style="margin-top:10px"><label>What happened (optional)</label><input id="fNote" value="' + esc(FORM.note || "") + '"></div>' +
    '<div id="fErr" class="msg err" hidden></div><div class="actions"><button class="btn ok" data-act="doreturn" data-id="' + r.id + '">Save return</button><button class="btn line" data-act="close">Back</button></div></div>';
}
function bindReturn(r) {
  const st = retState(r), keep = () => { if ($("fNote")) FORM.note = $("fNote").value; document.querySelectorAll("[data-rp]").forEach(el => { st[el.dataset.rp].price = Number(el.value || 0); }); };
  document.querySelectorAll("[data-rs]").forEach(b => b.onclick = () => {
    keep(); const [id, f, d] = b.dataset.rs.split("|"), i = r.items.find(x => x.id === Number(id)), x = st[id], dv = Number(d);
    if (f === "back") x.back = Math.max(0, Math.min(i.out - x.m - x.d, x.back + dv));
    else { const nv = Math.max(0, x[f] + dv); const room = i.out - x.back - (f === "m" ? x.d : x.m);
      if (nv > room) { if (x.back > 0 && i.kind !== "Consumable") x.back -= 1; else return; }
      x[f] = Math.min(nv, i.out - x.back - (f === "m" ? x.d : x.m)); }
    render();
  });
  document.querySelectorAll("[data-rt]").forEach(b => b.onclick = () => {
    keep(); const [id, f] = b.dataset.rt.split("|"), i = r.items.find(x => x.id === Number(id)), x = st[id];
    if (f === "m") x.showM = true; else x.showD = true;
    if (!x[f] && i.out - x.back - x.m - x.d <= 0 && x.back > 0) { x.back -= 1; x[f] = 1; } else if (!x[f] && i.out - x.back - x.m - x.d > 0) x[f] = 1;
    render();
  });
}
function fail(m) { const e = $("fErr"); if (e) { e.textContent = m; e.hidden = false; } else BAS.toast(m, "err"); }
const num = sel => { const el = document.querySelector(sel); return el ? Number(el.value || 0) : 0; };

function bindRequestButtons() {
  if (FORM && FORM.kind === "return") { const rr = RES.find(x => x.id === FORM.id); if (rr) bindReturn(rr); }
  BAS.bindComments($("view"), async fresh => { if (fresh) MSGS = await BAS.loadMessages(); render(); });
  $("view").querySelectorAll("[data-act]").forEach(b => b.onclick = () => {
    const id = Number(b.dataset.id), a = b.dataset.act, r = RES.find(x => x.id === id);
    if (a === "prep") {
      const line = Number(b.dataset.line);
      rpc("prepare_line", { p_line_id: line, p_prepared: num('[data-pq="' + line + '"]'), p_note: document.querySelector('[data-pn="' + line + '"]').value }, s => s === "Ready" ? "All prepared: ready to collect" : "Saved");
    }
    if (a === "prepall") rpc("prepare_all", { p_id: id }, "Ready to collect");
    if (a === "taken") {
      if (!confirm("Did the stage take request #" + id + " now? It moves to To return.")) return;
      rpc("mark_taken", { p_id: id }, "Taken ✓ · now in To return").then(() => { SUB = "out"; render(); });
    }
    if (a === "takenback" || a === "takenret") {
      if (a === "takenback" && !confirm("Everything came back in good condition?")) return;
      supabaseClient.rpc("mark_taken", { p_id: id }).then(async ({ error }) => {
        if (error) return BAS.toast(BAS.errText(error), "err");
        await loadAll();
        const r2 = RES.find(x => x.id === id);
        if (a === "takenback") rpc("receive_return", { p_id: id, p_lines: r2.items.filter(i => i.out > 0).map(i => ({ line_id: i.id, returned: i.kind === "Consumable" ? 0 : i.out })), p_note: null }, "Returned ✓");
        else { SUB = "out"; FORM = { id, kind: "return" }; render(); }
      });
    }
    if (a === "fix" || a === "return") { FORM = { id, kind: a }; render(); }
    if (a === "dofix") {
      const line = b.dataset.line, g = f => num('[data-fx="' + line + "|" + f + '"]');
      rpc("admin_fix_line", { p_line: Number(line), p_qty: g("quantity"), p_issued: g("issued_qty"), p_returned: g("returned_qty"), p_missing: g("missing_qty"), p_damaged: g("damaged_qty") }, "Saved").then(() => { FORM = { id, kind: "fix" }; render(); });
    }
    if (a === "trash") { if (confirm("Delete request #" + id + "? Its lines and charges go with it. You can restore it from Deleted.")) rpc("trash_item", { p_kind: "reservation", p_id: String(id) }, "Deleted"); }
    if (a === "close") { FORM = null; render(); }
    if (a === "chok" || a === "chno") {
      const note = a === "chno" ? prompt("Reject this change? Write a short reason (the leader sees it):") : "";
      if (note === null) return;
      rpc("decide_change", { p_change_id: Number(b.dataset.cid), p_approve: a === "chok", p_note: note }, a === "chok" ? "Change approved: request updated" : "Change rejected");
    }
    if (a === "cancel" || a === "reject") {
      const reason = prompt((a === "cancel" ? "Cancel" : "Reject") + " request #" + id + "? Write a short reason:");
      if (reason === null) return;
      rpc("close_reservation", { p_id: id, p_status: a === "cancel" ? "Cancelled" : "Rejected", p_reason: reason }, a === "cancel" ? "Cancelled" : "Rejected");
    }
    if (a === "complete") rpc("close_reservation", { p_id: id, p_status: "Completed", p_reason: null }, "Completed");
    if (a === "doissue") {
      const recv = $("fRecv").value.trim();
      if (!recv) return fail("Write who is receiving the equipment.");
      let bad = "";
      const lines = r.items.map(i => { const n = num('[data-iq="' + i.id + '"]'); if (!Number.isInteger(n) || n < 0 || n > i.quantity) bad = "Issued for " + BAS.lineName(i) + " must be 0 to " + i.quantity + "."; return { line_id: i.id, issued: n }; });
      if (bad) return fail(bad);
      rpc("issue_reservation", { p_id: id, p_lines: lines, p_received_by: recv }, "Issued");
    }
    if (a === "allback") {
      if (!confirm("Everything still out came back in good condition?")) return;
      rpc("receive_return", { p_id: id, p_lines: r.items.filter(i => i.out > 0).map(i => ({ line_id: i.id, returned: i.kind === "Consumable" ? 0 : i.out })), p_note: null }, s => s === "Returned" ? "Returned ✓" : "Saved");
    }
    if (a === "doreturn") {
      let bad = "", any = false;
      document.querySelectorAll("[data-rp]").forEach(el => { FORM.st[el.dataset.rp].price = Number(el.value || 0); });
      const lines = r.items.filter(i => i.out > 0).map(i => {
        const y = FORM.st[i.id], x = { line_id: i.id, returned: y.back, missing: y.m, damaged: y.d, unit_price: (y.m || y.d) ? y.price : 0 };
        if ([x.returned, x.missing, x.damaged].some(v => !Number.isInteger(v) || v < 0)) bad = "Use whole numbers, 0 or more.";
        if (x.returned + x.missing + x.damaged > i.out) bad = BAS.lineName(i) + ": only " + i.out + " still out.";
        if ((x.missing || x.damaged) && x.unit_price <= 0 && !bad) x.noPrice = true;
        if (x.returned + x.missing + x.damaged) any = true;
        return x;
      });
      if (bad) return fail(bad);
      if (!any && !r.items.every(i => i.kind === "Consumable")) return fail("Enter what came back, or use Back.");
      if (lines.some(x => x.noPrice) && !confirm("Some missing/damaged items have no price. Save anyway? You can set the price later in Compensation.")) return;
      lines.forEach(x => delete x.noPrice);
      rpc("receive_return", { p_id: id, p_lines: lines, p_note: $("fNote").value }, s => s === "Returned" ? "Returned ✓" : "Partly returned: saved");
    }
  });
}

  };
}

// ---------- stock ----------
function cats() {
  const c = []; STOCK.forEach(i => { const k = i.category || "Other"; if (c.indexOf(k) < 0) c.push(k); });
  ["Kashfy", "Crafts", "Games", "Kitchen", "Flags", "Camping", "Uniform", "Tools"].forEach(k => { if (c.indexOf(k) < 0) c.push(k); });
  return c;
}
function level(i) {
  if (!i.counted) return '<span class="pill rc">RECOUNT</span>';
  const total = i.quantity + i.repaired_found;
  if (i.available <= 0) return '<span class="pill out">OUT</span>';
  if (i.min_stock != null ? i.available < i.min_stock : (total && i.available <= total * (BAS.settings.low_pct || 20) / 100)) return '<span class="pill low">LOW</span>';
  return "";
}
function stockView() {
  const active = STOCK.filter(i => i.is_active);
  const chips = ["All", "Needs recount", "Low / out", "In maintenance", "Hidden"].concat(cats());
  $("view").innerHTML = (() => { const kp = (l, v, c) => v ? '<div class="kpi ' + c + '"><p>' + l + "</p><h3>" + v + "</h3></div>" : "";
    return '<div class="kpis"><div class="kpi"><p>Items</p><h3>' + active.length + "</h3></div>" + kp("Need recount", active.filter(i => !i.counted).length, "warn") + kp("Low or out", active.filter(i => i.counted && level(i)).length, "bad") +
      kp("Pieces in maintenance", active.reduce((t, i) => t + Number(i.maintenance || 0), 0), "fix") + kp("Missing + damaged", active.reduce((t, i) => t + Number(i.missing) + Number(i.damaged), 0), "") + "</div>"; })() +
    '<div class="toolbar"><input id="sq" placeholder="Search stock" value="' + esc(SQ) + '"><button class="btn gold" id="addBtn">+ Add item</button></div>' +
    '<div class="chips">' + chips.map(c => '<button class="tab' + (c === SCAT ? " on" : "") + '" data-c="' + esc(c) + '">' + esc(c) + "</button>").join("") + "</div><div id=\"slist\"></div>";
  $("sq").oninput = e => { SQ = e.target.value; drawStock(); };
  $("addBtn").onclick = () => { ADDING = true; OPEN = null; drawStock(); };
  $("view").querySelectorAll("[data-c]").forEach(b => b.onclick = () => { SCAT = b.dataset.c; OPEN = null; stockView(); });
  drawStock();
}
function drawStock() {
  const s = SQ.trim().toLowerCase();
  const L = STOCK.filter(i => {
    if (s && !(i.name_en || "").toLowerCase().includes(s) && !(i.name_ar || "").includes(s)) return false;
    if (SCAT === "Hidden") return !i.is_active;
    if (!i.is_active) return false;
    if (SCAT === "Needs recount") return !i.counted;
    if (SCAT === "Low / out") return i.counted && !!level(i);
    if (SCAT === "In maintenance") return Number(i.maintenance) > 0;

function bindItemForm(f) {
  f.onclick = e => e.stopPropagation();
  const id = f.dataset.id ? Number(f.dataset.id) : null, item = id ? BY[id] : null;
  $("fCat").onchange = () => { $("fCatNew").hidden = $("fCat").value !== "+ New category"; };
  $("fClose").onclick = () => { OPEN = null; ADDING = false; drawStock(); };
  $("fSave").onclick = () => saveItem(id, item);
  if (!item) return;
  $("fHide").onclick = () => updateItem(id, { is_active: !item.is_active }, item.is_active ? "Marked unavailable" : "Available again");
  $("fDelete").onclick = () => { if (confirm("Delete " + item.name_en + "? It moves to Deleted, where you can restore it.")) rpc("trash_item", { p_kind: "item", p_id: String(id) }, "Item deleted").then(() => { OPEN = null; }); };
  $("fPhoto").onchange = e => uploadPhoto(id, e.target.files[0]);
  if ($("fNoPhoto")) $("fNoPhoto").onclick = () => updateItem(id, { image_url: null }, "Photo removed");
  $("vAdd").onclick = async () => {
    const name = $("vNewName").value.trim(), qty = Number($("vNewQty").value || 0);
    if (!name) return fail("Write the colour name.");
    if (!Number.isInteger(qty) || qty < 0) return fail("Count must be a whole number.");
    const { error } = await supabaseClient.from("item_variants").insert({ item_id: id, name, quantity: qty });
    if (error) return fail(/unique|duplicate/i.test(error.message) ? "That colour already exists." : BAS.errText(error));
    if (!item.counted) await supabaseClient.from("items").update({ counted: true }).eq("id", id);
    BAS.toast("Colour added"); await loadAll();
  };
  f.querySelectorAll("[data-vsave]").forEach(b => b.onclick = async () => {
    const v = Number(b.dataset.vsave);
    const row = { name: f.querySelector('[data-vn="' + v + '"]').value.trim(), quantity: num('[data-vq="' + v + '"]'), repaired_found: num('[data-vf="' + v + '"]'), is_active: f.querySelector('[data-va="' + v + '"]').checked };
    if (!row.name) return fail("Colour name can't be empty.");
    if (![row.quantity, row.repaired_found].every(x => Number.isInteger(x) && x >= 0)) return fail("Use whole numbers, 0 or more.");
    const { error } = await supabaseClient.from("item_variants").update(row).eq("id", v);
    if (error) return fail(BAS.errText(error));
    BAS.toast("Colour saved"); await loadAll();
  });
}
async function saveItem(id) {
  $("fErr").hidden = true;
  const name = $("fName").value.trim(), cat = $("fCat").value === "+ New category" ? $("fCatNew").value.trim() : $("fCat").value;
  if (!name) return fail("Write the item name.");
  if (!$("fAr").value.trim()) return fail("Write the name in Arabic too, so everyone can search for it.");
  const minS = $("fMin").value.trim(), maxP = $("fMax").value.trim();
  if ((minS !== "" && !/^\d+$/.test(minS)) || (maxP !== "" && !/^[1-9]\d*$/.test(maxP))) return fail("Minimum and pieces per person must be whole numbers.");
  if (!cat) return fail("Choose or write a category.");
  const row = { name_en: name, name_ar: $("fAr").value.trim() || null, description: $("fDesc").value.trim() || null, category: cat, kind: $("fKind").value,
    location: $("fLoc").value.trim() || null, notes: $("fNotes").value.trim() || null, updated_at: new Date().toISOString(),
    min_stock: minS === "" ? null : Number(minS), weight: $("fW").value, max_per_person: maxP === "" ? null : Number(maxP), kada_only: $("fKada").checked };
  if ($("fQty")) {
    const qt = $("fQty").value.trim(), found = Number($("fFound").value || 0);
    if (qt !== "" && !/^\d+$/.test(qt)) return fail("Counted total must be a whole number.");
    if (!Number.isInteger(found) || found < 0) return fail("Repaired / found must be a whole number.");
    row.repaired_found = found;
    if (qt !== "") { row.quantity = Number(qt); row.counted = true; }
  }
  if (id) return updateItem(id, row, "Saved");
  if (row.counted === undefined) { row.quantity = 0; row.counted = false; }
  row.last_year = "new";
  const { error } = await supabaseClient.from("items").insert(row);
  if (error) return fail(/unique|duplicate/i.test(error.message) ? "An item with that name already exists." : BAS.errText(error));
  BAS.toast("Item added"); ADDING = false; await loadAll();
}
async function updateItem(id, row, ok) {
  const { error } = await supabaseClient.from("items").update(row).eq("id", id);
  if (error) { BAS.toast(/unique|duplicate/i.test(error.message) ? "An item with that name already exists." : BAS.errText(error), "err"); return; }
  BAS.toast(ok); if (row.archived) OPEN = null; await loadAll();
}
function uploadPhoto(id, file) {
  if (!file) return;
  $("fPMsg").textContent = "Uploading photo…";
  const rd = new FileReader(), img = new Image();
  rd.onload = () => {
    img.onload = () => {
      const k = Math.min(1, 1000 / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(async blob => {
        const path = id + "-" + Date.now() + ".jpg";
        const up = await supabaseClient.storage.from("item-photos").upload(path, blob, { contentType: "image/jpeg" });
        if (up.error) { $("fPMsg").textContent = "Upload failed: " + BAS.errText(up.error); return; }
        updateItem(id, { image_url: supabaseClient.storage.from("item-photos").getPublicUrl(path).data.publicUrl }, "Photo saved");
      }, "image/jpeg", 0.82);
    };
    img.onerror = () => { $("fPMsg").textContent = "That file is not a photo."; };
    img.src = rd.result;
  };
  rd.readAsDataURL(file);
}

// ---------- messages: one conversation per stage / service ----------
function chatView() {
  const threads = BAS.sections.map(s => ({ key: "s" + s.id, sec: s.id, svc: null, name: s.name_ar }))
    .concat(BAS.services.map(v => ({ key: "v" + v.id, sec: null, svc: v.id, name: v.name_ar, isSvc: true })));
  threads.forEach(t => {
    t.msgs = MSGS.filter(m => !m.reservation_id && (t.svc ? m.service_id === t.svc : m.section_id === t.sec));
    t.last = t.msgs[t.msgs.length - 1];
    t.comments = MSGS.filter(m => m.reservation_id && (t.svc ? m.service_id === t.svc : m.section_id === t.sec)).length;
  });
  threads.sort((a, b) => (b.last ? b.last.created_at : "") > (a.last ? a.last.created_at : "") ? 1 : -1);
  const shown = threads.filter(t => t.last || !t.isSvc);
  if (!THREAD) THREAD = shown[0].key;
  const cur = threads.find(t => t.key === THREAD) || shown[0];
  $("view").innerHTML = '<div class="threads"><div>' + shown.map(t => '<button class="thread' + (t.key === cur.key ? " on" : "") + '" data-th="' + t.key + '"><small>' + (t.last ? esc(BAS.ago(t.last.created_at)) : "") + "</small><b><bdi>" + esc(t.name) + "</bdi></b><span dir=\"auto\">" +
      (t.last ? esc((t.last.sender_name || "") + ": " + (t.last.deleted_at ? "🗑" : t.last.body || "📷")) : "No messages yet") + "</span>" + (t.comments ? '<span>💬 ' + t.comments + " comments on requests</span>" : "") + "</button>").join("") +
    '<p class="meta">Comments about one request are under that request in Requests.</p></div><div><div class="group-title" style="margin-top:0"><a href="' + BAS.borrowerURL(cur.sec, cur.svc) + '"><bdi>' + esc(cur.name) + "</bdi> ›</a></div>" + BAS.chatHTML("teamChat", cur.msgs) + "</div></div>";
  $("view").querySelectorAll("[data-th]").forEach(b => b.onclick = () => { THREAD = b.dataset.th; chatView(); });
  BAS.bindChat("teamChat", { section: cur.sec, service: cur.svc }, async () => { MSGS = await BAS.loadMessages(); if (TAB === "chat") chatView(); });
  clearInterval(CHAT_T);
  CHAT_T = setInterval(async () => {
    if (TAB !== "chat") { clearInterval(CHAT_T); return; }

    if (n.length !== MSGS.length && !(box && box.value)) { MSGS = n; chatView(); }
  }, 15000);
}

    const { error } = await supabaseClient.from("announcements").insert({ title: t, body: b, target: to === "all" ? "all" : to[0] === "s" ? "section" : "service",
      section_id: to[0] === "s" ? Number(to.slice(1)) : null, service_id: to[0] === "v" ? Number(to.slice(1)) : null, created_by: BAS.user.id });
    if (error) return BAS.toast(BAS.errText(error), "err");
    BAS.toast("Posted"); loadAll();
  };
  $("view").querySelectorAll("[data-aedit]").forEach(b => b.onclick = async () => {
    const a = ANN.find(x => x.id === Number(b.dataset.aedit));
    const ti = prompt("Title:", a.title); if (ti === null || !ti.trim()) return;
    const bo = prompt("Message:", a.body); if (bo === null || !bo.trim()) return;
    const { error } = await supabaseClient.from("announcements").update({ title: ti.trim(), body: bo.trim() }).eq("id", a.id);
    if (error) return BAS.toast(BAS.errText(error), "err");
    BAS.toast("Saved"); loadAll();
  });
  $("view").querySelectorAll("[data-adel]").forEach(b => b.onclick = async () => {
    if (!confirm("Delete this announcement?")) return;
    const { error } = await supabaseClient.rpc("trash_item", { p_kind: "announcement", p_id: b.dataset.adel });
    if (error) return BAS.toast(BAS.errText(error), "err");
    loadAll();
  });
}

// ---------- accounts and transfers ----------
function peopleView() {
  const pend = PEOPLE.filter(p => p.approval_status === "pending"), rest = PEOPLE.filter(p => p.approval_status !== "pending"), tr = TRANSFERS.filter(t => t.status === "Pending");
  const secOpts = sel => '<option value="">No stage</option>' + BAS.sections.map(s => '<option value="' + s.id + '"' + (s.id === sel ? " selected" : "") + ">" + esc(s.name_ar) + "</option>").join("");
  const row = p => '<div class="person" data-p="' + p.id + '"><div><h4>' + esc(p.full_name) + (p.id === BAS.user.id ? " (you)" : "") + '</h4><div class="meta">' + esc(p.email || "") + " · signed up " + esc(BAS.fmtDate(p.created_at)) + " · " +
    '<span class="pill ' + (p.approval_status === "approved" ? "paid" : p.approval_status === "pending" ? "low" : "late") + '">' + esc(p.approval_status.toUpperCase()) + "</span></div></div>" +
    '<div class="actions" style="margin:0"><select data-f="section_id" aria-label="Stage">' + secOpts(p.section_id) + '</select><select data-f="role" aria-label="Role"><option value="leader"' + (p.role === "leader" ? " selected" : "") +
    '>Leader</option><option value="admin"' + (p.role === "admin" ? " selected" : "") + ">Warehouse team</option></select>" +
    (p.section_id && p.approval_status === "approved" ? '<select data-f="stage_role" aria-label="Role in the stage">' + [["leader", "Leader"], ["head", "قائد المرحلة"], ["deputy", "نائب قائد المرحلة"], ["assistant", "مساعد قائد المرحلة"]]
      .map(o => '<option value="' + o[0] + '"' + ((p.stage_role || "leader") === o[0] ? " selected" : "") + ">" + o[1] + "</option>").join("") + "</select>" : "") +
    (p.approval_status !== "approved" ? '<button class="btn ok sm" data-ap="approved">Approve</button>' : "") + (p.approval_status !== "rejected" && p.id !== BAS.user.id ? '<button class="btn danger sm" data-ap="rejected">Reject</button>' : "") + (p.id !== BAS.user.id && p.approval_status !== "pending" ? '<button class="btn danger sm" data-rm="1">Remove account</button>' : "") + "</div></div>";
  $("view").innerHTML = (pend.length ? '<div class="group-title">New accounts waiting</div>' + pend.map(row).join("") : "") +
    (tr.length ? '<div class="group-title">Stage transfer requests</div>' + tr.map(t => '<div class="person"><div><h4>' + esc(person(t.profile_id)) + '</h4><div class="meta">' + BAS.secHTML(t.from_section) + " → <b>" + BAS.secHTML(t.to_section) + "</b> · " + esc(BAS.fmtDate(t.created_at)) + (t.note ? " · " + esc(t.note) : "") + "</div></div>" +
      '<div class="actions" style="margin:0"><button class="btn ok sm" data-tr="' + t.id + '" data-ok="1">Approve</button><button class="btn danger sm" data-tr="' + t.id + '" data-ok="0">Reject</button></div></div>').join("") : "") +
    '<div class="group-title">Everyone else</div>' + rest.map(row).join("");
  $("view").querySelectorAll(".person[data-p]").forEach(el => {
    const id = el.dataset.p;
    el.querySelectorAll("select").forEach(s => s.onchange = () => {
      const v = s.dataset.f === "section_id" ? (s.value ? Number(s.value) : null) : s.value;
      if (id === BAS.user.id && s.dataset.f === "role" && v !== "admin" && !confirm("Remove your own team access? You'll lose this page.")) { render(); return; }
      updatePerson(id, { [s.dataset.f]: v });
    });
    el.querySelectorAll("[data-ap]").forEach(b => b.onclick = () => updatePerson(id, { approval_status: b.dataset.ap }));
    el.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { const p = PEOPLE.find(x => x.id === id); if (confirm("Remove " + p.full_name + "'s account? They can't log in any more. You can restore it from Deleted.")) rpc("trash_item", { p_kind: "account", p_id: id }, "Account removed"); });
  });
  $("view").querySelectorAll("[data-tr]").forEach(b => b.onclick = () => rpc("decide_transfer", { p_id: Number(b.dataset.tr), p_approve: b.dataset.ok === "1" }, b.dataset.ok === "1" ? "Transfer approved" : "Transfer rejected"));
}
async function updatePerson(id, row) {
  const p = PEOPLE.find(x => x.id === id);
  if (row.approval_status === "approved" && p.role === "leader" && !p.section_id) { BAS.toast("Choose their stage first", "err"); return; }
  const { error } = await supabaseClient.from("profiles").update(row).eq("id", id);
  if (error) { BAS.toast(BAS.errText(error), "err"); return; }
  BAS.toast("Saved");
  if (id === BAS.user.id) { location.reload(); return; }
  await loadAll();
}

// ---------- deleted things ----------
function trashView() {
  const icon = { reservation: "📋", loss: "⚠️", payment: "💵", event: "📅", announcement: "📣", message: "💬", maintenance: "🔧", money: "💰", item: "📦", account: "👤", section: "🏕", service: "⛪" };
  $("view").innerHTML = '<p class="meta" style="margin-bottom:10px">Only the warehouse team sees this. Restore puts it back exactly as it was. Delete forever can\'t be undone.</p>' +
    (TRASH.length ? TRASH.map(t => '<div class="person"><div><h4 dir="auto">' + (icon[t.kind] || "🗑") + " " + esc(t.label || t.kind) + '</h4><div class="meta">Deleted ' + esc(BAS.fmtDateTime(t.deleted_at)) + " · " + esc(person(t.deleted_by)) + "</div></div>" +
      '<div class="actions" style="margin:0"><button class="btn ok sm" data-rs="' + t.id + '">Restore</button><button class="btn danger sm" data-pg="' + t.id + '">Delete forever</button></div></div>').join("") : '<div class="empty">Nothing deleted.</div>');
  $("view").querySelectorAll("[data-rs]").forEach(b => b.onclick = () => rpc("restore_item", { p_trash: Number(b.dataset.rs) }, "Restored"));
  $("view").querySelectorAll("[data-pg]").forEach(b => b.onclick = () => { if (confirm("Delete forever? This can't be undone.")) rpc("purge_item", { p_trash: Number(b.dataset.pg) }, m => m || "Deleted forever"); });
}

// ---------- activity log ----------
async function logView() {
  $("view").innerHTML = '<div class="loading">Loading…</div>';
  const { data, error } = await supabaseClient.from("activity_log").select("*").order("at", { ascending: false }).limit(300);
  if (error) { $("view").innerHTML = '<div class="msg err">' + esc(BAS.errText(error)) + "</div>"; return; }
  const what = x => x.entity === "reservation" ? " · request #" + esc(x.entity_id) : (x.entity === "items" || x.entity === "item") && BY[x.entity_id] ? ' · <a class="lnk" href="item.html?id=' + esc(x.entity_id) + '">' + esc(BY[x.entity_id].name_en) + "</a>" : "";
  $("view").innerHTML = '<p class="meta" style="margin-bottom:10px">The last 300 actions, with the time. Nobody can edit or delete this list.</p><div class="panel">' +
    (data.length ? data.map(x => '<div class="log-row"><small>' + esc(BAS.fmtDateTime(x.at)) + "</small><div><b>" + esc(x.action) + "</b> · " + esc(person(x.actor) || "system") + what(x) + "</div></div>").join("") : '<div class="empty">Nothing yet.</div>') + "</div>";
}

// ---------- reset (backup first) ----------
async function resetAll() {
  if ($("rsIn").value.trim() !== "RESET") return BAS.toast("Type RESET to confirm.", "err");
  const out = RES.filter(r => BAS.OUT.indexOf(r.status) >= 0).length;
  if (!confirm((out ? out + " requests are still out; their items will count as back in the warehouse. " : "") + "Delete all the history now? A backup file downloads first.")) return;
  const b = $("rsGo"); b.disabled = true;
  const bk = await supabaseClient.rpc("backup_all");
  if (bk.error) { b.disabled = false; return BAS.toast(BAS.errText(bk.error), "err"); }
  const blob = new Blob([JSON.stringify(bk.data)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "bas-warehouse-backup-" + BAS.todayISO() + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  await new Promise(r => setTimeout(r, 1200));
  if (!confirm("Did the backup file download? OK = reset now.")) { b.disabled = false; return; }
  const { error } = await supabaseClient.rpc("reset_history", { p_confirm: "RESET" });
  b.disabled = false;
  if (error) return BAS.toast(BAS.errText(error), "err");
  BAS.toast("Reset done. Items and counts kept.");
  setTimeout(() => location.reload(), 900);
}

// ---------- settings ----------
function settingsView() {
  const s = BAS.settings;
  $("view").innerHTML = '<div class="panel" style="max-width:640px">' +
    '<div class="grid2"><div class="field"><label>Minimum days before a request</label><input id="sDays" type="number" min="0" max="30" value="' + s.min_days + '"></div>' +
    '<div class="field"><label>Days to return after the meeting</label><input id="sRet" type="number" min="0" max="60" value="' + (s.return_days == null ? 7 : s.return_days) + '"></div></div>' +
    '<div class="grid2"><div class="field"><label>Low stock warning (% of total)</label><input id="sLow" type="number" min="0" max="100" value="' + s.low_pct + '"></div>' +
    '<div class="field"><label>Meeting times (comma separated)</label><input id="sTimes" value="' + esc((s.times || []).join(", ")) + '"></div></div>' +
    '<div id="fErr" class="msg err" hidden></div><button class="btn ok" id="sSave">Save settings</button></div>' +
    '<div class="group-title">Scout stages</div><div class="panel" style="max-width:640px">' +
    BAS.sections.map(x => '<div class="person"><div><h4><bdi>' + esc(x.name_ar) + "</bdi> · " + esc(x.name_en) + '</h4><div class="meta">' + (x.has_3eyal ? "Kada + awlad in camps" : "Kada only in camps (and a number of kids)") + "</div></div>" +
      '<div class="actions" style="margin:0"><button class="btn line sm" data-sec="' + x.id + '">Edit</button><button class="btn danger sm" data-secdel="' + x.id + '">Delete</button></div></div>').join("") +
    '<button class="btn gold" id="secAdd">+ Add stage</button></div>' +
    '<div class="group-title">Other church services</div><div class="panel" style="max-width:640px">' +
    BAS.services.map(v => '<div class="person"><div><h4><bdi>' + esc(v.name_ar) + "</bdi>" + (v.name_en && v.name_en !== v.name_ar ? " · " + esc(v.name_en) : "") + "</h4></div>" +
      '<div class="actions" style="margin:0"><a class="btn line sm" href="' + BAS.borrowerURL(null, v.id) + '">Open page</a><button class="btn line sm" data-svren="' + v.id + '">Rename</button><button class="btn line sm" data-svc="' + v.id + '" data-on="' + (!v.is_active) + '">' + (v.is_active ? "Hide" : "Show") + "</button><button class=\"btn danger sm\" data-svdel=\"" + v.id + "\">Delete</button></div></div>").join("") +
    '<div class="grid2" style="margin-top:10px"><div class="field"><label>New service or church (name)</label><input id="svAr"></div><div class="field"><label>Other spelling (optional)</label><input id="svEn"></div></div>' +
    '<button class="btn gold" id="svAdd">Add service</button></div>' +
    '<div class="group-title">Attendance</div><div class="panel" style="max-width:640px"><p class="meta"><span>The scout year started on</span> <b>' + esc(BAS.fmtDate(s.att_year_start || BAS.todayISO(), true)) + '</b> · <span>Percentages and absence counts start from this day.</span></p>' +
    '<div class="grid2"><div class="field"><label>First day of the new scout year</label><input type="date" id="nyDate" value="' + BAS.todayISO() + '"></div><div></div></div><button class="btn line" id="nyGo">Start a new scout year</button></div>' +
    '<div class="group-title">Reset</div><div class="panel" style="max-width:640px;border-color:var(--bad)"><h3>🧹 Reset the history</h3>' +
    '<p class="meta">Deletes every request, missing/damaged record, payment, 3ohda, message, notification, activity log, waitlist, finished maintenance, calendar event and money entry. ' +
    'Keeps the items and their counts (lost and written-off pieces are taken out of the totals), accounts, stages, services, people lists, tali3as, attendance and settings. Items still at the repair shop stay listed.</p>' +
    '<p class="meta">A full backup file is downloaded first. Keep it.</p><div class="field"><label>Type RESET to confirm</label><input id="rsIn" autocomplete="off" placeholder="RESET"></div>' +
    '<div id="rsMsg" class="msg warn" hidden></div><button class="btn danger" id="rsGo">Download backup and reset</button></div>';
  $("nyGo").onclick = () => { const d = $("nyDate").value; if (!d) return BAS.toast("Choose the date", "err");
    if (confirm("Start the new scout year on " + BAS.fmtDate(d, true) + "? Attendance before this day stops counting (it stays saved).")) rpc("new_scout_year", { p_start: d }, "New scout year started").then(() => location.reload()); };
  $("rsGo").onclick = resetAll;
  $("sSave").onclick = async () => {
    const days = Number($("sDays").value), ret = Number($("sRet").value), low = Number($("sLow").value), times = $("sTimes").value.split(",").map(x => x.trim()).filter(Boolean);
    if (!Number.isInteger(days) || days < 0 || days > 30) return fail("Days before must be between 0 and 30.");
    if (!Number.isInteger(ret) || ret < 0 || ret > 60) return fail("Days to return must be between 0 and 60.");
    if (!Number.isInteger(low) || low < 0 || low > 100) return fail("Low stock must be between 0 and 100.");
    if (!times.length) return fail("Add at least one time.");
    const { error } = await supabaseClient.from("settings").update({ min_days: days, low_pct: low, times, return_days: ret }).eq("id", 1);
    if (error) return fail(BAS.errText(error));
    Object.assign(BAS.settings, { min_days: days, low_pct: low, times, return_days: ret });
    BAS.toast("Settings saved");
  };
  const secEdit = x => {
    const ar = prompt("Stage name (Arabic):", x ? x.name_ar : ""); if (ar === null || !ar.trim()) return;
    const en = prompt("Stage name (English / Franco):", x ? x.name_en : ""); if (en === null) return;
    const three = confirm("Does this stage list awlad by name in camps (like Motakdem & Ra2edat)? OK = yes, Cancel = kada only.");
    rpc("admin_save_section", { p_id: x ? x.id : null, p_ar: ar, p_en: en, p_has_3eyal: three }, "Saved").then(() => location.reload());
  };
  $("secAdd").onclick = () => secEdit(null);
  $("view").querySelectorAll("[data-sec]").forEach(b => b.onclick = () => secEdit(BAS.sections.find(x => x.id === Number(b.dataset.sec))));
  $("view").querySelectorAll("[data-secdel]").forEach(b => b.onclick = () => { if (confirm("Delete this stage? It is hidden everywhere; you can restore it from Deleted.")) rpc("trash_item", { p_kind: "section", p_id: b.dataset.secdel }, "Deleted").then(() => location.reload()); });
  $("view").querySelectorAll("[data-svdel]").forEach(b => b.onclick = () => { if (confirm("Delete this service? You can restore it from Deleted.")) rpc("trash_item", { p_kind: "service", p_id: b.dataset.svdel }, "Deleted"); });
  $("view").querySelectorAll("[data-svren]").forEach(b => b.onclick = async () => {
    const v = BAS.services.find(x => x.id === Number(b.dataset.svren)); const n = prompt("New name:", v.name_ar); if (!n || !n.trim()) return;
    const en = prompt("Other spelling (optional):", v.name_en || "");
    const { error } = await supabaseClient.from("services").update({ name_ar: n.trim(), name_en: (en || "").trim() || n.trim() }).eq("id", v.id);
    if (error) return BAS.toast(/unique|duplicate/i.test(error.message) ? "That service already exists" : BAS.errText(error), "err");
    BAS.toast("Saved"); await loadAll();
  });
  $("svAdd").onclick = async () => {
    const ar = $("svAr").value.trim();
    if (!ar) return BAS.toast("Write the service name", "err");
    const { error } = await supabaseClient.from("services").insert({ name_ar: ar, name_en: $("svEn").value.trim() || ar });
    if (error) return BAS.toast(/unique|duplicate/i.test(error.message) ? "That service already exists" : BAS.errText(error), "err");
    BAS.toast("Service added"); await loadAll();
  };
  $("view").querySelectorAll("[data-svc]").forEach(b => b.onclick = async () => {
    const { error } = await supabaseClient.from("services").update({ is_active: b.dataset.on === "true" }).eq("id", Number(b.dataset.svc));
    if (error) return BAS.toast(BAS.errText(error), "err");
    await loadAll();
  });
}
</script>
