<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance | BAS Warehouse</title>
<link rel="icon" href="logo.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#17196A">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<meta name="color-scheme" content="only light">
<link rel="stylesheet" href="bas.css">
<script>(function(){var t="light";try{t=localStorage.getItem("basTheme")==="dark"?"dark":"light"}catch(e){}document.documentElement.dataset.theme=t;var m=document.querySelector('meta[name="color-scheme"]');if(m)m.content="only "+t})()</script>
</head>
<body>
<main class="page">
  <div class="head"><div><p class="eyebrow">Attendance</p><h1 id="ttl">Who <em>came</em></h1>
    <p class="sub" id="sub">Take attendance for each meeting. Kada and scouts of the stage are listed.</p></div>
    <select id="fSec" hidden aria-label="Stage"></select></div>
  <div class="tabs wrap" id="tabs"></div>
  <div id="view"><div class="loading">Loading…</div></div>
</main>
<div class="overlay" id="sheet" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="common.js"></script>
<script src="kada.js"></script>
<script src="i18n.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = s => BAS.esc(s);
const T = x => BAS.tr ? BAS.tr(x) : x;
const QS = new URLSearchParams(location.search);
let SECID = null, SEC = null, TAB = (location.hash || "#take").slice(1), MEET = [], ROSTER = [], TAL = [], TL = [], RECS = [], PROF = [], ROLES = {}, PANEL = "";
let CUR = null, STATE = {}, DIRTY = false, Q = "", GROUP = "tali3a", SUBS = [], HIST = null;
const YEARS = ["KG1", "KG2"].concat([1, 2, 3, 4, 5, 6].map(n => n + " ابتدائي"), [1, 2, 3].map(n => n + " إعدادي"), [1, 2, 3].map(n => n + " ثانوي"), [1, 2, 3, 4, 5].map(n => "جامعة " + n), ["خريج / بيشتغل"]);

(async function () {
  await BAS.init("attendance");
  if (!BAS.requireApproved()) return;
  SECID = BAS.allStages() ? Number(QS.get("s")) || BAS.profile.section_id || (BAS.sections[0] || {}).id : BAS.profile.section_id;
  if (!SECID) { $("view").innerHTML = '<div class="msg err">Your account has no stage. Ask the warehouse team.</div>'; return; }
  if (BAS.allStages()) {
    $("fSec").hidden = false;
    $("fSec").innerHTML = BAS.sections.map(s => '<option value="' + s.id + '"' + (s.id === SECID ? " selected" : "") + ">" + esc(s.name_ar) + " · " + esc(s.name_en) + "</option>").join("");
    $("fSec").onchange = () => { if (DIRTY && !confirm("You have attendance that isn't saved. Leave it?")) { $("fSec").value = SECID; return; } location.href = "attendance.html?s=" + $("fSec").value + "#" + TAB; };
  }
  window.addEventListener("hashchange", () => { const t = location.hash.slice(1); if (t && t !== TAB && ["take", "sum", "kada", "people", "subs", "set"].indexOf(t) >= 0) { TAB = t; render(); } });
  window.addEventListener("beforeunload", e => { if (DIRTY) { e.preventDefault(); e.returnValue = ""; } });
  await load(Number(QS.get("m")) || null);
  // links from the help assistant and reminders: open a tali3a, a person, or a payment to confirm
  const tq = Number(QS.get("t")), pq = Number(QS.get("p")), pay = Number(QS.get("pay"));
  if (tq) { const t = TAL.find(x => x.id === tq); if (t) tali3aSheet(t); }
  else if (pq) { const p = ROSTER.find(x => x.id === pq); if (p) personSheet(p); }
  else if (pay && ROSTER.some(x => x.id === pay)) { PAYASK = { id: pay, amt: Number(QS.get("amt")) || 0 }; TAB = "subs"; render(); }
  // the assistant: move these people to that stage (ticked and chosen; the leader presses Move)
  const mv = (QS.get("move") || "").split(",").map(Number).filter(id => ROSTER.some(x => x.id === id));
  if (!tq && !pq && !pay && mv.length) moveSheet(mv, Number(QS.get("to")) || 0);
  if (tq || pq || pay || mv.length) history.replaceState(null, "", "attendance.html" + (BAS.allStages() ? "?s=" + SECID : "") + "#" + TAB);
})();
let PAYASK = null;

const yearStart = () => (BAS.settings && BAS.settings.att_year_start) || "2000-01-01";
// the subscription year is the scout year (or this calendar year until a scout year is set)
const subYear = () => (BAS.settings && BAS.settings.att_year_start) || (new Date().getFullYear() + "-01-01");
const subAmount = () => Number((BAS.settings && BAS.settings.sub_amount) || 0);
const paidOf = id => SUBS.filter(x => x.roster_id === id).reduce((t, x) => t + Number(x.amount), 0);
// 🎂 on the day (Cairo date)
const isBday = p => { if (!p.birthday) return false; const t = BAS.todayISO(); return p.birthday.slice(5) === t.slice(5); };
const cake = p => isBday(p) ? ' <span title="Birthday today">🎂</span>' : "";
// ⭐ 3arif · ☆ mosa3ed 3arif
const chk = p => p.check_note ? ' <span class="chk" title="' + esc(T("Needs checking") + ": " + p.check_note) + '">✱</span>' : "";
const star = p => { const t = TAL.find(x => x.arif_id === p.id || x.mosa3ed_id === p.id); return !t ? "" : t.arif_id === p.id ? ' <span class="pill gold">⭐ ' + esc(T("3arif")) + '</span>' : ' <span class="pill mut">☆ ' + esc(T("Mosa3ed")) + '</span>'; };
async function load(meetId) {
  try {
    SEC = BAS.allSections.find(s => s.id === SECID) || {};
    $("ttl").innerHTML = "<bdi>" + esc(SEC.name_ar || "") + "</bdi> · <em>" + esc(T("Attendance")) + "</em>";
    MEET = await BAS.q(supabaseClient.from("att_meetings").select("*").eq("section_id", SECID).gte("meet_date", yearStart()).order("meet_date", { ascending: false }));
    ROSTER = await BAS.q(supabaseClient.from("roster").select("*").eq("section_id", SECID).eq("is_active", true).order("name"));
    TAL = await BAS.q(supabaseClient.from("tali3as").select("*").eq("section_id", SECID).eq("is_active", true).order("name"));
    TL = TAL.length ? await BAS.q(supabaseClient.from("tali3a_leaders").select("*").in("tali3a_id", TAL.map(t => t.id))) : [];
    const ids = MEET.map(m => m.id);
    RECS = ids.length ? await BAS.q(supabaseClient.from("att_records").select("*").in("meeting_id", ids)) : [];
    const rl = await supabaseClient.rpc("stage_roles", { p_section: SECID }); ROLES = {}; (rl.data || []).forEach(x => { ROLES[x.profile_id] = x.stage_role; });
    const hr = await supabaseClient.rpc("att_year_records", { p_section: SECID }); HIST = hr.error ? null : (hr.data || []);
    const ys = subYear();
    SUBS = ROSTER.length && ys ? (await supabaseClient.from("sub_payments").select("*").eq("year_start", ys).in("roster_id", ROSTER.map(p => p.id))).data || [] : [];
    if (BAS.allStages()) PROF = await BAS.q(supabaseClient.from("profiles").select("id, full_name, stage_role").eq("section_id", SECID).eq("approval_status", "approved"));
    pickMeeting(meetId || (CUR && CUR.id));
    render();
  } catch (e) { $("view").innerHTML = '<div class="msg err">' + esc(BAS.errText(e)) + "</div>"; }
}
function pickMeeting(id) {
  const today = BAS.todayISO();
  CUR = MEET.find(m => m.id === id) || MEET.find(m => m.meet_date === today) || MEET.find(m => m.meet_date <= today && m.status !== "done") || MEET.find(m => m.meet_date <= today) || MEET[MEET.length - 1] || null;
  STATE = {}; DIRTY = false;
  if (!CUR) return;
  const R = RECS.filter(r => r.meeting_id === CUR.id);
  // nobody is marked at the start: tap ✓ for the people in front of you
  ROSTER.forEach(p => { const r = R.find(x => x.roster_id === p.id); STATE[p.id] = r ? { status: r.status, arrived: (r.arrived || "").slice(0, 5), uniform: r.uniform, foulard: r.foulard !== false } : { status: "", arrived: "", uniform: true, foulard: p.owns_foulard !== false }; });
}

function render() {
  if (BAS.setUnit) BAS.setUnit(SEC && SEC.unit_style === "raht");
  const tabs = [["take", "Take attendance"], ["sum", "Summary"], ["kada", "Kada"], ["people", "People & tali3as"], ["subs", "Subscription"], ["set", "Settings"]];
  $("tabs").innerHTML = tabs.map(t => '<button class="tab' + (TAB === t[0] ? " on" : "") + '" data-t="' + t[0] + '">' + t[1] + "</button>").join("");
  $("tabs").querySelectorAll("[data-t]").forEach(b => b.onclick = () => { TAB = b.dataset.t; history.replaceState(null, "", location.search + "#" + TAB); render(); });
  ({ take: takeView, sum: sumView, kada: kadaView, people: peopleView, subs: subsView, set: setView }[TAB] || takeView)();
}

// ---------- helpers ----------
const tName = id => (TAL.find(t => t.id === id) || {}).name || "";
const gTag = g => '<span class="gender ' + (g || "null") + '">' + (g === "M" ? "♂" : g === "F" ? "♀" : "?") + "</span>";
const fmtT = t => { if (!t) return ""; let [h, m] = t.slice(0, 5).split(":").map(Number); const ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12; return h + ":" + String(m).padStart(2, "0") + " " + ap; };
// the 4 kada first (قائد المرحلة, نائب, مساعدين), then everyone A to Z
const RANK = { head: 0, deputy: 1, assistant: 2 };
const rankOf = p => p.profile_id && ROLES[p.profile_id] in RANK ? RANK[ROLES[p.profile_id]] : 9;
const kadaSorted = () => ROSTER.filter(p => p.role === "kada").sort((x, y) => rankOf(x) - rankOf(y) || x.name.localeCompare(y.name));
// sort: by tali3a (1, 2, 3…), A–Z, or school year (oldest / youngest first)
let SORT = (() => { try { return localStorage.getItem("basSort") || "tali3a"; } catch (e) { return "tali3a"; } })();
const yIdx = p => { const i = YEARS.indexOf(p.school_year || ""); return i < 0 ? -1 : i; };
const byName = (a, b) => a.name.localeCompare(b.name, undefined, { numeric: true });
const talSorted = () => TAL.slice().sort(byName);
function sortList(L) {
  const x = L.slice();
  if (SORT === "old" || SORT === "young") {
    const d = SORT === "old" ? -1 : 1;
    x.sort((a, b) => { const ya = yIdx(a), yb = yIdx(b); if (ya < 0 && yb >= 0) return 1; if (yb < 0 && ya >= 0) return -1; if (ya !== yb) return d * (ya - yb);
      if (a.birthday && b.birthday && a.birthday !== b.birthday) return d * (a.birthday < b.birthday ? 1 : -1); return byName(a, b); });
  } else x.sort(byName);
  return x;
}
function ordered() {
  const k = kadaSorted(), a = ROSTER.filter(p => p.role !== "kada");
  const groups = [{ title: "Kada", list: k }];
  if (SORT !== "tali3a") { groups.push({ title: "Scouts", list: sortList(a) }); return groups.filter(g => g.list.length); }
  talSorted().forEach(t => groups.push({ title: t.name, list: sortList(a.filter(p => p.tali3a_id === t.id)) }));
  const none = a.filter(p => !p.tali3a_id || !TAL.some(t => t.id === p.tali3a_id));
  if (none.length) groups.push({ title: TAL.length ? "No tali3a" : "Scouts", list: sortList(none) });
  return groups.filter(g => g.list.length);
}
const sortSel = () => '<select class="sortsel" data-sort aria-label="Sort">' + [["tali3a", "By tali3a"], ["az", "A–Z"], ["old", "School year: oldest first"], ["young", "School year: youngest first"]].map(o => '<option value="' + o[0] + '"' + (SORT === o[0] ? " selected" : "") + ">↕ " + esc(T(o[1])) + "</option>").join("") + "</select>";
function bindSort(redraw) { document.querySelectorAll("[data-sort]").forEach(x => x.onchange = () => { SORT = x.value; try { localStorage.setItem("basSort", SORT); } catch (e) {} redraw(); }); }

// ---------- take attendance ----------
function takeView() {
  const today = BAS.todayISO();
  let h = '<div class="actions" style="margin:0 0 8px">' + (SEC.att_plan_only ? '<a class="btn line sm" href="plan.html?new=1">📝 ' + esc(T("New meeting plan")) + "</a>" : '<button class="btn line sm" id="mAdd">+ Meeting without items</button><a class="btn line sm" href="plan.html">📝 ' + esc(T("Meeting plans")) + "</a>") + (CUR && (BAS.isAdmin() || !RECS.some(r => r.meeting_id === CUR.id)) ? '<button class="btn danger sm" id="mDel">Delete this meeting</button>' : "") + "</div>";
  h += MEET.length ? '<div class="meets">' + MEET.slice().reverse().map(m => '<button class="meet ' + m.status + (CUR && m.id === CUR.id ? " on" : "") + '" data-m="' + m.id + '"><b>' + esc(BAS.fmtDate(m.meet_date, true)) + "</b>" +
    esc(m.start_time ? fmtT(m.start_time) : "—") + " · " + (m.status === "done" ? "✅" : m.status === "draft" ? "📝" : m.meet_date > today ? "🕓" : "⬜") + (m.title ? " · " + esc(m.title) : "") + "</button>").join("") + "</div>"
    : '<div class="empty">No meetings yet. Meetings come from the dates you book items for. For a meeting without items, press + Meeting without items.</div>';
  if (!CUR) { $("view").innerHTML = h; bindTake(); return; }
  const fut = CUR.meet_date > today;
  h += '<div class="panel"><div class="req-top"><h3>' + esc(BAS.fmtDate(CUR.meet_date, true)) + "<small>" + esc(CUR.start_time ? T("Starts") + " " + fmtT(CUR.start_time) : T("No start time")) + (CUR.title ? " · " + esc(CUR.title) : "") +
    (CUR.reservation_id ? " · #" + CUR.reservation_id : "") + '</small></h3><div><button class="linkbtn" id="mEdit">✏️ Time / title</button></div></div>' +
    '<div class="meta">' + (CUR.status === "done" ? "✅ Taken by " + esc(CUR.taken_by_name || "") + " · " + esc(BAS.fmtDateTime(CUR.taken_at)) : CUR.status === "draft" ? "📝 Draft saved by " + esc(CUR.taken_by_name || "") + " · " + esc(BAS.fmtDateTime(CUR.taken_at)) : "Not taken yet") +
    "</div></div>";
  if (fut) { $("view").innerHTML = h + '<div class="empty">This meeting hasn\'t happened yet.</div>'; bindTake(); return; }
  if (!ROSTER.length) { $("view").innerHTML = h + '<div class="empty">Nobody in the stage\'s list yet. <a class="lnk" href="#people" data-go="people">Add names</a></div>'; bindTake(); return; }
  h += '<input type="search" class="psearch" id="aq" placeholder="Search a name…" value="' + esc(Q) + '" autocomplete="off">' +
    '<div class="actions" style="margin:0 0 8px">' + sortSel() + (locked() ? "" : '<button class="btn line sm" id="allP">✓ Everyone present</button><button class="btn line sm" id="allU">👕🧣 Everyone in uniform + foulard</button>') + "</div>";
  ordered().forEach(g => {
    h += '<div class="group-title">' + esc(T(g.title)) + " (" + g.list.length + ')</div><div class="att-list">' + g.list.map(rowHTML).join("") + "</div>";
  });
  h += '<div class="att-sticky"><div class="meta" id="aCount"></div><div class="actions" style="margin:6px 0 0">' +
    (locked() ? '<span class="meta lockmsg">🔒 ' + esc(T("Finished. Press Edit to change it.")) + '</span><button class="btn line" id="aEdit">✏️ ' + esc(T("Edit")) + "</button>"
      : CUR.status === "done" ? '<button class="btn gold" id="aSaveCh">💾 ' + esc(T("Save changes")) + '</button><button class="btn line" id="aCancel">' + esc(T("Cancel")) + "</button>"
      : '<button class="btn gold" id="aFin">✅ Finish</button><button class="btn line" id="aDraft">💾 Save draft</button>') + "</div></div>";
  $("view").innerHTML = h;
  bindTake(); counts(); filter();
}
const isHere = s => s.status === "present" || s.status === "late" || s.status === "half";
// a finished meeting opens locked; Edit unlocks it until Save changes or Cancel
let EDITING = null;
const locked = () => !!CUR && CUR.status === "done" && EDITING !== CUR.id;
function rowHTML(p) {
  const s = STATE[p.id], half = s.status === "half", late = s.status === "late", here = isHere(s), off = here ? "" : " disabled";
  const noF = p.owns_foulard === false, lk = locked() ? " disabled" : "";
  return '<div class="att-row ' + (lk ? "locked " : "") + (half ? "half" : late ? "late" : s.status || "unmarked") + '" data-row="' + p.id + '" data-nm="' + esc(BAS.norm(p.name + " " + (p.name_ar || ""))) + '"><div class="att-name">' + gTag(p.gender) + " " + esc(p.name) + chk(p) + star(p) + cake(p) +
    (half ? ' <span class="pill warn">½ ' + esc(T("HALF ABSENT")) + "</span>" : late ? ' <span class="pill warn">' + esc(T("LATE")) + "</span>" : "") + "</div>" +
    '<div class="att-ctl"><span class="seg">' + [["present", "✓"], ["late", "Late"], ["half", "½"], ["absent", "Absent"], ["excused", "Excused"]].map(x => '<button type="button" data-st="' + x[0] + '"' + (x[0] === "half" ? ' title="' + esc(T("Half absent")) + '"' : "") + ' class="' + (s.status === x[0] ? "on" : "") + '"' + lk + ">" + esc(T(x[1])) + "</button>").join("") + "</span>" +
    '<label class="uni' + (here ? "" : " off") + '"><input type="checkbox" data-uni="' + p.id + '"' + (here && s.uniform ? " checked" : "") + (off || lk) + "> 👕 " + esc(T("Uniform")) + "</label>" +
      (noF ? '<span class="uni off nof" title="' + esc(T("Doesn't have a foulard yet")) + '">🧣 ' + esc(T("no foulard yet")) + "</span>"
        : '<label class="uni' + (here ? "" : " off") + '"><input type="checkbox" data-foul="' + p.id + '"' + (here && s.foulard ? " checked" : "") + (off || lk) + "> 🧣 " + esc(T("Foulard")) + "</label>") + "</div></div>";
}
function redrawRow(id) {
  const el = document.querySelector('[data-row="' + id + '"]'); if (!el) return;
  const tmp = document.createElement("div"); tmp.innerHTML = rowHTML(ROSTER.find(p => p.id === id)); el.replaceWith(tmp.firstChild);
  bindRows(); counts(); filter();
}
function counts() {
  const L = ROSTER.map(p => STATE[p.id]), n = x => L.filter((s, i) => x(s, i)).length;
  if ($("aCount")) $("aCount").textContent = (n(s => !s.status) ? T("Not marked") + " " + n(s => !s.status) + " · " : "") + T("Present") + " " + n(s => s.status === "present") + " · " + T("Late") + " " + n(s => s.status === "late") + " · " + T("Half absent") + " " + n(s => s.status === "half") + " · " + T("Absent") + " " + n(s => s.status === "absent") + " · " + T("Excused") + " " + n(s => s.status === "excused") + " · " + T("No uniform") + " " + n(s => isHere(s) && !s.uniform) + " · " + T("No foulard") + " " + n((s, i) => isHere(s) && !s.foulard && ROSTER[i].owns_foulard !== false);
}
function filter() { const q = BAS.norm(Q); document.querySelectorAll(".att-row[data-nm]").forEach(r => { r.hidden = !!q && !r.dataset.nm.includes(q); }); }
function bindRows() {
  document.querySelectorAll(".att-row").forEach(r => {
    const id = Number(r.dataset.row);
    r.querySelectorAll("[data-st]").forEach(b => b.onclick = () => { const s = STATE[id], p = ROSTER.find(x => x.id === id);
      // tapping it again clears it; marking someone here ticks uniform and foulard
      if (s.status === b.dataset.st) s.status = ""; else { if (!isHere(s)) { s.uniform = true; s.foulard = p.owns_foulard !== false; } s.status = b.dataset.st; }
      if (!isHere(s)) s.arrived = ""; DIRTY = true; redrawRow(id); });
    const u = r.querySelector("[data-uni]"); if (u) u.onchange = () => { STATE[id].uniform = u.checked; DIRTY = true; counts(); };
    const f = r.querySelector("[data-foul]"); if (f) f.onchange = () => { STATE[id].foulard = f.checked; DIRTY = true; counts(); };
  });
}
function bindTake() {
  document.querySelectorAll("[data-m]").forEach(b => b.onclick = () => {
    if (DIRTY && !confirm("You have attendance that isn't saved. Leave it?")) return;
    EDITING = null; DIRTY = false;
    pickMeeting(Number(b.dataset.m)); history.replaceState(null, "", "?" + (BAS.allStages() ? "s=" + SECID + "&" : "") + "m=" + CUR.id + "#take"); takeView();
  });
  document.querySelectorAll("[data-go]").forEach(a => a.onclick = e => { e.preventDefault(); TAB = a.dataset.go; render(); });
  if ($("mAdd")) $("mAdd").onclick = () => meetingSheet(null);
  if ($("mEdit")) $("mEdit").onclick = () => meetingSheet(CUR);
  if ($("mDel")) $("mDel").onclick = async () => {
    if (!confirm("Delete this meeting" + (RECS.some(r => r.meeting_id === CUR.id) ? " and its attendance" : "") + "?")) return;
    const { error } = await supabaseClient.rpc("delete_meeting", { p_id: CUR.id });
    if (error) return BAS.toast(BAS.errText(error), "err");
    CUR = null; DIRTY = false; BAS.toast("Deleted"); load();
  };
  if ($("aq")) $("aq").oninput = () => { Q = $("aq").value; filter(); };
  if ($("allP")) $("allP").onclick = () => { ROSTER.forEach(p => { STATE[p.id].status = "present"; }); DIRTY = true; takeView(); };
  if ($("allU")) $("allU").onclick = () => { ROSTER.forEach(p => { STATE[p.id].uniform = true; STATE[p.id].foulard = true; }); DIRTY = true; takeView(); };
  if ($("aFin")) $("aFin").onclick = () => save(true);
  if ($("aEdit")) $("aEdit").onclick = () => {
    if (!confirm(T("Change the attendance of") + " " + BAS.fmtDate(CUR.meet_date, true) + "? " + T("Nothing changes until you press Save changes."))) return;
    EDITING = CUR.id; takeView();
  };
  if ($("aCancel")) $("aCancel").onclick = () => { if (DIRTY && !confirm(T("Drop your changes?"))) return; EDITING = null; DIRTY = false; load(CUR.id); };
  if ($("aSaveCh")) $("aSaveCh").onclick = () => save(true, true);
  if ($("aDraft")) $("aDraft").onclick = () => save(false);
  bindSort(takeView);
  bindRows();
}
async function save(finish, change) {
  const un = ROSTER.filter(p => !STATE[p.id].status).length;
  if (change && !DIRTY) { EDITING = null; return takeView(); }
  if (change && !confirm((un ? T("Not marked") + ": " + un + ". " + T("They will count as absent.") + "\n\n" : "") + T("Save the changes to") + " " + BAS.fmtDate(CUR.meet_date, true) + "?")) return;
  if (finish && !change && !confirm((un ? T("Not marked") + ": " + un + ". " + T("They will count as absent.") + "\n\n" : "") + "Finish attendance for " + BAS.fmtDate(CUR.meet_date, true) + "? Alerts are sent now (absences, uniform).")) return;
  // a draft keeps only the people you marked; Finish saves the rest as absent

// ---------- summary ----------
function stats(p) {
  // this year's records follow the person, even from a stage they were in before
  const done = MEET.filter(m => m.status === "done").map(m => m.id);
  const R = HIST ? HIST.filter(r => r.roster_id === p.id && r.meet_status === "done") : RECS.filter(r => r.roster_id === p.id && done.indexOf(r.meeting_id) >= 0);
  const c = x => R.filter(r => r.status === x).length;
  const here = r => r.status === "present" || r.status === "late" || r.status === "half";
  const o = { total: R.length, present: c("present"), absent: c("absent"), excused: c("excused"), late: c("late"), half: c("half"), noUni: R.filter(r => here(r) && !r.uniform).length, noFoul: p.owns_foulard === false ? 0 : R.filter(r => here(r) && r.foulard === false).length };
  // Final %: each status is worth what the stage decided; Attended %: came at all (✓, late, ½, and excused if the stage says so)
  const W = { present: num(SEC.att_w_present, 1), late: num(SEC.att_w_late, 0), half: num(SEC.att_w_half, 0.5), excused: num(SEC.att_w_excused, 0.25), absent: num(SEC.att_w_absent, 0) };
  const worth = R.reduce((t, r) => t + (W[r.status] == null ? 0 : W[r.status]), 0);
  o.missed = o.total - worth;
  o.unexcused = R.filter(r => r.status !== "excused").reduce((t, r) => t + (1 - (W[r.status] == null ? 0 : W[r.status])), 0);
  o.came = o.present + o.late + o.half + (SEC.att_excused_came ? o.excused : 0);
  o.apct = o.total ? Math.round(o.came * 100 / o.total) : 0;
  o.pct = o.total ? Math.round(worth * 100 / o.total) : 0;
  const al = SEC.att_alert_pct == null ? 25 : SEC.att_alert_pct;
  o.band = !o.total ? "" : o.pct <= al ? "rr" : o.pct >= 75 ? "g" : o.pct >= 50 ? "y" : "r";
  return o;
}

// Egyptian numbers for WhatsApp: 01xxxxxxxxx → 201xxxxxxxxx
const waNum = n => { let d = String(n).replace(/\D/g, ""); if (d.startsWith("00")) d = d.slice(2); if (d.startsWith("0")) d = "2" + d; return d; };
function shrink(file) {
  return new Promise((ok, bad) => {
    const rd = new FileReader(), img = new Image();
    rd.onload = () => { img.onload = () => {
      const k = Math.min(1, 800 / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => b ? ok(b) : bad(new Error("That file is not a photo.")), "image/jpeg", 0.82);
    }; img.onerror = () => bad(new Error("That file is not a photo.")); img.src = rd.result; };
    rd.readAsDataURL(file);
  });
}

  const all = kadaSorted().concat(ROSTER.filter(p => p.role !== "kada").sort((a, b) => a.name.localeCompare(b.name)));
  const done = all.filter(p => paidOf(p.id) >= amt).length, total = all.reduce((t, p) => t + paidOf(p.id), 0);
  const row = p => { const pd = paidOf(p.id), left = Math.max(0, amt - pd), mine = SUBS.filter(x => x.roster_id === p.id);
    return '<div class="person' + (left ? "" : " paid") + '"><div><b>' + gTag(p.gender) + " " + esc(p.name) + "</b>" + (p.role === "kada" ? ' <small class="mut">' + esc(T("Kada")) + "</small>" : "") +
      '<div class="meta">' + (left ? (pd ? BAS.money(pd) + " " + esc(T("paid")) + " · " + BAS.money(left) + " " + esc(T("left")) : esc(T("Not paid"))) : "✅ " + esc(T("Paid")) + " " + BAS.money(pd)) +
      mine.map(x => ' · <span class="nowrap">' + esc(BAS.fmtDate(x.paid_on)) + " " + BAS.money(x.amount) + ' <button class="linkbtn sm" data-sdel="' + x.id + '" aria-label="Remove">✕</button></span>').join("") + "</div></div>" +
      (left ? '<div class="actions" style="margin:0"><button class="btn ok sm" data-spay="' + p.id + '" data-amt="' + left + '">' + esc(T("Paid")) + " " + BAS.money(left) + '</button><button class="btn line sm" data-spart="' + p.id + '">' + esc(T("Part…")) + "</button></div>" : "") + "</div>"; };
  const ask = PAYASK && ROSTER.find(p => p.id === PAYASK.id);
  const askLeft = ask ? Math.max(0, amt - paidOf(ask.id)) : 0, askAmt = ask ? (PAYASK.amt > 0 ? PAYASK.amt : askLeft) : 0;
  $("view").innerHTML = (ask ? '<div class="msg info ai-pay">🤖 ' + (askLeft ? esc(T("Mark as paid")) + ": <b>" + esc(ask.name) + "</b> · " + BAS.money(askAmt) + '<div class="actions" style="margin:8px 0 0"><button class="btn ok sm" id="apGo">' + esc(T("Save")) + '</button><button class="btn line sm" id="apNo">' + esc(T("Cancel")) + "</button></div>"
      : "<b>" + esc(ask.name) + "</b> " + esc(T("already paid")) + ' ✅ <button class="linkbtn" id="apNo">✕</button>') + "</div>" : "") +
    '<div class="kpis"><div class="kpi"><p>' + esc(T("Subscription this year")) + "</p><h3>" + BAS.money(amt) + '</h3></div><div class="kpi ok"><p>' + esc(T("Paid")) + "</p><h3>" + done + " / " + all.length + '</h3></div><div class="kpi gold"><p>' + esc(T("Collected")) + "</p><h3>" + BAS.money(total) + ' <small class="mut">/ ' + BAS.money(amt * all.length) + "</small></h3></div></div>" +
    '<input type="search" class="psearch" id="sq" placeholder="Search a name…" autocomplete="off">' +
    '<div class="group-title">' + esc(T("Not paid yet")) + " (" + (all.length - done) + ")</div>" + (all.filter(p => paidOf(p.id) < amt).map(row).join("") || '<div class="empty">👌</div>') +
    '<div class="group-title">' + esc(T("Paid")) + " (" + done + ")</div>" + (all.filter(p => paidOf(p.id) >= amt).map(row).join("") || '<div class="empty">—</div>');
  $("sq").oninput = () => { const q = BAS.norm($("sq").value); document.querySelectorAll("#view .person").forEach(el => { el.hidden = !!q && !BAS.norm(el.querySelector("b").textContent).includes(q); }); };
  const pay = async (id, a, note) => { const { error } = await supabaseClient.rpc("record_sub", { p_roster: id, p_amount: a, p_note: note || null }); if (error) return BAS.toast(BAS.errText(error), "err"); BAS.toast("Saved"); load(CUR && CUR.id); };
  document.querySelectorAll("[data-spay]").forEach(b => b.onclick = () => pay(Number(b.dataset.spay), Number(b.dataset.amt)));
  if ($("apGo")) $("apGo").onclick = () => { const a = PAYASK; PAYASK = null; pay(a.id, askAmt); };
  if ($("apNo")) $("apNo").onclick = () => { PAYASK = null; subsView(); };
  document.querySelectorAll("[data-spart]").forEach(b => b.onclick = () => { const v = prompt("How much did they pay (EGP)?"); if (v === null) return; if (!(Number(v) > 0)) return BAS.toast("Write a number", "err"); pay(Number(b.dataset.spart), Number(v)); });
  document.querySelectorAll("[data-sdel]").forEach(b => b.onclick = async () => { if (!confirm("Remove this payment?")) return; const { error } = await supabaseClient.rpc("delete_sub", { p_id: Number(b.dataset.sdel) }); if (error) return BAS.toast(BAS.errText(error), "err"); BAS.toast("Removed"); load(CUR && CUR.id); });
}

// ---------- settings for this stage ----------
function setView() {
  const roles = PROF.filter(p => p.stage_role && p.stage_role !== "leader");
  const w = (k, d) => num(SEC["att_w_" + k], d);
  $("view").innerHTML = '<div class="panel" style="max-width:600px"><h3>' + esc(T("How attendance is counted")) + '</h3><p class="meta">' + esc(T("Every stage decides. Each mark is worth a number from 0 to 1 in the Final %.")) + "</p>" +
    '<div class="grid3">' + [["present", "✓ Present", 1], ["late", "Late", 0], ["half", "½ Half", 0.5], ["excused", "Excused", 0.25], ["absent", "Absent", 0]].map(x => '<div class="field"><label>' + esc(T(x[1])) + '</label><input type="number" step="0.05" min="0" max="1" data-w="' + x[0] + '" value="' + w(x[0], x[2]) + '"></div>').join("") + "</div>" +
    '<div class="grid2"><div class="field"><label>' + esc(T("Does Excused count as \"came\" in the Attended %?")) + '</label><select id="sExc"><option value="0"' + (SEC.att_excused_came ? "" : " selected") + ">" + esc(T("No")) + '</option><option value="1"' + (SEC.att_excused_came ? " selected" : "") + ">" + esc(T("Yes")) + "</option></select></div>" +
    '<div class="field"><label>' + esc(T("Alert when a scout's Final % is (%) or less")) + '</label><input type="number" min="1" max="99" id="sAl" value="' + (SEC.att_alert_pct == null ? 25 : SEC.att_alert_pct) + '"></div></div>' +
    '<button class="btn ok" id="sSave">Save</button></div>' +
    '<div class="panel" style="max-width:600px"><h3>⭐ ' + esc(T("3arif & mosa3ed")) + '</h3><p class="meta">' + esc(T("Every how long the 3arif and mosa3ed change. Automatic tali3as get new ones picked; tali3as chosen by hand get a reminder to their leaders.")) + "</p>" +
    '<div class="grid2"><div class="field"><input type="number" min="1" max="52" id="sAe" value="' + (SEC.arif_every || 4) + '"></div><div class="field"><select id="sAu">' + [["weeks", "weeks"], ["months", "months"], ["meetings", "finished meetings"]].map(x => '<option value="' + x[0] + '"' + ((SEC.arif_unit || "weeks") === x[0] ? " selected" : "") + ">" + esc(T(x[1])) + "</option>").join("") + "</select></div></div>" +
    '<p class="meta">' + esc(T("Each tali3a chooses automatic or by hand: open it from People & tali3as.")) + '</p><button class="btn ok" id="sArif">Save</button></div>' +
    '<div class="panel" style="max-width:600px"><h3>Alerts</h3><ul class="meta" style="padding-inline-start:18px;line-height:1.8">' +
    "<li>" + esc(T("30 minutes after a meeting starts, if attendance isn't finished: every leader of the stage.")) + "</li>" +
    "<li>" + esc(T("A leader who misses 2 meetings without an excuse this year, counted by your values (and every time after): قائد المرحلة and نائب قائد المرحلة.")) + "</li>" +
    "<li>" + esc(T("A scout whose Final % is the alert level or less (after 4 meetings): the leaders of his tali3a.")) + "</li>" +
    "<li>" + esc(T("Anyone without the foulard 2 times this year (and every time after): the 4 kada and the leaders of their tali3a.")) + "</li>" +
    "<li>" + esc(T("A reminder before each meeting: every leader chooses how many minutes before in their profile.")) + "</li>" +
    "<li>" + esc(T("Birthdays: every leader of the stage at 9 AM on the day.")) + "</li>" +
    "<li>" + esc(T("Yearly subscription: a month after the scout year starts, and every month after, the stage's leaders and the warehouse team get how many haven't paid.")) + "</li></ul>" +
    '<p class="meta">' + esc(T("The stage roles (قائد المرحلة, نائب, مساعدين) are set by the warehouse team.")) + (BAS.isAdmin() ? ' <a class="lnk" href="team.html#people">' + esc(T("Set them in Accounts")) + "</a>" : "") + "</p>" +
    (roles.length ? '<div class="meta">' + roles.map(p => esc(p.full_name) + ": " + esc({ head: "قائد المرحلة", deputy: "نائب قائد المرحلة", assistant: "مساعد قائد المرحلة" }[p.stage_role])).join(" · ") + "</div>" : "") + "</div>" +
    '<div class="panel" style="max-width:600px"><h3>📝 ' + esc(T("Meeting plans (تحضير)")) + '</h3><label class="pick' + (SEC.att_plan_only ? " on" : "") + '"><input type="checkbox" id="sPO"' + (SEC.att_plan_only ? " checked" : "") + (BAS.isAdmin() ? "" : " disabled") + "> " +
      esc(T("Meetings only come from the meeting plan")) + '</label><p class="meta">' + esc(T("When on, a meeting appears only when its plan is sent: no \"+ Meeting without items\", and bookings or calendar events don't make meetings. Only the warehouse team changes this.")) + "</p></div>" +
    '<div class="panel" style="max-width:600px"><h3>' + esc(T("Once a year")) + '</h3><p class="meta">' + esc(T("Move scouts or kada to another stage. Their details, subscription and this year's attendance go with them.")) + '</p><button class="btn line" id="sMove">⇪ ' + esc(T("Move to another stage")) + "</button></div>";
  $("sSave").onclick = async () => {
    const W = {}; document.querySelectorAll("[data-w]").forEach(x => { W[x.dataset.w] = Number(x.value); });
    const al = Number($("sAl").value), ex = $("sExc").value === "1";
    const { error } = await supabaseClient.rpc("save_att_rules", { p_section: SECID, p_alert_pct: al, p_w: W, p_excused_came: ex });
    if (error) return BAS.toast(BAS.errText(error), "err");
    Object.keys(W).forEach(k => { SEC["att_w_" + k] = W[k]; }); SEC.att_alert_pct = al; SEC.att_excused_came = ex; BAS.toast("Saved");
  };
  $("sMove").onclick = () => moveSheet();
  if ($("sPO") && BAS.isAdmin()) $("sPO").onchange = async () => {
    const on = $("sPO").checked;
    const { error } = await supabaseClient.rpc("set_plan_only", { p_section: SECID, p_on: on });
    if (error) { $("sPO").checked = !on; return BAS.toast(BAS.errText(error), "err"); }
    SEC.att_plan_only = on; $("sPO").closest(".pick").classList.toggle("on", on); BAS.toast(T("Saved"));
  };
  $("sArif").onclick = async () => {
    const e = Number($("sAe").value), u = $("sAu").value;
    const { error } = await supabaseClient.rpc("save_arif_settings", { p_section: SECID, p_every: e, p_unit: u });
    if (error) return BAS.toast(BAS.errText(error), "err");
    SEC.arif_every = e; SEC.arif_unit = u; BAS.toast("Saved");
  };
}
</script>
</body>
