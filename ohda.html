<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3ohda | BAS Warehouse</title>
<link rel="icon" href="logo.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#17196A">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<meta name="color-scheme" content="only light">
<link rel="stylesheet" href="bas.css">
<script>(function(){var t="light";try{t=localStorage.getItem("basTheme")==="dark"?"dark":"light"}catch(e){}document.documentElement.dataset.theme=t;var m=document.querySelector('meta[name="color-scheme"]');if(m)m.content="only "+t})()</script>
</head>
<body>
<main class="page">
  <div class="head"><div><p class="eyebrow">3ohda</p><h1>Who has <em>what</em></h1>
    <p class="sub">Everything that is out right now, by stage and by person. In camps and trips, each person's share is listed.</p></div>
    <div class="actions" style="margin:0"><a class="btn gold" href="camp.html?new=Camp">⛺ + New camp</a><a class="btn line" href="camp.html?new=Trip">🚌 + New trip</a></div></div>
  <div class="toolbar"><select id="fSec" hidden></select><input id="fQ" type="search" placeholder="Person or item…"></div>
  <div id="view"><div class="loading">Loading…</div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="common.js"></script>
<script src="i18n.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = s => BAS.esc(s);
let BY = {}, RES = [], PEOPLE = [], CUST = [], F = "all", CAMPS = [], CP = [], CC = [], DR = [];

(async function () {
  await BAS.init("ohda");
  if (!BAS.requireApproved()) return;
  $("fQ").value = new URLSearchParams(location.search).get("q") || "";
  if (BAS.isAdmin()) {
    $("fSec").hidden = false;
    $("fSec").innerHTML = '<option value="all">All stages and services</option>' + BAS.sections.map(s => '<option value="s' + s.id + '">' + esc(s.name_ar) + " · " + esc(s.name_en) + "</option>").join("") +
      BAS.services.map(v => '<option value="v' + v.id + '">' + esc(v.name_ar) + "</option>").join("");
    $("fSec").onchange = () => { F = $("fSec").value; draw(); };
  }
  $("fQ").oninput = draw;
  try {
    const st = await BAS.loadStock(); BY = st.byId;
    const ALL = await BAS.loadReservations(BY);
    RES = ALL.filter(r => BAS.OUT.indexOf(r.status) >= 0);
    CAMPS = ALL.filter(r => r.kind && r.kind !== "Meeting" && ["Cancelled", "Rejected", "Completed"].indexOf(r.status) < 0).sort((a, b) => a.meeting_date > b.meeting_date ? 1 : -1);
    const d = await supabaseClient.from("drafts").select("*").order("updated_at", { ascending: false });
    DR = (d.data || []).filter(x => x.data && (x.data.kind === "Camp" || x.data.kind === "Trip"));
    const cids = CAMPS.map(r => r.id);
    if (cids.length) { CP = await BAS.q(supabaseClient.from("trip_people").select("id, reservation_id").in("reservation_id", cids)); CC = await BAS.q(supabaseClient.from("custody").select("id, reservation_id").in("reservation_id", cids)); }
    const ids = RES.map(r => r.id);
    if (ids.length) {
      PEOPLE = await BAS.q(supabaseClient.from("trip_people").select("*").in("reservation_id", ids));
      CUST = await BAS.q(supabaseClient.from("custody").select("*").in("reservation_id", ids));
    }
    draw();
  } catch (e) { $("view").innerHTML = '<div class="msg err">' + esc(BAS.errText(e)) + "</div>"; }
})();

function draw() {
  const q = BAS.norm($("fQ").value);
  const pass = r => F === "all" || (F[0] === "s" ? r.section_id === Number(F.slice(1)) : r.service_id === Number(F.slice(1)));
  const L = RES.filter(pass);
  const groups = {};
  L.forEach(r => { const k = r.service_id ? "v" + r.service_id : "s" + r.section_id; (groups[k] = groups[k] || []).push(r); });
  let h = "", shown = 0;
  Object.keys(groups).forEach(k => {
    const rs = groups[k];
    let body = "";
    rs.forEach(r => {
      const out = r.items.filter(i => i.out > 0 && i.kind !== "Consumable");
      const cust = CUST.filter(c => c.reservation_id === r.id && c.returned_qty < c.qty);
      const people = PEOPLE.filter(p => p.reservation_id === r.id);
      const holder = r.received_by_name || r.requester || "";
      const itemsTxt = out.map(i => BAS.lineName(i) + " ×" + i.out).join(" ");
      if (q && !BAS.norm(holder + " " + itemsTxt + " " + people.map(p => p.name).join(" ") + " #" + r.id).includes(q)) return;
      shown++;
      body += '<div class="req ' + BAS.statusSlug(r.status) + '"><div class="req-top"><h3>#' + r.id + " · " + esc(BAS.fmtDate(r.meeting_date, true)) + "<small>" + esc(r.place || "") + (r.return_by ? " · return by " + esc(BAS.fmtDate(r.return_by)) : "") + "</small></h3>" +
        "<div>" + (BAS.isOverdue(r) ? '<span class="pill late">OVERDUE</span> ' : "") + BAS.statusBadge(r.status) + "</div></div>" + BAS.tripLine(r);
      if (cust.length) {
        const byP = {};
        cust.forEach(c => { (byP[c.person_id] = byP[c.person_id] || []).push(c); });
        body += '<div class="tscroll"><table class="ltable"><tr><th>Person</th><th>Has</th></tr>' + Object.keys(byP).map(pid => {
          const p = people.find(x => x.id === Number(pid)) || { name: "?", gender: "M" };
          if (q && !BAS.norm(p.name + " " + byP[pid].map(c => BAS.itemLabel(BY, c.item_id, c.variant_id)).join(" ")).includes(q) && !BAS.norm(itemsTxt + " #" + r.id).includes(q)) return "";
          return '<tr><td><span class="gender ' + (p.gender || "null") + '">' + (p.gender === "M" ? "♂" : p.gender === "F" ? "♀" : "?") + "</span> <b>" + esc(p.name) + '</b> <small class="mut">' + (p.role === "kada" ? "Kada" : "Walad") + "</small></td><td>" +
            byP[pid].map(c => '<a class="lnk" href="item.html?id=' + c.item_id + '">' + esc(BAS.itemLabel(BY, c.item_id, c.variant_id)) + "</a> ×" + (c.qty - c.returned_qty)).join(" · ") + "</td></tr>";
        }).join("") + "</table></div>";
      } else {
        body += '<div class="meta">With <b>' + esc(holder) + "</b></div>" + '<div class="meta">' + out.map(i => '<a class="lnk" href="item.html?id=' + i.item_id + '">' + esc(BAS.lineName(i)) + "</a> ×" + i.out).join(" · ") + "</div>";
      }
      body += "</div>";
    });
    if (body) h += '<div class="group-title"><bdi>' + esc(k[0] === "v" ? BAS.serviceName(Number(k.slice(1))) : BAS.sectionName(Number(k.slice(1)))) + "</bdi></div>" + body;
  });
  const camps = CAMPS.filter(pass).filter(r => !q || BAS.norm("#" + r.id + " " + (r.place || "") + " " + BAS.borrowerName(r.section_id, r.service_id, r.who_name)).includes(q));
  const ch = camps.length ? '<div class="group-title">Camps & trips</div><div class="stages">' + camps.map(r => {
    const np = CP.filter(x => x.reservation_id === r.id).length, nc = CC.filter(x => x.reservation_id === r.id).length;
    return '<a class="stage' + (r.kind === "Camp" ? "" : " svc") + '" href="camp.html?id=' + r.id + '"><h4>' + (r.kind === "Camp" ? "⛺ " : "🚌 ") + "<bdi>" + esc(BAS.borrowerName(r.section_id, r.service_id, r.who_name)) + "</bdi> · #" + r.id + "</h4>" +
      '<div class="en">' + esc(BAS.fmtDate(r.meeting_date, true)) + (r.end_date ? " → " + esc(BAS.fmtDate(r.end_date, true)) : "") + " · " + esc(r.place || "") + "</div>" +
      "<dl><dt>Phase 1: items</dt><dd>" + r.items.length + "</dd><dt>Phase 2: who is going</dt><dd" + (np ? "" : ' class="bad"') + ">" + (np || "—") + "</dd><dt>3ohda</dt><dd" + (nc ? "" : ' class="bad"') + ">" + (nc ? "✓" : "—") + "</dd></dl></a>";
  }).join("") + "</div>" : "";
  const dh = DR.length ? '<div class="group-title">📝 Drafts</div>' + DR.map(x => '<div class="person"><div><b dir="auto">' + esc(x.title || "Draft") + '</b><div class="meta">' + esc(BAS.fmtDateTime(x.updated_at)) + "</div></div>" +
    '<div class="actions" style="margin:0"><a class="btn sm" href="camp.html?new=' + x.data.kind + "&draft=" + x.id + '">Continue</a></div></div>').join("") : "";
  $("view").innerHTML = dh + ch + (h ? '<div class="group-title">Out now</div>' + h : '<div class="group-title">Out now</div><div class="empty">' + (q ? "Nothing matches." : "Nothing is out right now.") + "</div>");
}
</script>
</body>
</html>
