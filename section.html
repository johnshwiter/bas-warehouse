<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stage | BAS Warehouse</title>
<link rel="icon" href="logo.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#17196A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BAS Warehouse">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="bas.css">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("basTheme")==="dark"?"dark":"light"}catch(e){}</script>
</head>
<body>
<main class="page">
  <div class="crumbs" id="crumbs" hidden><a href="team.html">Overview</a> › <span id="crumbName"></span></div>
  <div class="head">
    <div>
      <p class="eyebrow" id="eyebrow">Your stage</p>
      <h1 id="title">…</h1>
      <p class="sub" id="sub"></p>
    </div>
    <div class="actions" style="margin:0"><a class="btn gold" href="book.html" id="bookBtn">+ Book items</a></div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div id="view"><div class="loading">Loading…</div></div>
</main>
<div class="overlay" id="sheet" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="common.js"></script>
<script src="i18n.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = s => BAS.esc(s);
const P = new URLSearchParams(location.search);
let SEC = null, SVC = null;          // which stage or service this page is for
let STOCK = [], BY = {}, RES = [], LOSSES = [], PAYMENTS = [], ANN = [], EVENTS = [], WAIT = [], MSGS = [];
let TAB = (location.hash || "#dash").slice(1);
let H = { item: "", from: "", to: "", text: P.get("q") || "", status: "All" };   // history filters
let CM = null, CSEL = null;                                        // calendar month + selected day

(async function () {
  await BAS.init("stage");
  if (!BAS.requireApproved()) return;
  if (BAS.isAdmin()) {
    SEC = Number(P.get("id")) || null; SVC = Number(P.get("service")) || null;
    if (!SEC && !SVC && BAS.profile.section_id) SEC = BAS.profile.section_id;
    if (!SEC && !SVC) { location.replace("team.html"); return; }
    $("crumbs").hidden = false;
    const own = SEC && SEC === BAS.profile.section_id;
    const nv = document.querySelector('[data-nav="' + (own ? "stage" : "overview") + '"]'); if (nv) nv.classList.add("on");
    if (own) $("crumbs").hidden = true;
  } else {
    SEC = BAS.profile.section_id;
    if (!SEC) { $("view").innerHTML = '<div class="msg err">Your account has no stage. Ask the warehouse team.</div>'; return; }
    if ((P.get("id") && Number(P.get("id")) !== SEC) || P.get("service")) { location.replace("section.html"); return; }
  }
  const name = SVC ? BAS.serviceName(SVC) : BAS.sectionName(SEC);
  const en = SVC ? (BAS.services.find(s => s.id === SVC) || {}).name_en : BAS.sectionName(SEC, "en");
  $("title").innerHTML = '<bdi dir="auto">' + esc(name) + "</bdi>" + (en && en !== name ? ' <em style="font-size:.6em">' + esc(en) + "</em>" : "");
  $("eyebrow").textContent = SVC ? "Church service" : (BAS.isAdmin() && SEC !== BAS.profile.section_id ? "Scout stage" : BAS.welcomeText());
  $("crumbName").textContent = name;
  $("sub").textContent = "Requests, equipment out, history, losses and news for " + (SVC ? "this service" : "this stage") + ".";
  if (BAS.isAdmin()) $("bookBtn").textContent = "+ Book for them";
  document.title = name + " | BAS Warehouse";
  await load();
})();

async function load() {
  try {
    const st = await BAS.loadStock(); STOCK = st.list; BY = st.byId;
    const f = SVC ? { service_id: SVC } : { section_id: SEC };
    RES = await BAS.loadReservations(BY, f);
    const key = SVC ? "service_id" : "section_id", val = SVC || SEC;
    LOSSES = await BAS.q(supabaseClient.from("loss_status").select("*").eq(key, val).order("created_at", { ascending: false }));
    PAYMENTS = await BAS.q(supabaseClient.from("payments").select("*").eq(key, val).order("paid_on", { ascending: false }));
    const a = await supabaseClient.from("announcements").select("*").order("created_at", { ascending: false }).limit(60);
    ANN = (a.data || []).filter(x => x.target === "all" || (SVC ? x.service_id === SVC : x.section_id === SEC));
    const ev = await supabaseClient.from("events").select("*").order("start_date");
    EVENTS = (ev.data || []).filter(e => SVC ? e.service_id === SVC : (e.section_id === SEC || (!e.section_id && !e.service_id)));
    const w = await supabaseClient.from("waitlist").select("*").in("status", ["Waiting", "Available"]).order("created_at");
    WAIT = SVC ? [] : (w.data || []).filter(x => x.section_id === SEC);
    MSGS = await BAS.loadMessages(SVC ? { service_id: SVC } : { section_id: SEC });
    render();
  } catch (e) { $("view").innerHTML = '<div class="msg err">' + esc(BAS.errText(e)) + "</div>"; }
}

const owedLeft = () => LOSSES.reduce((t, l) => t + Number(l.remaining || 0), 0);
const isMine = r => r.requested_by === BAS.user.id;
function availOf(itemId, varId) {
  const i = BY[itemId]; if (!i || !i.counted) return 0;
  if (varId) { const v = (i.variants || []).find(x => x.id === varId); return v ? v.available : 0; }
  return i.available || 0;
}

function render() {
  const open = RES.filter(r => BAS.OPEN.indexOf(r.status) >= 0).length;
  const out = RES.filter(r => BAS.OUT.indexOf(r.status) >= 0).length;
  const tabs = [["dash", "Dashboard", 0], ["requests", "Requests", open], ["history", "History & search", 0], ["equipment", "Equipment out / back", out],
    ["money", "Missing & compensation", LOSSES.filter(l => !l.settled && Number(l.amount) > 0).length], ["chat", "Messages", 0], ["news", "Announcements", 0], ["calendar", "Calendar", 0]];
  if (!SVC) tabs.push(["wait", "Waitlist", WAIT.filter(w => availOf(w.item_id, w.variant_id) > 0).length]);
  $("tabs").innerHTML = tabs.map(t => '<button class="tab' + (TAB === t[0] ? " on" : "") + '" data-t="' + t[0] + '">' + t[1] + (t[2] ? "<b>" + t[2] + "</b>" : "") + "</button>").join("");
  $("tabs").querySelectorAll(".tab").forEach(b => b.onclick = () => go(b.dataset.t));
  ({ dash, requests, history: historyView, equipment, money, news, chat: chatView, calendar: calendarView, wait: waitView }[TAB] || dash)();
}
window.addEventListener("hashchange", () => { const t = location.hash.slice(1); if (t && t !== TAB && RES) { TAB = t; render(); } });
function go(t) { TAB = t; history.replaceState(null, "", location.search + "#" + t); render(); window.scrollTo(0, 0); }

// ---------- dashboard ----------
function dash() {
  const n = s => RES.filter(r => s.indexOf(r.status) >= 0).length;
  const piecesOut = RES.filter(r => BAS.OUT.indexOf(r.status) >= 0).reduce((t, r) => t + r.items.reduce((a, i) => a + (i.kind === "Consumable" ? 0 : i.out), 0), 0);
  const k = (label, v, tab, cls) => '<div class="kpi ' + (cls || "") + '" data-go="' + tab + '"><p>' + label + "</p><h3>" + v + "</h3></div>";
  const soon = RES.filter(r => BAS.PRE.indexOf(r.status) >= 0).sort((a, b) => a.meeting_date > b.meeting_date ? 1 : -1);
  const outs = RES.filter(r => BAS.OUT.indexOf(r.status) >= 0).sort((a, b) => (a.return_by || "") > (b.return_by || "") ? 1 : -1);
  const today = BAS.todayISO();
  const evs = EVENTS.filter(e => (e.end_date || e.start_date) >= today).slice(0, 4);
  const back = WAIT.filter(w => availOf(w.item_id, w.variant_id) > 0);
  let h = '<div class="kpis">' +
    k("Waiting / preparing", n(["Pending", "Preparing"]), "requests", "warn") + k("Ready to collect", n(["Ready"]), "requests") +
    k("Pieces out now", piecesOut, "equipment") + k("Overdue", RES.filter(r => BAS.isOverdue(r)).length, "equipment", RES.some(r => BAS.isOverdue(r)) ? "bad" : "") +
    k("Missing pieces", LOSSES.filter(l => l.kind === "missing").reduce((t, l) => t + l.qty, 0), "money", "bad") +
    k("Damaged pieces", LOSSES.filter(l => l.kind === "damaged").reduce((t, l) => t + l.qty, 0), "money", "warn") +
    k("Still owed", BAS.money(owedLeft()), "money", owedLeft() > 0 ? "bad" : "ok") + k("Requests so far", RES.length, "history", "gold") + "</div>";
  if (back.length) h += back.map(w => '<div class="msg ok">🔔 <b>' + esc(BAS.itemLabel(BY, w.item_id, w.variant_id)) + "</b> is available again (" + availOf(w.item_id, w.variant_id) + ' now). <a class="lnk" href="book.html">Book it</a></div>').join("");
  if (ANN[0]) h += '<div class="ann"><small>📣 ' + esc(BAS.fmtDate(ANN[0].created_at)) + "</small><h4 dir=\"auto\">" + esc(ANN[0].title) + "</h4><p dir=\"auto\">" + esc(ANN[0].body) + "</p></div>";
  h += '<div class="cols"><div><div class="group-title">Coming up</div>' +
    (soon.length ? soon.slice(0, 4).map(r => BAS.reqCard(r, { stockBy: BY, actions: reqActions(r), msgs: MSGS })).join("") : '<div class="empty">No requests waiting. <a class="lnk" href="book.html">Book items</a></div>') +
    (outs.length ? '<div class="group-title">Out with ' + (SVC ? "them" : "the stage") + "</div>" + outs.map(r => '<div class="panel"><b>#' + r.id + "</b> · " + esc(BAS.fmtDate(r.meeting_date, true)) +
      " · return by <b" + (BAS.isOverdue(r) ? ' class="bad"' : "") + ">" + esc(BAS.fmtDate(r.return_by)) + '</b><div class="meta">' + r.items.filter(i => i.out > 0 && i.kind !== "Consumable").map(i => esc(BAS.lineName(i)) + " ×" + i.out).join(", ") + "</div></div>").join("") : "") +
    '</div><div><div class="group-title">Events</div>' +
    (evs.length ? evs.map(e => '<div class="panel"><b>' + esc(e.title) + '</b> <span class="pill mut">' + esc(e.kind.toUpperCase()) + '</span><div class="meta">' + esc(BAS.fmtDate(e.start_date, true)) + (e.end_date && e.end_date !== e.start_date ? " → " + esc(BAS.fmtDate(e.end_date, true)) : "") + (e.place ? " · " + esc(e.place) : "") + "</div></div>").join("")
      : '<div class="empty">No events yet. <a class="lnk" data-gocal>Add one</a></div>') + "</div></div>";
  $("view").innerHTML = h;
  $("view").querySelectorAll("[data-go]").forEach(el => el.onclick = () => go(el.dataset.go));
  $("view").querySelectorAll("[data-gocal]").forEach(el => el.onclick = () => go("calendar"));
  bindReq();
}

// ---------- requests ----------
function reqActions(r) {
  if (BAS.PRE.indexOf(r.status) < 0) return "";
  let a = "";
  if (BAS.isAdmin()) a += '<a class="btn line sm" href="book.html?edit=' + r.id + '">✏️ Edit</a><a class="btn sm" href="team.html#requests">Prepare / issue in team portal</a>';
  else if (!r.change) a += '<a class="btn line sm" href="book.html?edit=' + r.id + '">✏️ Ask to change</a>';
  if (!BAS.isAdmin() && r.change && r.change.requested_by === BAS.user.id) a += '<button class="btn line sm" data-wd="' + r.change.id + '">Withdraw change</button>';
  if (!BAS.isAdmin() && r.status === "Pending" && isMine(r)) a += '<button class="btn danger sm" data-cancel="' + r.id + '">Cancel request</button>';
  return a;
}
function requests() {
  const L = RES.filter(r => BAS.OPEN.indexOf(r.status) >= 0).sort((a, b) => a.meeting_date > b.meeting_date ? 1 : -1);
  $("view").innerHTML = (L.length ? L.map(r => BAS.reqCard(r, { stockBy: BY, actions: reqActions(r), msgs: MSGS })).join("") :
    '<div class="empty"><h3>No open requests</h3><p><a class="lnk" href="book.html">Book items</a> for the next meeting.</p></div>');
  bindReq();
}
async function redraw(fresh) {
  if (fresh) MSGS = await BAS.loadMessages(SVC ? { service_id: SVC } : { section_id: SEC });
  render();
}
function bindReq() {
  BAS.bindComments($("view"), redraw);
  $("view").querySelectorAll("[data-cancel]").forEach(b => b.onclick = async () => {
    const id = Number(b.dataset.cancel);
    if (!confirm("Cancel request #" + id + "? The items go back to available.")) return;
    const { error } = await supabaseClient.rpc("close_reservation", { p_id: id, p_status: "Cancelled", p_reason: "Cancelled by leader" });
    if (error) return BAS.toast(BAS.errText(error), "err");
    BAS.toast("Request cancelled"); load();
  });
  $("view").querySelectorAll("[data-wd]").forEach(b => b.onclick = async () => {
    if (!confirm("Withdraw your change? The request stays as it was.")) return;
    const { error } = await supabaseClient.rpc("decide_change", { p_change_id: Number(b.dataset.wd), p_approve: false, p_note: null });
    if (error) return BAS.toast(BAS.errText(error), "err");
    BAS.toast("Change withdrawn"); load();
  });
}

// ---------- history and search ----------
function historyView() {
  const items = {};
  RES.forEach(r => r.items.forEach(i => { items[i.item_id] = BY[i.item_id] ? BY[i.item_id].name_en : "Item #" + i.item_id; }));
  const opts = Object.keys(items).sort((a, b) => items[a] > items[b] ? 1 : -1);
  $("view").innerHTML = '<div class="panel"><div class="grid3">' +
    '<div class="field"><label>Item (when was it taken?)</label><select id="hItem"><option value="">Any item</option>' + opts.map(id => '<option value="' + id + '"' + (String(H.item) === id ? " selected" : "") + ">" + esc(items[id]) + "</option>").join("") + "</select></div>" +
    '<div class="field"><label>From date</label><input type="date" id="hFrom" value="' + esc(H.from) + '"></div>' +
    '<div class="field"><label>To date</label><input type="date" id="hTo" value="' + esc(H.to) + '"></div></div>' +
    '<div class="grid2"><div class="field" style="margin:0"><label>Meeting, place or request number</label><input id="hText" placeholder="Roof, 2:30, #12…" value="' + esc(H.text) + '"></div>' +
    '<div class="field" style="margin:0"><label>Status</label><select id="hStatus">' + ["All", "Open", "Returned", "Completed", "Cancelled", "Rejected"].map(s => "<option" + (s === H.status ? " selected" : "") + ">" + s + "</option>").join("") + "</select></div></div>" +
    '<div class="actions"><button class="btn line sm" id="hToday">What did we take today?</button><button class="btn line sm" id="hClear">Clear</button></div></div><div id="hOut"></div>';
  const upd = () => { H = { item: $("hItem").value, from: $("hFrom").value, to: $("hTo").value, text: $("hText").value, status: $("hStatus").value }; drawHistory(); };
  ["hItem", "hFrom", "hTo", "hStatus"].forEach(id => $(id).onchange = upd);
  $("hText").oninput = upd;
  $("hToday").onclick = () => { $("hFrom").value = $("hTo").value = BAS.todayISO(); upd(); };
  $("hClear").onclick = () => { H = { item: "", from: "", to: "", text: "", status: "All" }; historyView(); };
  drawHistory();
}
function drawHistory() {
  const q = H.text.trim().toLowerCase().replace(/^#/, "");
  let L = RES.filter(r => {
    if (H.from && r.meeting_date < H.from) return false;
    if (H.to && r.meeting_date > H.to) return false;
    if (H.item && !r.items.some(i => String(i.item_id) === H.item)) return false;
    if (H.status === "Open" && BAS.OPEN.indexOf(r.status) < 0) return false;
    if (H.status !== "All" && H.status !== "Open" && r.status !== H.status) return false;
    if (q && !((r.place || "").toLowerCase().includes(q) || (r.meeting_time || "").toLowerCase().includes(q) || String(r.id) === q || (r.notes || "").toLowerCase().includes(q))) return false;
    return true;
  }).sort((a, b) => a.meeting_date < b.meeting_date ? 1 : -1);
  let h = "";
  if (H.item) {
    const rows = [];
    L.forEach(r => r.items.filter(i => String(i.item_id) === H.item).forEach(i => rows.push({ r, i })));
    h += '<div class="group-title">' + esc(BY[H.item] ? BY[H.item].name_en : "") + ": every time it was booked</div>" +
      '<div class="panel tscroll"><table class="ltable"><tr><th>Meeting</th><th>Request</th><th>Colour</th><th class="num">Asked</th><th class="num">Issued</th><th class="num">Back</th><th class="num">Missing</th><th class="num">Damaged</th><th>Status</th></tr>' +
      (rows.length ? rows.map(x => '<tr class="click" data-jump="' + x.r.id + '"><td class="nowrap">' + esc(BAS.fmtDate(x.r.meeting_date, true)) + " " + esc(x.r.meeting_time || "") + "</td><td>#" + x.r.id + " · " + esc(x.r.place || "") + "</td><td>" + esc(x.i.variant || "—") +
        '</td><td class="num">' + x.i.quantity + '</td><td class="num">' + (x.i.issued_qty == null ? "—" : x.i.issued_qty) + '</td><td class="num">' + x.i.returned_qty + '</td><td class="num">' + x.i.missing_qty + '</td><td class="num">' + x.i.damaged_qty + "</td><td>" + BAS.statusBadge(x.r.status) + "</td></tr>").join("")
        : '<tr><td colspan="9">Never booked in these dates.</td></tr>') + "</table></div>";
  }
  h += '<div class="group-title">' + L.length + " request" + (L.length === 1 ? "" : "s") + "</div>" + (L.length ? L.map(r => BAS.reqCard(r, { stockBy: BY, msgs: MSGS })).join("") : '<div class="empty">Nothing matches.</div>');
  $("hOut").innerHTML = h;
  BAS.bindComments($("hOut"), async fresh => { if (fresh) MSGS = await BAS.loadMessages(SVC ? { service_id: SVC } : { section_id: SEC }); drawHistory(); });
  $("hOut").querySelectorAll("[data-jump]").forEach(tr => tr.onclick = () => { const el = $("req" + tr.dataset.jump); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); });
}

// ---------- equipment issued and returned ----------
function equipment() {
  const rows = [];
  RES.filter(r => r.issued_at).forEach(r => r.items.filter(i => i.issued_qty).forEach(i => rows.push({ r, i })));
  rows.sort((a, b) => a.r.issued_at < b.r.issued_at ? 1 : -1);
  const outRows = rows.filter(x => BAS.OUT.indexOf(x.r.status) >= 0 && x.i.out > 0 && x.i.kind !== "Consumable");
  const tbl = (list, empty) => list.length ? '<div class="panel tscroll"><table class="ltable"><tr><th>Item</th><th>Request</th><th>Taken</th><th>By</th><th class="num">Out</th><th class="num">Back</th><th class="num">Missing</th><th class="num">Damaged</th><th class="num">Still out</th><th>Return by / back</th></tr>' +
    list.map(x => '<tr><td><a class="lnk" href="item.html?id=' + x.i.item_id + '">' + esc(BAS.lineName(x.i)) + "</a></td><td>#" + x.r.id + "</td><td class=\"nowrap\">" + esc(BAS.fmtDateTime(x.r.issued_at)) + "</td><td>" + esc(x.r.received_by_name || "") +
      '</td><td class="num">' + x.i.issued_qty + '</td><td class="num">' + x.i.returned_qty + '</td><td class="num' + (x.i.missing_qty ? " bad" : "") + '">' + x.i.missing_qty + '</td><td class="num' + (x.i.damaged_qty ? " bad" : "") + '">' + x.i.damaged_qty +
      '</td><td class="num"><b>' + (x.i.kind === "Consumable" ? "used" : x.i.out) + "</b></td><td class=\"nowrap\">" + (x.r.returned_at ? "back " + esc(BAS.fmtDateTime(x.r.returned_at)) : x.r.return_by ? '<span class="' + (BAS.isOverdue(x.r) ? "bad" : "") + '">by ' + esc(BAS.fmtDate(x.r.return_by)) + "</span>" : "") + "</td></tr>").join("") + "</table></div>"
    : '<div class="empty">' + empty + "</div>";
  $("view").innerHTML = '<div class="group-title">Out now</div>' + tbl(outRows, "Nothing is out right now.") +
    '<div class="group-title">Everything issued (newest first)</div>' + tbl(rows, "Nothing has been taken yet.");
}

// ---------- missing & compensation ----------
function money() {
  const total = LOSSES.reduce((t, l) => t + Number(l.amount), 0), paid = PAYMENTS.reduce((t, p) => t + Number(p.amount), 0);
  let h = '<div class="kpis"><div class="kpi bad"><p>Total charged</p><h3>' + BAS.money(total) + '</h3></div><div class="kpi ok"><p>Paid</p><h3>' + BAS.money(paid) +
    '</h3></div><div class="kpi gold"><p>Remaining</p><h3>' + BAS.money(owedLeft()) + "</h3></div></div>" +
    '<p class="meta" style="margin-bottom:10px">Compensation belongs to the whole ' + (SVC ? "service" : "stage") + ", not to one leader.</p>" +
    '<div class="group-title">Missing and damaged</div>' + BAS.lossTable(LOSSES, BY, { admin: BAS.isAdmin(), edit: BAS.isAdmin() });
  if (BAS.isAdmin()) h += '<div class="group-title">Record a payment</div><div class="panel"><div class="grid3"><div class="field"><label>Amount (EGP)</label><input id="pAmt" type="number" min="1" inputmode="decimal"></div>' +
    '<div class="field"><label>Date paid</label><input id="pDate" type="date" value="' + BAS.todayISO() + '"></div><div class="field"><label>Note</label><input id="pNote"></div></div><button class="btn ok" id="pSave">Save payment</button></div>';
  h += '<div class="group-title">Payments</div>' + (PAYMENTS.length ? '<div class="panel tscroll"><table class="ltable"><tr><th>Date</th><th class="num">Amount</th><th>For</th><th>Note</th>' + (BAS.isAdmin() ? "<th></th>" : "") + "</tr>" +
    PAYMENTS.map(p => "<tr><td>" + esc(BAS.fmtDate(p.paid_on)) + '</td><td class="num"><b>' + BAS.money(p.amount) + "</b></td><td>" + (p.loss_id ? (() => { const l = LOSSES.find(x => x.id === p.loss_id); return l ? esc(BAS.itemLabel(BY, l.item_id, l.variant_id)) : "an item"; })() : "general") +
      "</td><td>" + esc(p.note || "") + "</td>" + (BAS.isAdmin() ? '<td class="nowrap"><button class="btn line sm" data-pedit="' + p.id + '">Edit</button> <button class="btn danger sm" data-pdel="' + p.id + '">Delete</button></td>' : "") + "</tr>").join("") + "</table></div>" : '<div class="empty">No payments yet.</div>');
  $("view").innerHTML = h;
  if (!BAS.isAdmin()) return;
  const rpc = async (fn, args, ok) => { const { error } = await supabaseClient.rpc(fn, args); if (error) return BAS.toast(BAS.errText(error), "err"); BAS.toast(ok); load(); };
  $("pSave").onclick = () => {
    const amt = Number($("pAmt").value);
    if (!(amt > 0)) return BAS.toast("Write an amount more than 0", "err");
    rpc("record_payment", { p_section_id: SVC ? null : SEC, p_service_id: SVC || null, p_amount: amt, p_paid_on: $("pDate").value || null, p_note: $("pNote").value, p_loss_id: null }, "Payment saved");
  };
  $("view").querySelectorAll("[data-lsave]").forEach(b => b.onclick = () => {
    const id = Number(b.dataset.lsave), v = Number(document.querySelector('[data-lp="' + id + '"]').value);
    if (!(v >= 0)) return BAS.toast("Price can't be negative", "err");
    rpc("set_loss_price", { p_id: id, p_unit_price: v }, "Price saved");
  });
  $("view").querySelectorAll("[data-lpaid]").forEach(b => b.onclick = () => {
    const l = LOSSES.find(x => x.id === Number(b.dataset.lpaid));
    if (confirm("Mark " + BAS.itemLabel(BY, l.item_id, l.variant_id) + " as paid? This records a payment of " + BAS.money(l.remaining) + ".")) rpc("settle_loss", { p_loss_id: l.id, p_note: null }, "Marked as paid");
  });
  $("view").querySelectorAll("[data-pdel]").forEach(b => b.onclick = () => { if (confirm("Delete this payment? You can restore it from Deleted.")) rpc("trash_item", { p_kind: "payment", p_id: b.dataset.pdel }, "Payment deleted"); });
  $("view").querySelectorAll("[data-pedit]").forEach(b => b.onclick = () => {
    const p = PAYMENTS.find(x => x.id === Number(b.dataset.pedit));
    const amt = prompt("Amount (EGP):", String(Number(p.amount))); if (amt === null) return;
    const note = prompt("Note:", p.note || ""); if (note === null) return;
    rpc("admin_edit_payment", { p_id: p.id, p_amount: Number(amt), p_paid_on: p.paid_on, p_note: note }, "Saved");
  });
  $("view").querySelectorAll("[data-ledit]").forEach(b => b.onclick = () => {
    const l = LOSSES.find(x => x.id === Number(b.dataset.ledit));
    const kind = prompt("Missing or damaged? (missing / damaged)", l.kind); if (kind === null) return;
    const qty = prompt("Qty:", String(l.qty)); if (qty === null) return;
    const price = prompt("Price per piece (EGP):", String(Number(l.unit_price))); if (price === null) return;
    const note = prompt("Note:", l.note || ""); if (note === null) return;
    rpc("admin_edit_loss", { p_id: l.id, p_kind: /dam|باي/i.test(kind) ? "damaged" : "missing", p_qty: Number(qty), p_price: Number(price), p_note: note }, "Saved");
  });
  $("view").querySelectorAll("[data-ldel]").forEach(b => b.onclick = () => { if (confirm("Delete this missing/damaged record (and payments tied to it)? You can restore it from Deleted.")) rpc("trash_item", { p_kind: "loss", p_id: b.dataset.ldel }, "Deleted"); });
}

// ---------- messages with the warehouse team ----------
let CHAT_T = null;
function chatView() {
  const L = MSGS.filter(m => !m.reservation_id);
  const cm = MSGS.filter(m => m.reservation_id).slice(-8).reverse();
  $("view").innerHTML = '<div class="cols"><div><p class="meta" style="margin-bottom:8px">' + (BAS.isAdmin() ? "Chat with this " + (SVC ? "service" : "stage") + "." : "Chat with the warehouse team. Everyone in your stage sees this conversation.") + "</p>" +
    BAS.chatHTML("stageChat", L) + "</div><div>" + '<div class="group-title">Latest comments on requests</div>' +
    (cm.length ? cm.map(m => '<div class="panel" style="padding:10px 12px"><small class="mut">#' + m.reservation_id + " · " + esc(m.sender_name || "") + " · " + esc(BAS.fmtDateTime(m.created_at)) + '</small><div dir="auto">' + esc(m.deleted_at ? "🗑" : m.body || "📷") + "</div></div>").join("") : '<div class="empty">No comments yet. Each request has its own comments under it.</div>') + "</div></div>";
  BAS.bindChat("stageChat", { section: SVC ? null : SEC, service: SVC || null }, async () => { MSGS = await BAS.loadMessages(SVC ? { service_id: SVC } : { section_id: SEC }); if (TAB === "chat") chatView(); });
  clearInterval(CHAT_T);
  CHAT_T = setInterval(async () => {
    if (TAB !== "chat") { clearInterval(CHAT_T); return; }
    const n = await BAS.loadMessages(SVC ? { service_id: SVC } : { section_id: SEC });
    const box = document.querySelector("#stageChat textarea");
    if (n.length !== MSGS.length && !(box && box.value)) { MSGS = n; chatView(); }
  }, 15000);
}

// ---------- announcements ----------
async function editAnn(a, done) {
  const t = prompt("Title:", a.title); if (t === null || !t.trim()) return;
  const body = prompt("Message:", a.body); if (body === null || !body.trim()) return;
  const { error } = await supabaseClient.from("announcements").update({ title: t.trim(), body: body.trim() }).eq("id", a.id);
  if (error) return BAS.toast(BAS.errText(error), "err");
  BAS.toast("Saved"); done();
}
function news() {
  let h = "";
  if (BAS.isAdmin()) h += '<div class="panel"><h3>Post to ' + esc(SVC ? BAS.serviceName(SVC) : BAS.sectionName(SEC)) + '</h3><div class="field"><label>Title</label><input id="aT"></div><div class="field"><label>Message</label><textarea id="aB"></textarea></div><button class="btn gold" id="aGo">Post</button></div>';
  h += ANN.length ? ANN.map(a => '<div class="ann"><small>' + esc(BAS.fmtDateTime(a.created_at)) + " · " + (a.target === "all" ? "everyone" : "this " + (SVC ? "service" : "stage")) + "</small><h4 dir=\"auto\">" + esc(a.title) + "</h4><p dir=\"auto\">" + esc(a.body) + "</p>" +
    (BAS.isAdmin() ? '<div class="actions"><button class="btn line sm" data-aedit="' + a.id + '">Edit</button><button class="btn danger sm" data-adel="' + a.id + '">Delete</button></div>' : "") + "</div>").join("") : '<div class="empty">No announcements yet.</div>';
  $("view").innerHTML = h;
  if (!BAS.isAdmin()) return;
  $("aGo").onclick = async () => {
    const t = $("aT").value.trim(), b = $("aB").value.trim();
    if (!t || !b) return BAS.toast("Write a title and a message", "err");
    const { error } = await supabaseClient.from("announcements").insert({ title: t, body: b, target: SVC ? "service" : "section", section_id: SVC ? null : SEC, service_id: SVC || null, created_by: BAS.user.id });
    if (error) return BAS.toast(BAS.errText(error), "err");
    BAS.toast("Posted"); load();
  };
  $("view").querySelectorAll("[data-aedit]").forEach(b => b.onclick = () => editAnn(ANN.find(x => x.id === Number(b.dataset.aedit)), load));
  $("view").querySelectorAll("[data-adel]").forEach(b => b.onclick = async () => {
    if (!confirm("Delete this announcement?")) return;
    const { error } = await supabaseClient.rpc("trash_item", { p_kind: "announcement", p_id: b.dataset.adel });
    if (error) return BAS.toast(BAS.errText(error), "err");
    load();
  });
}

// ---------- calendar ----------
function calendarView() {
  if (!CM) { const t = new Date(); CM = { y: t.getFullYear(), m: t.getMonth() }; }
  const items = BAS.calItems(RES, EVENTS, false);
  const label = new Date(CM.y, CM.m, 1).toLocaleDateString(BAS.loc(), { month: "long", year: "numeric" });
  const canAdd = BAS.isAdmin() || !SVC;
  $("view").innerHTML = '<div class="cal-head"><button class="btn line sm" id="cPrev">‹</button><h2>' + esc(label) + '</h2><button class="btn line sm" id="cNext">›</button><button class="btn line sm" id="cToday">Today</button>' +
    (canAdd ? '<button class="btn gold sm" id="cAdd" style="margin-left:auto">+ Add event</button>' : "") + '<a class="btn line sm" href="calendar.html">All stages calendar</a></div>' +
    '<div class="legend"><span class="ev pick">📦 Pickup</span><span class="ev ret">↩ Return due</span><span class="ev late">Overdue</span><span class="ev meet">👥 Meeting</span><span class="ev trip">🚌 Trip</span><span class="ev camp">⛺ Camp</span></div>' +
    BAS.calendarHTML(CM.y, CM.m, items, CSEL) + '<div id="cDay"></div>';
  $("cPrev").onclick = () => { CM.m--; if (CM.m < 0) { CM.m = 11; CM.y--; } calendarView(); };
  $("cNext").onclick = () => { CM.m++; if (CM.m > 11) { CM.m = 0; CM.y++; } calendarView(); };
  $("cToday").onclick = () => { CM = null; CSEL = BAS.todayISO(); calendarView(); };
  if ($("cAdd")) $("cAdd").onclick = () => eventSheet(null, CSEL);
  $("view").querySelectorAll("[data-day]").forEach(d => d.onclick = () => { CSEL = d.dataset.day; calendarView(); });
  if (CSEL) dayDetail(CSEL, items);
}
function dayDetail(iso, items) {
  const L = items.filter(x => x.date === iso);
  $("cDay").innerHTML = '<div class="group-title">' + esc(BAS.fmtDate(iso, true)) + "</div>" + (L.length ? L.map(x => {
    if (x.ref.ev) { const e = EVENTS.find(y => y.id === x.ref.ev); const mine = BAS.isAdmin() || e.created_by === BAS.user.id;
      return '<div class="panel"><b>' + esc(e.title) + '</b> <span class="pill mut">' + esc(e.kind.toUpperCase()) + '</span><div class="meta">' + esc(BAS.fmtDate(e.start_date, true)) + (e.end_date && e.end_date !== e.start_date ? " → " + esc(BAS.fmtDate(e.end_date, true)) : "") + (e.place ? " · " + esc(e.place) : "") + (e.note ? " · " + esc(e.note) : "") + "</div>" +
        '<div class="actions">' + BAS.eventLinks(e) + (mine ? '<button class="btn line sm" data-eedit="' + e.id + '">Edit</button><button class="btn danger sm" data-edel="' + e.id + '">Delete</button>' : "") + "</div>" + "</div>"; }
    const r = RES.find(y => y.id === x.ref.res); return BAS.reqCard(r, { stockBy: BY });
  }).join("") : '<div class="empty">Nothing on this day.' + (BAS.isAdmin() || !SVC ? ' <a class="lnk" id="cAdd2">Add an event</a>' : "") + "</div>");
  if ($("cAdd2")) $("cAdd2").onclick = () => eventSheet(null, iso);
  $("cDay").querySelectorAll("[data-eedit]").forEach(b => b.onclick = () => eventSheet(EVENTS.find(e => e.id === Number(b.dataset.eedit))));
  $("cDay").querySelectorAll("[data-edel]").forEach(b => b.onclick = async () => {
    if (!confirm("Delete this event?")) return;
    const { error } = BAS.isAdmin() ? await supabaseClient.rpc("trash_item", { p_kind: "event", p_id: b.dataset.edel }) : await supabaseClient.from("events").delete().eq("id", Number(b.dataset.edel));
    if (error) return BAS.toast(BAS.errText(error), "err");
    load();
  });
}
function eventSheet(e, day) {
  const o = $("sheet");
  e = e || { title: "", kind: "Meeting", start_date: day || BAS.todayISO(), end_date: "", place: "", note: "" };
  o.innerHTML = '<div class="sheet"><h2>' + (e.id ? "Edit event" : "New event") + '</h2><p class="sub">For ' + esc(SVC ? BAS.serviceName(SVC) : BAS.sectionName(SEC)) + '</p><div class="panel">' +
    '<div class="grid2"><div class="field"><label>Title</label><input id="eT" value="' + esc(e.title) + '" placeholder="Friday meeting, Camp…"></div><div class="field"><label>Type</label><select id="eK">' +
    ["Meeting", "Trip", "Camp", "Other"].map(k => "<option" + (k === e.kind ? " selected" : "") + ">" + k + "</option>").join("") + "</select></div></div>" +
    '<div class="grid2"><div class="field"><label>Start</label><input type="date" id="eS" value="' + esc(e.start_date) + '"></div><div class="field"><label>End (for trips and camps)</label><input type="date" id="eE" value="' + esc(e.end_date || "") + '"></div></div>' +
    '<div class="grid2"><div class="field"><label>Place</label><input id="eP" value="' + esc(e.place || "") + '"></div><div class="field"><label>Note</label><input id="eN" value="' + esc(e.note || "") + '"></div></div></div>' +
    '<div id="eErr" class="msg err" hidden></div><div class="actions"><button class="btn gold" id="eGo">Save</button><button class="btn line" id="eBack">Back</button></div></div>';
  o.hidden = false;
  $("eBack").onclick = () => { o.hidden = true; };
  o.onclick = ev => { if (ev.target === o) o.hidden = true; };
  $("eGo").onclick = async () => {
    const row = { title: $("eT").value.trim(), kind: $("eK").value, start_date: $("eS").value, end_date: $("eE").value || null, place: $("eP").value.trim() || null, note: $("eN").value.trim() || null };
    const fail = m => { $("eErr").textContent = m; $("eErr").hidden = false; };
    if (!row.title || !row.start_date) return fail("Write the title and the start date.");
    if (row.end_date && row.end_date < row.start_date) return fail("The end is before the start.");
    let r;
    if (e.id) r = await supabaseClient.from("events").update(row).eq("id", e.id);
    else r = await supabaseClient.from("events").insert(Object.assign(row, { section_id: SVC ? null : SEC, service_id: SVC || null, created_by: BAS.user.id }));
    if (r.error) return fail(BAS.errText(r.error));
    o.hidden = true; CSEL = row.start_date; BAS.toast("Event saved"); load();
  };
}

// ---------- waitlist ----------
function waitView() {
  $("view").innerHTML = '<p class="meta" style="margin-bottom:10px">Joining the waitlist does not book anything. When pieces come back you see it here, then you book normally. To join, open Book items and press Join waitlist on an item that has none left.</p>' +
    (WAIT.length ? '<div class="panel tscroll"><table class="ltable"><tr><th>Item</th><th class="num">Wanted</th><th class="num">Available now</th><th>Needed by</th><th>Who</th><th>Note</th><th></th></tr>' +
      WAIT.map(w => { const a = availOf(w.item_id, w.variant_id); return '<tr><td><a class="lnk" href="item.html?id=' + w.item_id + '">' + esc(BAS.itemLabel(BY, w.item_id, w.variant_id)) + '</a></td><td class="num">' + w.qty + '</td><td class="num">' +
        (a > 0 ? '<span class="pill ok">' + a + " AVAILABLE</span>" : '<span class="pill mut">0</span>') + "</td><td>" + esc(w.needed_by ? BAS.fmtDate(w.needed_by) : "—") + "</td><td>" + esc(w.profile_id === BAS.user.id ? "you" : "another leader") + "</td><td>" + esc(w.note || "") + "</td><td class=\"nowrap\">" +
        (a > 0 ? '<a class="btn ok sm" href="book.html">Book</a> ' : "") + (w.profile_id === BAS.user.id || BAS.isAdmin() ? '<button class="btn line sm" data-wl="' + w.id + '">Remove</button>' : "") + "</td></tr>"; }).join("") + "</table></div>"
      : '<div class="empty">Nobody from this stage is waiting for anything.</div>');
  $("view").querySelectorAll("[data-wl]").forEach(b => b.onclick = async () => {
    const { error } = await supabaseClient.rpc("leave_waitlist", { p_id: Number(b.dataset.wl) });
    if (error) return BAS.toast(BAS.errText(error), "err");
    load();
  });
}
</script>
