<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New password | BAS Warehouse</title>
    <link rel="icon" href="logo.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#17196A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BAS Warehouse">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <meta name="color-scheme" content="only light">
<link rel="stylesheet" href="bas.css">
<script>(function(){var t="light";try{t=localStorage.getItem("basTheme")==="dark"?"dark":"light"}catch(e){}document.documentElement.dataset.theme=t;var m=document.querySelector('meta[name="color-scheme"]');if(m)m.content="only "+t})()</script>
    <style>
        body { display: flex; align-items: center; justify-content: center; padding: 25px; }
        .box { width: 100%; max-width: 440px; background: #fff; border-radius: 18px; padding: 30px; box-shadow: var(--shadow); border-top: 5px solid var(--gold); }
        .box img { display: block; margin: 0 auto 10px; width: 64px; }
        .box h1 { text-align: center; font-size: 21px; margin-bottom: 18px; }
    </style>
</head>
<body>
    <main class="box">
        <img src="logo.png" alt="BA Scout">
        <h1>Choose a new password</h1>
        <div id="msg" class="msg warn">Checking your reset link…</div>
        <form id="f" hidden>
            <div class="field"><label for="p1">New password</label><input type="password" id="p1" minlength="6" required></div>
            <div class="field"><label for="p2">Type it again</label><input type="password" id="p2" minlength="6" required></div>
            <button class="btn" style="width:100%" id="b">Save new password</button>
        </form>
        <p style="text-align:center;margin-top:20px"><a href="auth.html" class="lnk" style="font-size:13px">Back to login</a></p>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="common.js"></script>
    <script src="i18n.js"></script>
    <script>
        const msg = document.getElementById("msg"), f = document.getElementById("f");
        let ready = false;
        function show(t, k) { msg.textContent = t; msg.className = "msg " + k; msg.hidden = false; }
        supabaseClient.auth.onAuthStateChange(function (event, session) {
            if ((event === "PASSWORD_RECOVERY" || event === "SIGNED_IN") && session && !ready) {
                ready = true; msg.hidden = true; f.hidden = false;
            }
        });
        setTimeout(function () { if (!ready) show("This reset link is not valid or has expired. Ask for a new one from the login page.", "err"); }, 4000);
        f.addEventListener("submit", async function (e) {
            e.preventDefault();
            const a = document.getElementById("p1").value, b = document.getElementById("p2").value;
            if (a.length < 6) return show("Use at least 6 characters.", "err");
            if (a !== b) return show("The two passwords are different.", "err");
            document.getElementById("b").disabled = true;
            const { error } = await supabaseClient.auth.updateUser({ password: a });
            document.getElementById("b").disabled = false;
            if (error) return show(error.message, "err");
            show("Password changed. Taking you to the warehouse…", "ok"); f.hidden = true;
            setTimeout(function () { location.href = "index.html"; }, 1200);
        });
    </script>
<script>
// 👁 show / hide the password
document.querySelectorAll('input[type="password"]').forEach(function (inp) {
  var w = document.createElement("div"); w.className = "pwwrap"; inp.parentNode.insertBefore(w, inp); w.appendChild(inp);
  var b = document.createElement("button"); b.type = "button"; b.className = "pweye"; b.textContent = "👁"; b.setAttribute("aria-label", "Show password");
  b.onclick = function () { var show = inp.type === "password"; inp.type = show ? "text" : "password"; b.textContent = show ? "🙈" : "👁"; b.setAttribute("aria-label", show ? "Hide password" : "Show password"); inp.focus(); };
  w.appendChild(b);
});
</script>
</body>
</html>
