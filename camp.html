<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Camp / trip | BAS Warehouse</title>
<link rel="icon" href="logo.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#17196A">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<meta name="color-scheme" content="only light">
<link rel="stylesheet" href="bas.css">
<script>(function(){var t="light";try{t=localStorage.getItem("basTheme")==="dark"?"dark":"light"}catch(e){}document.documentElement.dataset.theme=t;var m=document.querySelector('meta[name="color-scheme"]');if(m)m.content="only "+t})()</script>
</head>
<body>
<main class="page">
  <div class="crumbs"><a href="ohda.html">‹ 3ohda</a></div>
  <div id="view"><div class="loading">Loading…</div></div>
</main>
<div class="overlay" id="sheet" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="common.js"></script>
<script src="i18n.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = s => BAS.esc(s);
const QS = new URLSearchParams(location.search);
const ID = Number(QS.get("id"));
let NEW = null, CART = {}, STOCK = [], NQ = "";
let TAB = (location.hash || "#p1").slice(1);
let R = null, BY = {}, SEC = null, ROSTER = [], PEOPLE = [], CUST = [], ACCOUNTS = [], PICK = {}, TYPED = [], GRID = null, EDITP2 = false;



window.addEventListener("hashchange", () => { const t = location.hash.slice(1); if (R && ["p1", "p2", "ohda"].indexOf(t) >= 0 && t !== TAB) { TAB = t; render(); } });
(async function () {
  await BAS.init("ohda");
  if (!BAS.requireApproved()) return;
  if (QS.get("new")) await startNew(); else await load();
})();

async function load() {
  try {
    const st = await BAS.loadStock(); BY = st.byId;
    const list = await BAS.loadReservations(BY);
    R = list.find(x => x.id === ID);
    if (!R) { $("view").innerHTML = '<div class="empty">This request was not found.</div>'; return; }
    if (!R.kind || R.kind === "Meeting") { $("view").innerHTML = '<div class="empty">Request #' + ID + ' is a normal meeting, not a trip or camp.</div>'; return; }
    SEC = BAS.allSections.find(s => s.id === R.section_id) || null;
    ROSTER = R.section_id ? await BAS.q(supabaseClient.from("roster").select("*").eq("section_id", R.section_id).eq("is_active", true).order("name")) : [];
    PEOPLE = await BAS.q(supabaseClient.from("trip_people").select("*").eq("reservation_id", ID).order("id"));
    CUST = await BAS.q(supabaseClient.from("custody").select("*").eq("reservation_id", ID));
    PICK = {}; PEOPLE.filter(p => p.roster_id).forEach(p => { PICK[p.roster_id] = true; });
    TYPED = PEOPLE.filter(p => !p.roster_id).map(p => ({ name: p.name, gender: p.gender, role: p.role }));
    GRID = null; EDITP2 = !PEOPLE.length;
    render();
  } catch (e) { $("view").innerHTML = '<div class="msg err">' + esc(BAS.errText(e)) + "</div>"; }
}

const canEdit = () => R && ["Returned", "Completed", "Cancelled", "Rejected"].indexOf(R.status) < 0 && (BAS.isAdmin() || R.section_id === BAS.profile.section_id);
const has3 = () => !!(SEC && SEC.has_3eyal);
const roleName = r => r === "kada" ? "Kada" : "Walad";
const gTag = g => '<span class="gender ' + (g || "null") + '">' + (g === "M" ? "♂" : g === "F" ? "♀" : "?") + "</span>";
const secOf = () => NEW ? NEW.sec : R.section_id;
const qtyOf = l => l.issued_qty != null ? l.issued_qty : (l.prepared_qty || l.quantity);

function render() {
  document.title = "#" + R.id + " | BAS Warehouse"; BAS.addRecent((R.kind === "Trip" ? "🚌 " : "⛺ ") + "#" + R.id + " · " + BAS.borrowerName(R.section_id, R.service_id) + (R.place ? " · " + R.place : ""), "camp.html?id=" + R.id);
  let h = '<div class="head"><div><p class="eyebrow">' + (R.kind === "Camp" ? "⛺ Camp" : "🚌 Trip") + " · #" + R.id + "</p><h1>" + BAS.borrowerHTML(R) + "</h1>" +
    '<p class="sub">' + esc(BAS.fmtDate(R.meeting_date, true)) + (R.end_date ? " → " + esc(BAS.fmtDate(R.end_date, true)) : "") + " · " + esc(R.place || "") + " · " + BAS.statusBadge(R.status) + "</p></div>" +
    '<button class="btn gold" id="pdfBtn">📄 Save as PDF</button></div>';
  const tabs = [["p1", "Phase 1: items", 0], ["p2", "Phase 2: who is going", PEOPLE.length], ["ohda", "3ohda: who carries what", CUST.length ? "✓" : 0]];
  h += '<div class="tabs">' + tabs.map(t => '<button class="tab' + (TAB === t[0] ? " on" : "") + '" data-t="' + t[0] + '">' + t[1] + (t[2] ? "<b>" + t[2] + "</b>" : "") + "</button>").join("") + "</div>";
  if (TAB === "p2") h += EDITP2 && canEdit() ? phase2Form() : phase2View();
  else if (TAB === "ohda") h += PEOPLE.length ? ohdaView() : '<div class="empty">Write who is going first (Phase 2).</div>';
  else h += phase1View();
  $("view").innerHTML = h;
  $("view").querySelectorAll(".tab[data-t]").forEach(b => b.onclick = () => { TAB = b.dataset.t; history.replaceState(null, "", location.search + "#" + TAB); render(); });
  $("pdfBtn").onclick = printPDF;
  bind();
}

// ---------- phase 1 ----------
function phase1View() {
  const pre = BAS.PRE.indexOf(R.status) >= 0;
  const act = pre ? (BAS.isAdmin() ? '<a class="btn line sm" href="book.html?edit=' + R.id + '">✏️ Edit</a>' : (!R.change && R.section_id === BAS.profile.section_id ? '<a class="btn line sm" href="book.html?edit=' + R.id + '">✏️ Ask to change</a>' : "")) : "";
  return '<div class="panel"><div class="meta">Sent ' + esc(BAS.fmtDateTime(R.created_at)) + (R.requester ? " by " + esc(R.requester) : "") + (R.notes ? " · " + esc(R.notes) : "") + "</div>" +
    '<div class="tscroll"><table class="ltable"><tr><th>Item</th><th class="num">Asked</th><th class="num">Prepared</th><th class="num">Taken</th><th class="num">Back</th><th class="num">Missing</th><th class="num">Damaged</th></tr>' +
    R.items.map(i => '<tr><td><a class="lnk" href="item.html?id=' + i.item_id + '">' + esc(BAS.lineName(i)) + '</a></td><td class="num">' + i.quantity + '</td><td class="num">' + (i.prepared_qty || 0) + '</td><td class="num">' + (i.issued_qty == null ? "—" : i.issued_qty) +
      '</td><td class="num">' + i.returned_qty + '</td><td class="num">' + i.missing_qty + '</td><td class="num">' + i.damaged_qty + "</td></tr>").join("") + "</table></div>" +
    (R.change ? '<div class="change-box">✏️ Change waiting for the warehouse team: ' + BAS.changeSummary(R, R.change, BY) + "</div>" : "") +
    (act ? '<div class="actions">' + act + "</div>" : "") + "</div>";
}

// ---------- PDF (print → Save as PDF) ----------
function printPDF() {
  const g = currentGrid(), cols = R.items.filter(l => qtyOf(l) > 0);
  const who = BAS.borrowerName(R.section_id, R.service_id);
  const k = PEOPLE.filter(p => p.role === "kada"), a = PEOPLE.filter(p => p.role === "3ayel");
  const w = window.open("", "_blank");
  if (!w) return BAS.toast("Allow pop-ups to save the PDF", "err");
  const T = x => BAS.tr ? BAS.tr(x) : x;
  const dir = BAS.lang === "ar" ? "rtl" : "ltr";
  w.document.write('<!DOCTYPE html><html lang="' + BAS.lang + '" dir="' + dir + '"><head><meta charset="UTF-8"><title>' + esc(T(R.kind) + " #" + R.id + " · " + who) + '</title><style>' +
    'body{font-family:Cairo,Inter,Arial,sans-serif;color:#1B1D3A;margin:28px;font-size:12.5px}h1{color:#17196A;margin:0;font-size:22px}h2{color:#17196A;font-size:15px;margin:22px 0 6px;border-bottom:2px solid #F2C30F;padding-bottom:3px}' +
    '.top{display:flex;gap:14px;align-items:center;border-bottom:3px solid #17196A;padding-bottom:10px}.top img{width:54px}.mut{color:#5E6378}table{width:100%;border-collapse:collapse;margin-top:4px}th,td{border:1px solid #D9D7E3;padding:5px 7px;text-align:start}th{background:#F1F1FA}' +
    '.num{text-align:center}.sig{display:flex;gap:40px;margin-top:36px}.sig div{flex:1;border-top:1px solid #999;padding-top:4px;color:#5E6378}@page{margin:14mm}</style></head><body>' +
    '<div class="top"><img src="logo.png" alt=""><div><div class="mut" style="letter-spacing:2px;font-weight:700;font-size:10px">BI ARCHI ANGELOUS · BAS WAREHOUSE</div><h1>' + esc(T(R.kind === "Camp" ? "Camp" : "Trip")) + " #" + R.id + " · " + esc(who) + "</h1>" +
    '<div class="mut">' + esc(BAS.fmtDate(R.meeting_date, true)) + (R.end_date ? " → " + esc(BAS.fmtDate(R.end_date, true)) : "") + " · " + esc(R.place || "") + " · " + esc(T(BAS.STATUS_LABEL[R.status] || R.status)) + "</div></div></div>" +
    "<h2>" + esc(T("Phase 1: items")) + "</h2><table><tr><th>" + esc(T("Item")) + '</th><th class="num">' + esc(T("Asked")) + '</th><th class="num">' + esc(T("Taken")) + '</th><th class="num">' + esc(T("Back")) + "</th></tr>" +
    R.items.map(i => "<tr><td>" + esc(BAS.lineName(i)) + (BY[i.item_id] && BY[i.item_id].name_ar ? " · " + esc(BY[i.item_id].name_ar) : "") + '</td><td class="num">' + i.quantity + '</td><td class="num">' + (i.issued_qty == null ? "" : i.issued_qty) + '</td><td class="num">' + (i.issued_qty == null ? "" : i.returned_qty) + "</td></tr>").join("") + "</table>" +
    "<h2>" + esc(T("Phase 2: who is going")) + " (" + PEOPLE.length + ")</h2>" +
    (PEOPLE.length ? "<p><b>" + esc(T("Kada")) + " (" + k.length + "):</b> " + k.map(p => esc(p.name)).join("، ") + "</p>" + (R.kids_count ? "<p><b>" + esc(T("Kids")) + ":</b> " + R.kids_count + "</p>" : "") + (a.length ? "<p><b>" + esc(T("Awlad")) + " (" + a.length + "):</b> " + a.map(p => esc(p.name)).join("، ") + "</p>" : "") : '<p class="mut">—</p>') +
    "<h2>" + esc(T("3ohda: who carries what")) + "</h2>" +
    (PEOPLE.length && CUST.length ? "<table><tr><th>" + esc(T("Person")) + "</th><th>" + esc(T("Has")) + '</th><th style="width:22%">' + esc(T("Signature")) + "</th></tr>" +
      PEOPLE.map(p => { const has = cols.filter(l => Number(g[p.id][l.item_id + ":" + (l.variant_id || "")]) > 0).map(l => esc(BAS.lineName(l)) + " ×" + g[p.id][l.item_id + ":" + (l.variant_id || "")]);
        return "<tr><td>" + esc(p.name) + ' <span class="mut">(' + esc(T(roleName(p.role))) + ")</span></td><td>" + (has.join(" · ") || "—") + "</td><td></td></tr>"; }).join("") + "</table>" : '<p class="mut">' + esc(T("Not distributed yet.")) + "</p>") +
    '<div class="sig"><div>' + esc(T("Warehouse team")) + "</div><div>" + esc(T("Leader")) + '</div></div><p class="mut" style="margin-top:18px;font-size:10px">' + esc(new Date().toLocaleString(BAS.loc())) + "</p>" +
    "<script>window.onload=function(){setTimeout(function(){window.print()},300)}<\/script></body></html>");
  w.document.close();
}

// ---------- phase 2 ----------
function phase2View() {
  if (!PEOPLE.length) return '<div class="empty">Nobody written yet.' + (canEdit() ? ' <button class="btn gold sm" id="p2Edit">Write who is going</button>' : "") + "</div>";
  const k = PEOPLE.filter(p => p.role === "kada"), a = PEOPLE.filter(p => p.role === "3ayel");
  const list = L => L.map(p => '<span class="pick on" style="cursor:default">' + gTag(p.gender) + " " + esc(p.name) + "</span>").join("");
  return '<div class="panel"><div class="meta" style="margin-bottom:8px">' + PEOPLE.length + " people · saved " + esc(BAS.fmtDateTime(R.phase2_at)) + "</div>" +
    "<b>Kada (" + k.length + ')</b><div class="picks" style="margin:6px 0 12px">' + list(k) + "</div>" +
    (a.length ? "<b>Awlad (" + a.length + ')</b><div class="picks" style="margin-top:6px">' + list(a) + "</div>" : "") +
    (R.kids_count ? '<p class="meta" style="margin-top:8px">👧👦 ' + esc(BAS.tr ? BAS.tr("Kids") : "Kids") + ": <b>" + R.kids_count + "</b></p>" : "") +
    (canEdit() ? '<div class="actions"><button class="btn line sm" id="p2Edit">✏️ Edit the list</button></div>' : "") + "</div>";
}
function phase2Form(embedded) {
  const group = role => {
    const L = ROSTER.filter(p => p.role === role);
    return '<div class="picks">' + (L.length ? L.map(p => '<label class="pick' + (PICK[p.id] ? " on" : "") + '" data-nm="' + esc(BAS.norm(p.name)) + '"><input type="checkbox" data-pk="' + p.id + '"' + (PICK[p.id] ? " checked" : "") + ">" + gTag(p.gender) + " " + esc(p.name) +
      (p.profile_id ? "" : '<span style="margin-inline-start:auto"><button type="button" class="linkbtn sm" data-ren="' + p.id + '">rename</button> · <button type="button" class="linkbtn sm" data-hide="' + p.id + '">remove</button></span>') + "</label>").join("") : '<span class="mut">Nobody in the list yet. Add them below.</span>') + "</div>";
  };
  const kids = NEW ? NEW.kids : R.kids_count;
  return '<div class="panel">' + (embedded ? "<h3>Phase 2: who is going</h3>" : "") + '<p class="meta" style="margin-bottom:10px">Tick everyone who is going. Names you add are saved in the stage\'s list for next time.</p>' + (has3() ? "" : '<p class="meta" style="margin-bottom:10px">In this stage only kada are listed; write the number of kids.</p>') +
    '<input type="search" class="psearch" id="pq" placeholder="Search a name…" autocomplete="off">' +
    "<b>Kada</b>" + group("kada") + (has3() ? '<div style="margin-top:12px"><b>Awlad</b>' + group("3ayel") + "</div>" :
      '<div class="field" style="margin-top:12px;max-width:260px"><label>Number of kids going</label><input type="number" min="0" id="kidsN" inputmode="numeric" value="' + (kids == null ? "" : kids) + '"></div>') +
    '<details class="mt"><summary class="linkbtn">+ Add names to the stage\'s list</summary><p class="meta">One name per line, or paste a whole list.</p>' +
    '<div class="field"><textarea id="nNames" rows="3" placeholder="Kiro Samy&#10;Mina Adel"></textarea></div><div class="grid3">' +
    '<div class="field"><label>Boy / girl</label><select id="nGen"><option value="M">Boy / man</option><option value="F">Girl / woman</option></select></div>' +
    '<div class="field"><label>Kada or walad</label><select id="nRole"><option value="kada">Kada</option>' + (has3() ? '<option value="3ayel" selected>Walad</option>' : "") + "</select></div><div></div></div>" +
    '<button type="button" class="btn line sm" id="nAdd">+ Add to list</button></details>' +
    '<details class="mt"><summary class="linkbtn">+ One-time name (not saved in the list)</summary>' +
    TYPED.map((t, i) => '<div class="person"><div>' + gTag(t.gender) + " " + esc(t.name) + ' <span class="pill mut">' + esc(roleName(t.role).toUpperCase()) + '</span></div><button type="button" class="btn danger sm" data-tdel="' + i + '">Remove</button></div>').join("") +
    '<div class="grid3"><div class="field"><label>Name</label><input id="tName" placeholder="Guest leader…"></div><div class="field"><label>Boy / girl</label><select id="tGen"><option value="M">Boy / man</option><option value="F">Girl / woman</option></select></div>' +
    '<div class="field"><label>Kada or walad</label><select id="tRole"><option value="kada">Kada</option>' + (has3() ? '<option value="3ayel">Walad</option>' : "") + '</select></div></div><button type="button" class="btn line sm" id="tAdd">+ Add one-time name</button></details>' +
    (TYPED.length ? '<p class="meta">One-time: ' + TYPED.map(t => esc(t.name)).join("، ") + "</p>" : "") +
    (embedded ? "" : '<div id="p2Err" class="msg err" hidden></div><div class="actions"><button class="btn gold" id="p2Save">Save who is going</button>' + (PEOPLE.length ? '<button class="btn line" id="p2Cancel">Back</button>' : "") + "</div>" +
    (CUST.length ? '<p class="meta mt">The 3ohda is kept: people you take off give their items to the others, and new people get a share. The warehouse team gets a note to check it.</p>' : "")) + "</div>";
}
function chosenPeople() {
  return Object.keys(PICK).filter(k => PICK[k] && ROSTER.some(x => x.id === Number(k))).map(k => ({ roster_id: Number(k) })).concat(TYPED);
}
function kidsVal() { const v = $("kidsN") ? $("kidsN").value.trim() : ""; return v === "" ? null : Math.max(0, Math.round(Number(v)) || 0); }

// ---------- a new camp or trip, made on this page ----------
async function startNew() {
  const kind = QS.get("new") === "Trip" ? "Trip" : "Camp";
  NEW = { kind, sec: BAS.isAdmin() ? (BAS.profile.section_id || (BAS.sections[0] || {}).id) : BAS.profile.section_id, date: "", end: "", time: "", until: "", place: "", notes: "", kids: null, event: null, draft: null };
  if (!NEW.sec) { $("view").innerHTML = '<div class="msg err">Your account has no stage. Ask the warehouse team.</div>'; return; }
  try {
    const st = await BAS.loadStock(); BY = st.byId; STOCK = st.list.filter(i => i.is_active && i.counted);
    const ev = Number(QS.get("event")), dr = Number(QS.get("draft"));
    if (ev) { const e = await supabaseClient.from("events").select("*").eq("id", ev).single();
      if (!e.error) { const x = e.data; NEW.event = x.id; NEW.kind = x.kind === "Trip" ? "Trip" : "Camp"; NEW.date = x.start_date || ""; NEW.end = x.end_date || ""; NEW.place = x.place || ""; if (x.section_id && BAS.isAdmin()) NEW.sec = x.section_id; } }
    if (dr) { const d = await supabaseClient.from("drafts").select("*").eq("id", dr).single();
      if (!d.error) { const x = d.data.data || {}; NEW.draft = d.data.id; CART = Object.assign({}, x.cart || {});
        ["kind", "date", "end", "time", "until", "place", "notes", "kids"].forEach(k => { if (x[k] != null && x[k] !== "") NEW[k] = x[k]; });
        if (x.who && x.who[0] === "s" && BAS.isAdmin()) NEW.sec = Number(x.who.slice(1)); if (x.sec && BAS.isAdmin()) NEW.sec = x.sec;
        (x.people || []).forEach(p => { if (p.roster_id) PICK[p.roster_id] = true; else TYPED.push(p); }); } }
    if (QS.get("cart")) { try { const c = JSON.parse(sessionStorage.getItem("basCampCart") || "{}"); Object.assign(CART, c); sessionStorage.removeItem("basCampCart"); } catch (e) {} }
    await loadRosterNew();
    renderNew();
  } catch (e) { $("view").innerHTML = '<div class="msg err">' + esc(BAS.errText(e)) + "</div>"; }
}
async function loadRosterNew() {
  SEC = BAS.allSections.find(s => s.id === NEW.sec) || null;
  ROSTER = await BAS.q(supabaseClient.from("roster").select("*").eq("section_id", NEW.sec).eq("is_active", true).order("name"));
  Object.keys(PICK).forEach(k => { if (!ROSTER.some(x => x.id === Number(k))) delete PICK[k]; });
}
const availOf = key => { const p = key.split(":"), i = BY[Number(p[0])]; if (!i || !i.counted) return 0; if (p[1]) { const v = (i.variants || []).find(x => x.id === Number(p[1])); return v ? v.available : 0; } return i.available || 0; };
function itemRows() {
  const q = BAS.norm(NQ);
  const L = STOCK.filter(i => !q || BAS.norm((i.name_en || "") + " " + (i.name_ar || "") + " " + (i.category || "")).includes(q) || Object.keys(CART).some(k => k.split(":")[0] === String(i.id)));
  const step = k => { const n = CART[k] || 0, max = availOf(k); return '<div class="qty"><button type="button" data-k="' + k + '" data-d="-1"' + (n ? "" : " disabled") + ' aria-label="Less">−</button><span>' + n + '</span><button type="button" data-k="' + k + '" data-d="1"' + (n < max ? "" : " disabled") + ' aria-label="More">+</button></div>'; };
  if (!L.length) return '<div class="empty">No items match.</div>';
  return L.map(i => { const vs = (i.variants || []).filter(v => v.is_active);
    return '<div class="person"><div><b>' + BAS.icon(i.category) + " " + esc(i.name_en) + "</b>" + (i.name_ar ? ' <small class="mut">' + esc(i.name_ar) + "</small>" : "") + (vs.length ? "" : '<div class="meta">Available ' + (i.available || 0) + "</div>") + "</div>" +
      (vs.length ? '<div class="vrows">' + vs.map(v => '<div class="vrow"><span class="vn">' + esc(v.name) + " <small>(" + v.available + ")</small></span>" + step(i.id + ":" + v.id) + "</div>").join("") + "</div>" : step(i.id + ":")) + "</div>"; }).join("");
}
function cartSummary() {
  const L = Object.keys(CART).filter(k => CART[k] > 0);
  const n = L.reduce((t, k) => t + CART[k], 0);
  return L.length ? L.length + (L.length === 1 ? " item · " : " items · ") + n + (n === 1 ? " piece" : " pieces") : "No items chosen yet";
}
function renderNew() {
  document.title = (NEW.kind === "Camp" ? "New camp" : "New trip") + " | BAS Warehouse";
  const secSel = BAS.isAdmin() ? '<div class="field"><label>Stage</label><select id="nSec">' + BAS.sections.map(x => '<option value="' + x.id + '"' + (x.id === NEW.sec ? " selected" : "") + ">" + esc(x.name_ar) + " · " + esc(x.name_en) + "</option>").join("") + "</select></div>"
    : '<div class="field"><label>Stage</label><div class="inline-in">' + BAS.secHTML(NEW.sec) + "</div></div>";
  let h = '<div class="head"><div><p class="eyebrow">' + (NEW.kind === "Camp" ? "⛺ New camp" : "🚌 New trip") + '</p><h1>' + esc(NEW.kind === "Camp" ? "New camp" : "New trip") + "</h1>" +
    '<p class="sub">Fill the details, pick the items (Phase 1) and who is going (Phase 2). You can write the names later too.</p></div></div>' +
    '<div class="tabs"><button class="tab' + (NEW.kind === "Camp" ? " on" : "") + '" data-kind="Camp">⛺ Camp</button><button class="tab' + (NEW.kind === "Trip" ? " on" : "") + '" data-kind="Trip">🚌 Trip</button></div>' +
    '<div class="panel"><h3>Details</h3>' + secSel +
    '<div class="grid2"><div class="field"><label>First day (pickup)</label><input type="date" id="nDate" min="' + BAS.todayISO() + '" value="' + esc(NEW.date) + '"></div><div class="field"><label>Last day</label><input type="date" id="nEnd" min="' + BAS.todayISO() + '" value="' + esc(NEW.end) + '"></div></div>' +
    '<div class="grid2"><div class="field"><label>From</label><input type="time" id="nTime" value="' + esc(NEW.time) + '"></div><div class="field"><label>Until (optional)</label><input type="time" id="nUntil" value="' + esc(NEW.until) + '"></div></div>' +
    '<div class="field"><label>Place</label><input id="nPlace" placeholder="Wadi El Natrun…" value="' + esc(NEW.place) + '"></div>' +
    '<div class="field"><label>Notes</label><textarea id="nNotes">' + esc(NEW.notes) + "</textarea></div></div>" +
    '<div class="panel"><h3>Phase 1: items</h3><p class="meta" id="cartSum">' + esc(cartSummary()) + '</p><input type="search" class="psearch" id="iq" placeholder="Search: shoum, حبل, pot…" value="' + esc(NQ) + '" autocomplete="off"><div id="irows">' + itemRows() + "</div></div>" +
    phase2Form(true) +
    '<div class="panel"><label class="check"><input type="checkbox" id="nOk"> We are responsible for returning all items in good condition.</label></div>' +
    '<div id="nErr" class="msg err" hidden></div><div class="actions"><button class="btn gold" id="nSend">Send ' + (NEW.kind === "Camp" ? "camp" : "trip") + '</button><button class="btn line" id="nDraft">💾 Save draft</button><a class="btn line" href="ohda.html">Cancel</a></div>';
  $("view").innerHTML = h;
  bindNew(); bind();
}
function keepNew() {
  const g = id => $(id) ? $(id).value : "";
  NEW.date = g("nDate"); NEW.end = g("nEnd"); NEW.time = g("nTime"); NEW.until = g("nUntil"); NEW.place = g("nPlace"); NEW.notes = g("nNotes"); NEW.kids = kidsVal();
}
function drawItems() {
  $("irows").innerHTML = itemRows(); $("cartSum").textContent = cartSummary(); if (BAS.tr) $("cartSum").textContent = BAS.tr($("cartSum").textContent);
  $("irows").querySelectorAll("[data-k]").forEach(b => b.onclick = () => {
    const k = b.dataset.k; let n = Math.max(0, Math.min((CART[k] || 0) + Number(b.dataset.d), availOf(k)));
    if (n) CART[k] = n; else delete CART[k]; drawItems();
  });
}
function bindNew() {
  drawItems();
  $("iq").oninput = () => { NQ = $("iq").value; drawItems(); };
  $("view").querySelectorAll("[data-kind]").forEach(b => b.onclick = () => { keepNew(); NEW.kind = b.dataset.kind; renderNew(); });
  if ($("nSec")) $("nSec").onchange = async () => { keepNew(); NEW.sec = Number($("nSec").value); PICK = {}; await loadRosterNew(); renderNew(); };
  $("nDraft").onclick = async () => {
    keepNew();
    const data = { kind: NEW.kind, date: NEW.date, end: NEW.end, time: NEW.time, until: NEW.until, place: NEW.place, notes: NEW.notes, kids: NEW.kids, cart: CART, sec: NEW.sec, people: chosenPeople() };
    const names = Object.keys(CART).map(k => (BY[Number(k.split(":")[0])] || {}).name_en + " ×" + CART[k]);
    const row = { title: (NEW.kind === "Camp" ? "⛺ " : "🚌 ") + (NEW.date ? BAS.fmtDate(NEW.date, true) + " · " : "") + (NEW.place || names.slice(0, 2).join(", ") || "No items yet"), data, section_id: NEW.sec, updated_at: new Date().toISOString() };
    const r = NEW.draft ? await supabaseClient.from("drafts").update(row).eq("id", NEW.draft).select().single() : await supabaseClient.from("drafts").insert(Object.assign(row, { created_by: BAS.user.id })).select().single();
    if (r.error) return BAS.toast(BAS.errText(r.error), "err");
    NEW.draft = r.data.id; BAS.toast("Draft saved. Nothing is booked yet.");
  };
  $("nSend").onclick = async () => {
    keepNew();
    const err = $("nErr"), fail = m => { err.textContent = BAS.tr ? BAS.tr(m) : m; err.hidden = false; };
    err.hidden = true;
    const miss = []; if (!NEW.date) miss.push("the first day"); if (!NEW.end) miss.push("the last day"); if (!NEW.time) miss.push("the time"); if (!NEW.place.trim()) miss.push("the place");
    if (miss.length) return fail("Fill in " + miss.join(", ") + ".");
    const items = Object.keys(CART).filter(k => CART[k] > 0).map(k => { const p = k.split(":"); return { item_id: Number(p[0]), variant_id: p[1] ? Number(p[1]) : null, qty: CART[k] }; });
    if (!items.length) return fail("Pick at least one item (Phase 1).");
    if (!$("nOk").checked) return fail("Tick the box to confirm first.");
    const b = $("nSend"); b.disabled = true;
    const res = await supabaseClient.rpc("create_reservation", { p_meeting_date: NEW.date, p_meeting_time: fmtTimes(NEW.time, NEW.until), p_place: NEW.place.trim(), p_notes: NEW.notes, p_items: items,
      p_section_id: BAS.isAdmin() ? NEW.sec : null, p_service_id: null, p_kind: NEW.kind, p_end_date: NEW.end, p_event_id: NEW.event });
    if (res.error) { b.disabled = false; return fail(BAS.errText(res.error)); }
    const people = chosenPeople();
    if (people.length) {
      const r2 = await supabaseClient.rpc("set_trip_people", { p_res: res.data, p_people: people, p_kids: has3() ? null : NEW.kids });
      if (r2.error) BAS.toast(BAS.errText(r2.error), "err");
    }
    if (NEW.draft) await supabaseClient.from("drafts").delete().eq("id", NEW.draft);
    BAS.toast((NEW.kind === "Camp" ? "Camp" : "Trip") + " sent ✓");
    location.href = "camp.html?id=" + res.data + (people.length ? "#p1" : "#p2");
  };
}
function to12(v) { if (!v) return ""; let [h, m] = v.split(":").map(Number); const ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12; return h + ":" + String(m).padStart(2, "0") + " " + ap; }
function fmtTimes(a, b) { return a ? to12(a) + (b ? " – " + to12(b) : "") : ""; }

// ---------- 3ohda ----------
const W = { light: 1, medium: 2, heavy: 3 };
function autoDistribute() {
  const people = PEOPLE.map(p => ({ id: p.id, gender: p.gender, role: p.role, load: 0 }));
  const cap = p => (p.role === "kada" ? 1.5 : 1) * (p.gender === "F" ? 0.75 : 1);
  const lines = R.items.filter(l => qtyOf(l) > 0).map(l => { const it = BY[l.item_id] || {}; return { key: l.item_id + ":" + (l.variant_id || ""), item_id: l.item_id, variant_id: l.variant_id, qty: qtyOf(l), w: W[it.weight] || 1, kada: !!it.kada_only, max: it.max_per_person }; })
    .sort((a, b) => b.w - a.w || b.qty - a.qty);
  const grid = {};
  people.forEach(p => { grid[p.id] = {}; });
  lines.forEach(l => {
    let elig = people.filter(p => (!l.kada || p.role === "kada") && (l.w < 3 || p.gender === "M" || p.role === "kada"));
    if (!elig.length) elig = people.filter(p => !l.kada || p.role === "kada");
    if (!elig.length) elig = people;
    const chunk = l.max || (l.qty >= 20 ? 10 : l.qty >= 6 ? 3 : 1);
    let left = l.qty;
    while (left > 0) {
      elig.sort((a, b) => a.load / cap(a) - b.load / cap(b) || Math.random() - .5);
      const p = elig[0], n = Math.min(chunk, left);
      grid[p.id][l.key] = (grid[p.id][l.key] || 0) + n;
      p.load += n * l.w; left -= n;
    }
  });
  return grid;
}
function currentGrid() {
  if (GRID) return GRID;
  const g = {}; PEOPLE.forEach(p => { g[p.id] = {}; });
  CUST.forEach(c => { if (g[c.person_id]) g[c.person_id][c.item_id + ":" + (c.variant_id || "")] = c.qty; });
  return g;
}
function ohdaView() {
  const g = currentGrid(), cols = R.items.filter(l => qtyOf(l) > 0), admin = BAS.isAdmin();
  const tot = {}; cols.forEach(l => { const k = l.item_id + ":" + (l.variant_id || ""); tot[k] = PEOPLE.reduce((t, p) => t + Number(g[p.id][k] || 0), 0); });
  const custOf = (pid, k) => CUST.find(c => c.person_id === pid && c.item_id + ":" + (c.variant_id || "") === k);
  const issued = BAS.OUT.indexOf(R.status) >= 0 || R.status === "Returned";
  let h = (admin ? '<div class="actions" style="margin:0 0 10px"><button class="btn gold" id="ohAuto">🎲 Distribute automatically</button>' + (GRID ? '<button class="btn ok" id="ohSave">Save 3ohda</button><button class="btn line" id="ohUndo">Undo changes</button>' : "") +
      '<span class="meta">Heavy items go to boys and kada, kada carry more, "kada only" items (like flags) go to kada. Change any number, then save.</span></div>' : "") +
    (!CUST.length && !GRID ? '<div class="empty">' + (admin ? "Not distributed yet. Press Distribute automatically." : "The warehouse team hasn't distributed the items yet.") + "</div>" :
    '<div class="panel tscroll"><table class="ltable ohgrid"><tr><th>Person</th>' + cols.map(l => '<th class="num">' + esc(BAS.lineName(l)) + "<br><small>" + (BAS.tr ? BAS.tr((BY[l.item_id] || {}).weight || "light") : "") + "</small></th>").join("") + "</tr>" +
      PEOPLE.map(p => "<tr><td>" + gTag(p.gender) + " " + esc(p.name) + ' <small class="mut">' + esc(roleName(p.role)) + "</small></td>" + cols.map(l => {
        const k = l.item_id + ":" + (l.variant_id || ""), v = g[p.id][k] || 0, c = custOf(p.id, k);
        if (admin && (GRID || !issued)) return '<td class="num"><input type="number" min="0" value="' + v + '" data-cell="' + p.id + "|" + k + '"></td>';
        if (admin && c && issued) return '<td class="num">' + c.qty + ' <button class="linkbtn sm" data-back="' + c.id + '" data-q="' + c.qty + '">' + (c.returned_qty >= c.qty ? "✅" : "↩ " + c.returned_qty + "/" + c.qty) + "</button></td>";
        return '<td class="num">' + (v || "") + (c && c.returned_qty >= c.qty && c.qty ? " ✅" : "") + "</td>";
      }).join("") + "</tr>").join("") +
      '<tr><td><b>Total</b></td>' + cols.map(l => { const k = l.item_id + ":" + (l.variant_id || ""); const ok = tot[k] === qtyOf(l); return '<td class="num"><b class="' + (ok ? "" : "bad") + '">' + tot[k] + " / " + qtyOf(l) + "</b></td>"; }).join("") + "</tr></table></div>" +
      (admin && issued && CUST.length && !GRID ? '<p class="meta">Tap ↩ to mark what each person gave back. <button class="linkbtn" id="ohEdit">Edit the numbers</button></p>' : ""));
  return h;
}

function bind() {
  const on = (id, fn) => { if ($(id)) $(id).onclick = fn; };
  on("p2Edit", () => { EDITP2 = true; render(); });
  on("p2Cancel", () => { EDITP2 = false; render(); });
  $("view").querySelectorAll("[data-pk]").forEach(c => c.onchange = () => { PICK[c.dataset.pk] = c.checked; c.closest(".pick").classList.toggle("on", c.checked); });
  if ($("pq")) $("pq").oninput = () => { const q = BAS.norm($("pq").value); $("view").querySelectorAll(".pick[data-nm]").forEach(l => { l.hidden = !!q && !l.dataset.nm.includes(q); }); };
  on("nAdd", async () => {
    const names = $("nNames").value.trim(); if (!names) return BAS.toast("Write the name", "err");
    if (NEW) keepNew();
    const before = ROSTER.map(x => x.id);
    const { data, error } = await supabaseClient.rpc("add_names", { p_section: secOf(), p_names: names, p_gender: $("nGen").value, p_role: $("nRole").value, p_tali3a: null });
    if (error) return BAS.toast(BAS.errText(error), "err");
    ROSTER = await BAS.q(supabaseClient.from("roster").select("*").eq("section_id", secOf()).eq("is_active", true).order("name"));
    ROSTER.filter(x => before.indexOf(x.id) < 0).forEach(x => { PICK[x.id] = true; });
    BAS.toast("Added: " + data); NEW ? renderNew() : render();
  });
  $("view").querySelectorAll("[data-ren]").forEach(b => b.onclick = async e => {
    e.preventDefault(); const p = ROSTER.find(x => x.id === Number(b.dataset.ren));
    const n = prompt("New name:", p.name); if (!n || !n.trim()) return;
    const r = await supabaseClient.from("roster").update({ name: n.trim() }).eq("id", p.id);
    if (r.error) return BAS.toast(BAS.errText(r.error), "err");
    p.name = n.trim(); if (NEW) { keepNew(); renderNew(); } else render();
  });
  $("view").querySelectorAll("[data-hide]").forEach(b => b.onclick = async e => {
    e.preventDefault(); const p = ROSTER.find(x => x.id === Number(b.dataset.hide));
    if (!confirm("Remove " + p.name + " from the stage's list? Past trips keep the name.")) return;
    const r = await supabaseClient.from("roster").update({ is_active: false }).eq("id", p.id);
    if (r.error) return BAS.toast(BAS.errText(r.error), "err");
    ROSTER = ROSTER.filter(x => x.id !== p.id); delete PICK[p.id]; if (NEW) { keepNew(); renderNew(); } else render();
  });
  on("tAdd", () => { const n = $("tName").value.trim(); if (!n) return BAS.toast("Write the name", "err"); TYPED.push({ name: n, gender: $("tGen").value, role: $("tRole").value }); if (NEW) { keepNew(); renderNew(); } else render(); });
  $("view").querySelectorAll("[data-tdel]").forEach(b => b.onclick = () => { TYPED.splice(Number(b.dataset.tdel), 1); if (NEW) { keepNew(); renderNew(); } else render(); });
  on("p2Save", async () => {
    const people = chosenPeople();
    if (!people.length) { $("p2Err").textContent = "Choose at least one person."; $("p2Err").hidden = false; return; }
    const { error } = await supabaseClient.rpc("set_trip_people", { p_res: ID, p_people: people, p_kids: has3() ? null : kidsVal() });
    if (error) { $("p2Err").textContent = BAS.errText(error); $("p2Err").hidden = false; return; }
    BAS.toast("Saved: " + people.length + " people"); TAB = "p2"; load();
  });
  on("ohAuto", () => { GRID = autoDistribute(); render(); });
  on("ohEdit", () => { GRID = currentGrid(); render(); });
  on("ohUndo", () => { GRID = null; render(); });
  $("view").querySelectorAll("[data-cell]").forEach(inp => inp.onchange = () => {
    const p = inp.dataset.cell.split("|"); if (!GRID) GRID = currentGrid();
    GRID[p[0]][p[1]] = Math.max(0, Number(inp.value) || 0); render();
  });
  on("ohSave", async () => {
    const rows = [];
    Object.keys(GRID).forEach(pid => Object.keys(GRID[pid]).forEach(k => { const n = Number(GRID[pid][k]); if (n > 0) { const s = k.split(":"); rows.push({ person_id: Number(pid), item_id: Number(s[0]), variant_id: s[1] ? Number(s[1]) : null, qty: n }); } }));
    const bad = R.items.some(l => { const k = l.item_id + ":" + (l.variant_id || ""); return qtyOf(l) > 0 && Object.keys(GRID).reduce((t, pid) => t + Number(GRID[pid][k] || 0), 0) !== qtyOf(l); });
    if (bad && !confirm("Some totals don't match the items. Save anyway?")) return;
    const { error } = await supabaseClient.rpc("set_custody", { p_res: ID, p_rows: rows });
    if (error) return BAS.toast(BAS.errText(error), "err");
    BAS.toast("3ohda saved"); load();
  });
  $("view").querySelectorAll("[data-back]").forEach(b => b.onclick = async () => {
    const q = Number(b.dataset.q), v = prompt("How many did they give back? (0 to " + q + ")", String(q));
    if (v === null) return;
    const { error } = await supabaseClient.rpc("custody_return", { p_id: Number(b.dataset.back), p_returned: Number(v) });
    if (error) return BAS.toast(BAS.errText(error), "err");
    load();
  });
}
